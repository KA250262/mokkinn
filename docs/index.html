<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>メロころ♪</title>

<script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<script src="https://unpkg.com/pitchy@4.1.0/dist/pitchy.umd.js"></script>
<style>

body{
  background:#111;
  color:white;
  text-align:center;
  font-family:sans-serif;
  overflow-x:hidden;
}

h1{
  color:#ffb3d9;
  text-shadow:0 0 10px hotpink;
}

#ui{
  margin:10px;
  font-size:20px;
}


button{
  font-size:18px;
  padding:8px 18px;
  border:none;
  border-radius:10px;
  background:#ff7ac8;
  color:white;
  cursor:pointer;
}

button:hover{
  transform:scale(1.05);
}

#score{ color:gold; }
#combo{ color:lime; }

#judge{
  height:40px;
  font-size:32px;
  font-weight:bold;
  margin:5px;
}

/* ================= GAME AREA ================= */

#gameArea{
  position:relative;
  width:1000px;
  height:520px;
  margin:auto;

  background-size:contain;

  background-color:#222;

  border:3px solid #555;
  border-radius:20px;

  overflow:hidden;
}

.combo-bounce{
  animation: comboBounce 0.5s ease;
}

#mascot{
  position:absolute;

  width:100%;
  height:100%;

  object-fit:contain;

  left:0;
  top:0;

  pointer-events:none;
}

/* 判定ライン */

#line{
  position:absolute;
  top:420px;
  width:100%;
  height:14px;
  opacity: 0.9;

  background:linear-gradient(
    to bottom,
    #fff176,
    #ffd600
  );

  border-radius:20px;

  box-shadow:
    0 0 10px yellow,
    0 0 25px orange;
}

/* ノーツ */

.note{
  position:absolute;
  width:46px;
  height:46px;
  border-radius:50%;

  background:linear-gradient(
    135deg,
    #ffb3d9,
    #ff4fa3
  );

  transform:translateX(-50%);

  box-shadow:
    0 0 10px hotpink;

  transition:
    transform 0.05s,
    filter 0.05s;
}

.note-text{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  font-size:18px;
  font-weight:bold;
  color:white;
  text-shadow:0 0 5px black;
  pointer-events:none;
}

/*
@keyframes comboBounce {

  0%{
    transform:scale(1);
  }

  30%{
    transform:scale(1.03) rotate(-1deg);
  }

  60%{
    transform:scale(1.03) rotate(1deg);
  }

  100%{
    transform:scale(1);
  }

}
*/
@keyframes comboBounce {

  0%{
    transform:scale(1);
  }

  30%{
    transform:scale(1.03) rotate(-1deg);
  }

  60%{
    transform:scale(1.03) rotate(1deg);
  }

  100%{
    transform:scale(1);
  }

}
.bubble-out {
  animation: bubblePop 0.25s ease-out forwards;
}

/* ================= KEYBOARD ================= */

#keyboard{
  position:relative;
  width:1000px;
  height:180px;
  margin:auto;
  margin-top: -5px;
  left:8px;
}

.key{
  position:absolute;
  width:50px;
  height:180px;

  background:white;
  border:1px solid #333;

  border-radius:0 0 8px 8px;
}

.black{
  position:absolute;

  width:34px;
  height:110px;

  background:#222;
  border:2px solid white;

  border-radius:0 0 6px 6px;

  z-index:10;
}

.hit{
  background:#7CFF6B !important;
}

.next{

  background:#7cf7ff !important;

  box-shadow:
    0 0 20px cyan,
    0 0 40px cyan;

}

#debug{
  position: fixed;
  right: 10px;
  bottom: 10px;
  background: rgba(0,0,0,0.7);
  padding: 10px;
  font-size: 14px;
  text-align: left;
  border-radius: 8px;
  color: white;
}
</style>
</head>

<body>

<h1>メロころ♪</h1>

<div id="ui">
<button onclick="setSpeed(0.25)">ゆっくり</button>
<button onclick="setSpeed(0.5)">ふつう</button>
<button onclick="setSpeed(0.75)">はやい</button>

<input type="file" id="midiFile">

<button onclick="startGame()">再生</button>

<button onclick="stopGame()">停止</button>

<br><br>

<span id="speedLabel"></span>

スコア:
<span id="score">0</span>


コンボ:
<span id="combo">0</span>
<br><br>

マイク音量:
<span id="micVolume">0</span>
<div id="debug"></div>
<br><br>


検出音:
<span id="detectedNote">---</span>
<br><br>

精度:
<span id="clarity">0</span>

</div>

<div id="judge"></div>

<div id="gameArea">

  <img id="mascot" src="melokoro.png">

  <div id="line"></div>

</div>

<div id="keyboard"></div>

<script>

/* ================= AUDIO ================= */

const synth = new Tone.PolySynth(
  Tone.Synth,
  {
    oscillator:{
      type:"triangle"
    }
  }
).toDestination();

/* ================= STATE ================= */
let mic;
let analyser;

let notes = [];
let active = [];

let score = 0;
let combo = 0;

let running = false;

let startTime = 0;
let index = 0;
let speed = 1;

function getTime(){
  return ((performance.now() - startTime) / 1000 - 5) * speed;
}

const noteMap = {
  "C":"ど",
  "D":"れ",
  "E":"み",
  "F":"ふぁ",
  "G":"そ",
  "A":"ら",
  "B":"し"
};

/* ================= SETTINGS ================= */

const travelTime = 6;

const hitY = 400;
const spawnY = -80;

/* ================= KEYBOARD ================= */

const keys = [

"C4","C#4","D4","D#4","E4","F4","F#4","G4","G#4","A4","A#4","B4",

"C5","C#5","D5","D#5","E5","F5","F#5","G5","G#5","A5","A#5","B5",

"C6","C#6","D6","D#6","E6","F6","F#6","G6","G#6","A6"

];

const kb = document.getElementById("keyboard");

let x = 0;

keys.forEach(n=>{

  const k = document.createElement("div");

  k.dataset.note = n;

  k.className =
    n.includes("#")
    ? "black"
    : "key";

  if(!n.includes("#")){

    k.style.left = x + "px";

    x += 50;

  }else{

    k.style.left = (x - 20) + "px";
  }

  kb.appendChild(k);

});

/* ================= MIDI LOAD ================= */

document.getElementById("midiFile")
.addEventListener("change", async (e)=>{

  try{

    const file = e.target.files[0];

    const buf = await file.arrayBuffer();

    /* 保存 */
    const array =
      Array.from(new Uint8Array(buf));

    localStorage.setItem(
      "savedMidi",
      JSON.stringify(array)
    );

    loadMidi(buf);

  }catch(err){

    console.error(err);

    alert("MIDI読み込み失敗");
  }

});

/* ================= AUTO LOAD ================= */

window.addEventListener("load", async ()=>{
    console.log(window.Pitchy);

  const saved =
    localStorage.getItem("savedMidi");

  if(saved){

    const array =
      JSON.parse(saved);

    const uint =
      new Uint8Array(array);

    loadMidi(uint.buffer);

  }

  micLoop();

});

/* ================= MIDI PARSE ================= */

function loadMidi(buffer){

  const midi = new Midi(buffer);

  notes = [];

  midi.tracks.forEach(t=>{

    t.notes.forEach(n=>{

      notes.push({
        time:n.time,
        note:n.name
      });

    });

  });

  notes.sort((a,b)=>a.time-b.time);

  console.log("MIDI OK:", notes.length);

}

/* ================= MIC ================= */

async function startMic(){

  if(mic) return; 

  mic = new Tone.UserMedia();

  await mic.open();

  analyser = new Tone.Analyser("waveform", 1024);

  mic.connect(analyser);

  console.log("マイクON");
}

/* ================= START ================= */

async function startGame(){

  await Tone.start();
  if(!mic){

  await startMic();

}

  if(!notes.length){

    alert("MIDIを読み込んでね");

    return;
  }

  stopGame();

  score = 0;
  combo = 0;

  update();

  running = true;

  index = 0;

  startTime =
    performance.now();

  countdown(3);

}

/* ================= COUNTDOWN ================= */

function countdown(n){

  const judge =
    document.getElementById("judge");

  judge.textContent = n;

  if(n <= 0){

    judge.textContent = "START!";

    setTimeout(()=>{
      judge.textContent = "";
    },800);

    requestAnimationFrame(loop);

    return;
  }

  setTimeout(()=>{
    countdown(n-1);
  },1000);

}

/* ================= STOP ================= */

function stopGame(){

  running = false;

  active.forEach(n=>n.el.remove());

  active = [];

}



/* ================= PITCH ================= */

function freqToNote(freq){

  const noteNum =
    12 * Math.log2(freq / 440) + 69;

  const rounded =
    Math.round(noteNum);

  const names = [
    "C","C#","D","D#","E","F",
    "F#","G","G#","A","A#","B"
  ];

  const octave =
    Math.floor(rounded / 12) - 1;

  const name =
    names[rounded % 12];

  return name + octave;

}

/* ================= MIC LOOP ================= */
function micLoop(){

  if(!analyser){
    requestAnimationFrame(micLoop);
    return;
  }

  const data = analyser.getValue();

let pitch = 0;
let clarity = 0;

let volume = 0;
for(let i = 0; i < data.length; i++){
  volume += Math.abs(data[i]);
}
volume /= data.length;

const PitchyLib = window.Pitchy?.default ?? window.Pitchy;

if (PitchyLib?.findPitch) {
  [pitch, clarity] =
    PitchyLib.findPitch(data, Tone.context.sampleRate);
}

document.getElementById("debug").innerHTML =
  `pitch: ${pitch.toFixed(1)}<br>
   clarity: ${clarity.toFixed(2)}<br>
   volume: ${volume.toFixed(3)}`;

  if (pitch && volume > 0.01) {

  const note = freqToNote(pitch);

  hit(note);

  document.getElementById("detectedNote").textContent = note;
  document.getElementById("clarity").textContent = clarity.toFixed(2);
}

  // 音量表示（常に更新）
  document.getElementById("micVolume").textContent = volume.toFixed(3);

  requestAnimationFrame(micLoop);
}
/* ================= loop ================= */
function loop(){

  if(!running) return;

  const now = performance.now();

  const t = getTime();

  /* ノーツ生成 */
  while(
    index < notes.length &&
    notes[index].time <= t + travelTime
  ){
    spawn(notes[index]);
    index++;
  }

  /* 次ノーツ表示 */
  document.querySelectorAll(".next")
    .forEach(x=>x.classList.remove("next"));

  let nearest = null;
  let nearestDiff = 999;

  active.forEach(n=>{
    const diff = Math.abs((n.hit - 0.15) - t);
    if(diff < nearestDiff){
      nearestDiff = diff;
      nearest = n;
    }
  });

  if(nearest){
    const nextKey =
      document.querySelector(`[data-note="${nearest.note}"]`);
    if(nextKey){
      nextKey.classList.add("next");
    }
  }

  /* ノーツ更新 */
  active.forEach(n=>{

    const p =
      1 - ((n.hit - t)/travelTime);

    const y =
      spawnY + p*(hitY - spawnY);

    n.el.style.top = y + "px";

    if(Math.abs(y - hitY) < 50){
      n.el.style.filter = "brightness(2.2)";
      n.el.style.transform = "translateX(-50%) scale(1.2)";
    }else{
      n.el.style.filter = "brightness(1)";
      n.el.style.transform = "translateX(-50%) scale(1)";
    }

    /* MISS */
    if(n.hit + 0.4 < t){
      n.el.remove();
      active = active.filter(x=>x!==n);
      combo = 0;
      showJudge("MISS");
      update();
    }

  });

  if(index >= notes.length && active.length === 0){
    running = false;
    document.getElementById("judge").textContent = "FINISH!";
    return;
  }

  requestAnimationFrame(loop);
}

/* ================= SPAWN ================= */

function spawn(n){

  const key =
    document.querySelector(
      `[data-note="${n.note}"]`
    );

  if(!key) return;

  const g =
    document.getElementById("gameArea")
    .getBoundingClientRect();

  const k =
    key.getBoundingClientRect();

  const el =
    document.createElement("div");

  el.className = "note";

  el.style.left =
    (k.left - g.left + k.width/2)
    + "px";

  const text = document.createElement("div");
  text.className = "note-text";
  text.textContent = noteMap[n.note[0]];

  el.appendChild(text);

  document
    .getElementById("gameArea")
    .appendChild(el);

  active.push({
    el,
    note:n.note,
    hit:n.time
  });

}

/* ================= HIT ================= */

function hit(note){

  const t = getTime();
  console.log(note, active.map(n=>n.note));

  const JUDGE_WINDOW = 0.25;

  let best = null;
  let bestDiff = 999;

  active.forEach(n=>{

    if(n.note !== note) return;

    const diff = n.hit - t;

    if(diff > JUDGE_WINDOW) return;
    if(diff < -JUDGE_WINDOW) return;

    const absDiff = Math.abs(diff);

    if(absDiff < bestDiff){
      bestDiff = absDiff;
      best = n;
    }

  });

  synth.triggerAttackRelease(note,"8n", undefined, 0.9);

  if(best && bestDiff < 0.15){

  success(best,note);

  score += 300;
  addScoreEffect(300);

  combo++;

  comboEffect();

  showJudge("PERFECT");

} else if(best && bestDiff < 0.3){

  success(best,note);

  score += 100;
  addScoreEffect(100);

  combo++;

  showJudge("GOOD");

} else {

  combo = 0;

  showJudge("MISS");
}

update();

}

/* ================= SUCCESS ================= */

function success(best, note){

  best.el.style.transform =
    "translateX(-50%) scale(1.8)";

  best.el.style.filter =
    "brightness(3)";

  best.el.classList.add("bubble-out");

  setTimeout(()=>{
    best.el.remove();
  },250);

  active =
    active.filter(n=>n!==best);
}
/* ================= INPUT ================= */



/* ================= UI ================= */

function update(){
  document.getElementById("score").textContent = score;
  document.getElementById("combo").textContent = combo;
}


function addScoreEffect(value){

  const el = document.getElementById("score");

  el.style.transform = "scale(1.3)";
  el.style.color = "yellow";

  setTimeout(()=>{
    el.style.transform = "scale(1)";
    el.style.color = "gold";
  },100);

}

function setSpeed(v){

  speed = v;

  const label =
    v === 0.25 ? "ゆっくり" :
    v === 0.5 ? "ふつう" :
    "はやい";

  document.getElementById("speedLabel")
    .textContent = label;

}

/* ================= JUDGE ================= */

function showJudge(text){

  const j =
    document.getElementById("judge");

  j.textContent = text;

  /* ★追加 */
  j.style.transform = "scale(1.4)";
  j.style.opacity = "1";

  if(text === "PERFECT"){
    j.style.color = "gold";
  }else if(text === "GOOD"){
    j.style.color = "cyan";
  }else{
    j.style.color = "red";
  }

  clearTimeout(j.timer);

  j.timer = setTimeout(()=>{

    j.textContent = "";
    j.style.transform = "scale(1)";
    j.style.opacity = "0.7";

  },500);
}

function comboEffect(){
  return;


  const mascot =
    document.getElementById("mascot");

  mascot.classList.remove("combo-bounce");

  void mascot.offsetWidth;

  mascot.classList.add("combo-bounce");

}
</script>

</body>
</html>
