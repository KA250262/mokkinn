<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>メロころ♪</title>

<script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>

<style>

body{
  background:#111;
  color:white;
  text-align:center;
  font-family:sans-serif;
  overflow-x:hidden;
}

h1{
  color:#ffb3d9;
  text-shadow:0 0 10px hotpink;
}

#ui{
  margin:10px;
  font-size:20px;
}


button{
  font-size:18px;
  padding:8px 18px;
  border:none;
  border-radius:10px;
  background:#ff7ac8;
  color:white;
  cursor:pointer;
}

button:hover{
  transform:scale(1.05);
}

#score{ color:gold; }
#combo{ color:lime; }

#judge{
  height:40px;
  font-size:32px;
  font-weight:bold;
  margin:5px;
}

/* ================= GAME AREA ================= */

#gameArea{
  position:relative;
  width:1000px;
  height:520px;
  margin:auto;

  background-image:url("melokoro.png");
  background-size:contain;
  background-position:center;
  background-repeat:no-repeat;

  background-color:#222;

  border:3px solid #555;
  border-radius:20px;

  overflow:hidden;
}

/* 判定ライン */

#line{
  position:absolute;
  top:400px;
  width:100%;
  height:14px;

  background:linear-gradient(
    to bottom,
    #fff176,
    #ffd600
  );

  border-radius:20px;

  box-shadow:
    0 0 10px yellow,
    0 0 25px orange;
}

/* ノーツ */

.note{
  position:absolute;
  width:46px;
  height:46px;
  border-radius:50%;

  background:linear-gradient(
    135deg,
    #ffb3d9,
    #ff4fa3
  );

  transform:translateX(-50%);

  box-shadow:
    0 0 10px hotpink;

  transition:
    transform 0.05s,
    filter 0.05s;
}

.note-text{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  font-size:18px;
  font-weight:bold;
  color:white;
  text-shadow:0 0 5px black;
  pointer-events:none;
}

/* ================= KEYBOARD ================= */

#keyboard{
  position:relative;
  width:1000px;
  height:180px;
  margin:auto;
  left:8px;
}

.key{
  position:absolute;
  width:50px;
  height:180px;

  background:white;
  border:1px solid #333;

  border-radius:0 0 8px 8px;
}

.black{
  position:absolute;

  width:34px;
  height:110px;

  background:#222;
  border:2px solid white;

  border-radius:0 0 6px 6px;

  z-index:10;
}

.hit{
  background:#7CFF6B !important;
}

.next{

  background:#7cf7ff !important;

  box-shadow:
    0 0 20px cyan,
    0 0 40px cyan;

}

</style>
</head>

<body>

<h1>メロころ♪</h1>

<div id="ui">

<input type="file" id="midiFile">

<button onclick="startGame()">再生</button>

<button onclick="stopGame()">停止</button>
<button onclick="setSpeed(0.5)">0.5x</button>
<button onclick="setSpeed(0.75)">0.75x</button>
<button onclick="setSpeed(1)">1.0x</button>
<br><br>

スコア:
<span id="score">0</span>

　

コンボ:
<span id="combo">0</span>

</div>

<div id="judge"></div>

<div id="gameArea">
  <div id="line"></div>
</div>

<div id="keyboard"></div>

<script>

/* ================= AUDIO ================= */

const synth = new Tone.Synth({
  oscillator:{
    type:"triangle"
  }
}).toDestination();

/* ================= STATE ================= */

let notes = [];
let active = [];

let score = 0;
let combo = 0;

let running = false;

let startTime = 0;
let index = 0;
let speed = 1;

const noteMap = {
  "C":"ド",
  "D":"レ",
  "E":"ミ",
  "F":"ファ",
  "G":"ソ",
  "A":"ラ",
  "B":"シ"
};

/* ================= SETTINGS ================= */

const travelTime = 6;

const hitY = 400;
const spawnY = -80;

/* ================= KEYBOARD ================= */

const keys = [

"C4","C#4","D4","D#4","E4","F4","F#4","G4","G#4","A4","A#4","B4",

"C5","C#5","D5","D#5","E5","F5","F#5","G5","G#5","A5","A#5","B5",

"C6","C#6","D6","D#6","E6","F6","F#6","G6","G#6","A6"

];

const kb = document.getElementById("keyboard");

let x = 0;

keys.forEach(n=>{

  const k = document.createElement("div");

  k.dataset.note = n;

  k.className =
    n.includes("#")
    ? "black"
    : "key";

  if(!n.includes("#")){

    k.style.left = x + "px";

    x += 50;

  }else{

    k.style.left = (x - 20) + "px";
  }

  kb.appendChild(k);

});

/* ================= MIDI LOAD ================= */

document.getElementById("midiFile")
.addEventListener("change", async (e)=>{

  try{

    const file = e.target.files[0];

    const buf = await file.arrayBuffer();

    /* 保存 */
    const array =
      Array.from(new Uint8Array(buf));

    localStorage.setItem(
      "savedMidi",
      JSON.stringify(array)
    );

    loadMidi(buf);

  }catch(err){

    console.error(err);

    alert("MIDI読み込み失敗");
  }

});

/* ================= AUTO LOAD ================= */

window.addEventListener("load", async ()=>{

  const saved =
    localStorage.getItem("savedMidi");

  if(!saved) return;

  const array = JSON.parse(saved);

  const uint = new Uint8Array(array);

  loadMidi(uint.buffer);

});

/* ================= MIDI PARSE ================= */

function loadMidi(buffer){

  const midi = new Midi(buffer);

  notes = [];

  midi.tracks.forEach(t=>{

    t.notes.forEach(n=>{

      notes.push({
        time:n.time,
        note:n.name
      });

    });

  });

  notes.sort((a,b)=>a.time-b.time);

  console.log("MIDI OK:", notes.length);

}

/* ================= START ================= */

async function startGame(){

  await Tone.start();

  if(!notes.length){

    alert("MIDIを読み込んでね");

    return;
  }

  stopGame();

  score = 0;
  combo = 0;

  update();

  running = true;

  index = 0;

  startTime =
    performance.now();

  countdown(3);

}

/* ================= COUNTDOWN ================= */

function countdown(n){

  const judge =
    document.getElementById("judge");

  judge.textContent = n;

  if(n <= 0){

    judge.textContent = "START!";

    setTimeout(()=>{
      judge.textContent = "";
    },800);

    requestAnimationFrame(loop);

    return;
  }

  setTimeout(()=>{
    countdown(n-1);
  },1000);

}

/* ================= STOP ================= */

function stopGame(){

  running = false;

  active.forEach(n=>n.el.remove());

  active = [];

}

/* ================= LOOP ================= */

function loop(){

  if(!running) return;

  const now = performance.now();

  const t =
  ((now - startTime)/1000 - 5) * speed;

  /* ノーツ生成 */

  while(
    index < notes.length &&
    notes[index].time <= t + travelTime
  ){

    spawn(notes[index]);

    index++;
  }

  /* 今いちばん近いノーツを光らせる */

document.querySelectorAll(".next")
  .forEach(x=>x.classList.remove("next"));

let nearest = null;
let nearestDiff = 999;

active.forEach(n=>{

  const diff = Math.abs((n.hit - 0.5) - t);

  if(diff < nearestDiff){

    nearestDiff = diff;
    nearest = n;
  }

});

if(nearest){

  const nextKey =
    document.querySelector(
      `[data-note="${nearest.note}"]`
    );

  if(nextKey){
    nextKey.classList.add("next");
  }

}

  /* 更新 */

  active.forEach(n=>{

    const p =
      1 - ((n.hit - t)/travelTime);

    const y =
      spawnY +
      p*(hitY - spawnY);

    n.el.style.top = y + "px";

    /* ライン近くで光る */

    if(Math.abs(y - hitY) < 50){

      n.el.style.filter =
        "brightness(2.2)";

      n.el.style.transform =
        "translateX(-50%) scale(1.2)";

    }else{

      n.el.style.filter =
        "brightness(1)";

      n.el.style.transform =
        "translateX(-50%) scale(1)";
    }

    /* ミス */

    if(p > 1.2){

      n.el.remove();

      active =
        active.filter(x=>x!==n);

      combo = 0;

      showJudge("MISS");

      update();

    }

  });

  /* 曲終了 */

  if(
    index >= notes.length &&
    active.length === 0
  ){

    running = false;

    document.getElementById("judge")
      .textContent = "FINISH!";

    return;
  }

  requestAnimationFrame(loop);

}

/* ================= SPAWN ================= */

function spawn(n){

  const key =
    document.querySelector(
      `[data-note="${n.note}"]`
    );

  if(!key) return;

  const g =
    document.getElementById("gameArea")
    .getBoundingClientRect();

  const k =
    key.getBoundingClientRect();

  const el =
    document.createElement("div");

  el.className = "note";

  el.style.left =
    (k.left - g.left + k.width/2)
    + "px";

  const text = document.createElement("div");
  text.className = "note-text";
  text.textContent = noteMap[n.note[0]];

  el.appendChild(text);

  document
    .getElementById("gameArea")
    .appendChild(el);

  active.push({
    el,
    note:n.note,
    hit:n.time
  });

}

/* ================= HIT ================= */

function hit(note){

  const now =
  ((performance.now()-startTime)/1000 - 3) * speed;

  let best = null;
  let bestDiff = 999;

  active.forEach(n=>{

    if(n.note !== note) return;

    const diff = Math.abs(n.hit - now);

    if(diff < bestDiff){

      bestDiff = diff;
      best = n;
    }

  });

  /* 音は必ず鳴らす */
  synth.triggerAttackRelease(note,"8n");

  /* PERFECT */

  if(best && bestDiff < 0.15){

    success(best,note);

    score += 300;

    combo++;

    showJudge("PERFECT");
  }

  /* GOOD */

  else if(best && bestDiff < 0.22){

    success(best,note);

    score += 100;

    combo++;

    showJudge("GOOD");
  }

  else{

    combo = 0;

    showJudge("MISS");
  }

  update();

}

/* ================= SUCCESS ================= */

function success(best,note){
  best.locked = true;

  best.el.remove();

  active =
    active.filter(n=>n!==best);

  synth.triggerAttackRelease(
    note,
    "8n"
  );
}

/* ================= INPUT ================= */

document.addEventListener("click",
async (e)=>{

  const k =
    e.target.closest("[data-note]");

  if(!k) return;

  await Tone.start();

  hit(k.dataset.note);

  k.classList.add("hit");

  setTimeout(()=>{

    k.classList.remove("hit");

  },100);

});

/* ================= UI ================= */

function update(){

  document.getElementById("score")
    .textContent = score;

  document.getElementById("combo")
    .textContent = combo;
}

function setSpeed(s){
  speed = s;
}


/* ================= JUDGE ================= */

function showJudge(text){

  const j =
    document.getElementById("judge");

  j.textContent = text;

  clearTimeout(j.timer);

  j.timer = setTimeout(()=>{

    j.textContent = "";

  },500);

}

</script>

</body>
</html>
