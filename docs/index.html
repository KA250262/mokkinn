<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>メロころ♪ Stable</title>

<script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>

<style>
body{
  background:#111;
  color:white;
  text-align:center;
  font-family:sans-serif;
}

#ui{
  margin:10px;
  font-size:18px;
}

#score{ color:gold; }
#combo{ color:lime; }

/* ================= GAME AREA ================= */

#gameArea{
  position:relative;
  width:840px;
  height:420px;
  margin:auto;

  background-image: url("melokoro.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  border:2px solid #444;
  overflow:hidden;
}

#line{
  position:absolute;
  top:400px;
  width:100%;
  height:3px;
  background:yellow;
}

.note{
  position:absolute;
  width:28px;
  height:28px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff9bd5,#ff5aa5);
  transform:translateX(-50%);
}

#keyboard{
  position:relative;
  width:840px;
  height:160px;
  margin:auto;
}

.key{
  position:absolute;
  width:60px;
  height:160px;
  background:white;
  border:1px solid #333;
}

.black{
  width:40px;
  height:100px;
  background:#222;
  border:2px solid white;
  position:absolute;
  z-index:10;
}

.hit{ background:#7CFF6B !important; }
</style>
</head>

<body>


<h1>メロころ♪ Stable</h1>

<div id="ui">
<input type="file" id="midiFile">
<button onclick="startGame()">再生</button>

<br><br>

スコア: <span id="score">0</span>
　コンボ: <span id="combo">0</span>
</div>

<div id="gameArea">
  <div id="line"></div>
</div>

<div id="keyboard"></div>

<script>

/* ================= SAFETY ================= */

if(typeof Tone === "undefined") alert("Tone.js読み込み失敗");
if(typeof Midi === "undefined") alert("MIDIライブラリ読み込み失敗");

/* ================= AUDIO ================= */

const synth = new Tone.Synth().toDestination();

/* ================= STATE ================= */

let notes = [];
let active = [];

let score = 0;
let combo = 0;

let running = false;

/* ================= SETTINGS ================= */

const travelTime = 2.2;
const hitY = 400;
const spawnY = -60;

let startTime = 0;
let index = 0;

/* ================= KEYBOARD ================= */

const keys = [
"C4","C#4","D4","D#4","E4","F4","F#4","G4","G#4","A4","A#4","B4",
"C5","C#5","D5","D#5","E5","F5","F#5","G5","G#5","A5","A#5","B5"
];

const kb = document.getElementById("keyboard");
let x = 0;

keys.forEach(n=>{
  const k = document.createElement("div");
  k.dataset.note = n;
  k.className = n.includes("#") ? "black" : "key";


  if(!n.includes("#")){
    k.style.left = x + "px";
    x += 60;
  }else{
    k.style.left = (x - 20) + "px";
  }

  kb.appendChild(k);
});

/* ================= MIDI LOAD ================= */

document.getElementById("midiFile")
.addEventListener("change", async (e)=>{

  try{

    const file = e.target.files[0];
    const buf = await file.arrayBuffer();
    const midi = new Midi(buf);

    notes = [];

    midi.tracks.forEach(t=>{
      t.notes.forEach(n=>{
        notes.push({
          time: n.time,
          note: n.name
        });
      });
    });

    notes.sort((a,b)=>a.time-b.time);

    console.log("MIDI OK:", notes.length);

  }catch(err){
    console.error(err);
    alert("MIDI読み込み失敗");
  }

});

/* ================= START ================= */

async function startGame(){

  await Tone.start();

  if(!notes.length){
    alert("MIDIを読み込んでね");
    return;
  }

  running = true;
  startTime = performance.now();
  index = 0;

  requestAnimationFrame(loop);
}


function stopGame(){
  running = false;

  active.forEach(n => n.el.remove());
  active = [];
}


/* ================= LOOP ================= */

function loop(){

  if(!running) return;

  const now = performance.now();
  const t = (now - startTime)/1000 - 3;

  while(index < notes.length &&
        notes[index].time <= t + travelTime){

    spawn(notes[index]);
    index++;
  }

  active.forEach(n=>{

    const p = 1 - ((n.hit - t)/travelTime);
    const y = spawnY + p*(hitY - spawnY);

    n.el.style.top = y + "px";

    if(p > 1.2){
      n.el.remove();
      active = active.filter(x=>x!==n);
      combo = 0;
      update();
    }

  });

  requestAnimationFrame(loop);
}

/* ================= SPAWN ================= */

function spawn(n){

  const key = document.querySelector(`[data-note="${n.note}"]`);
  if(!key) return;

  const g = document.getElementById("gameArea").getBoundingClientRect();
  const k = key.getBoundingClientRect();

  const el = document.createElement("div");
  el.className = "note";

  el.style.left =
    (k.left - g.left + k.width/2) + "px";

  document.getElementById("gameArea").appendChild(el);

  active.push({
    el,
    note: n.note,
    hit: n.time
  });
}

/* ================= HIT ================= */

function hit(note){

  const now = (performance.now()-startTime)/1000;

  let best = null;
  let bestDiff = 999;

  active.forEach(n=>{

    if(n.note !== note) return;

    const d = Math.abs(n.hit - now);

    if(d < bestDiff){
      bestDiff = d;
      best = n;
    }

  });

  if(best && bestDiff < 0.15){

    best.el.remove();
    active = active.filter(n=>n!==best);

    score += 100;
    combo++;

    synth.triggerAttackRelease(note,"8n");

  }else{
    combo = 0;
  }

  update();
}
console.log("hit!", note);

/* ================= INPUT ================= */

document.addEventListener("click", async (e)=>{

  const k = e.target.closest("[data-note]");
  if(!k) return;

  await Tone.start();

  hit(k.dataset.note);

  k.classList.add("hit");
  setTimeout(()=>k.classList.remove("hit"),100);
});

/* ================= UI ================= */

function update(){
  document.getElementById("score").textContent = score;
  document.getElementById("combo").textContent = combo;
}

</script>

</body>
</html>
