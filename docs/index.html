<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>メロころ♪ Stable FIX</title>

<script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>

<style>
body{
  background:#111;
  color:white;
  text-align:center;
  font-family:sans-serif;
}

#gameArea{
  position:relative;
  width:840px;
  height:420px;
  margin:auto;
  overflow:hidden;
  background:#222;
}

#line{
  position:absolute;
  top:320px;
  width:100%;
  height:3px;
  background:yellow;
}

.note{
  position:absolute;
  width:28px;
  height:28px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff9bd5,#ff5aa5);
  transform:translateX(-50%);
}
</style>
</head>

<body>

<h1>メロころ♪ FIX</h1>

<input type="file" id="midiFile">
<button onclick="startGame()">再生</button>

<div id="gameArea">
  <div id="line"></div>
</div>

<script>

/* ================= AUDIO ================= */
const synth = new Tone.Synth().toDestination();

/* ================= STATE ================= */
let notes = [];
let active = [];

let startTime = 0;
let index = 0;
let running = false;

/* ================= SETTINGS ================= */
const travelTime = 2.2;
const spawnY = -60;

let hitY = 320; // 固定でOK（簡略化）

/* ================= MIDI LOAD ================= */
document.getElementById("midiFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  const buf = await file.arrayBuffer();
  const midi = new Midi(buf);

  notes = [];

  midi.tracks.forEach(t => {
    t.notes.forEach(n => {
      notes.push({
        time: n.time,
        note: n.name
      });
    });
  });

  notes.sort((a,b)=>a.time-b.time);

  console.log("MIDI loaded:", notes.length);
});

/* ================= START ================= */
async function startGame() {

  if (!notes.length) {
    alert("MIDIを読み込んでね");
    return;
  }

  await Tone.start();

  startTime = performance.now() / 1000 + 1.5; // 👈遅延スタート
  index = 0;
  active = [];
  running = true;

  console.log("game start");

  requestAnimationFrame(loop);
}

/* ================= LOOP ================= */
function loop(){

  if(!running) return;

  const now = performance.now() / 1000;
  const t = now - startTime;

  while(index < notes.length && notes[index].time <= t + travelTime){
    spawn(notes[index]);
    index++;
  }

  active.forEach(n=>{

    const p = (t - n.hit + travelTime)/travelTime;
    const y = spawnY + (hitY - spawnY)*p;

    n.el.style.top = y + "px";

    if(p > 1.2){
      n.el.remove();
      active = active.filter(x=>x!==n);
    }
  });

  requestAnimationFrame(loop);
}

/* ================= SPAWN ================= */
function spawn(n){

  const el = document.createElement("div");
  el.className = "note";

  const game = document.getElementById("gameArea").getBoundingClientRect();

  // キー参照なしでとりあえず中央から出す（安全版）
  const x = Math.random() * 800;

  el.style.left = x + "px";

  document.getElementById("gameArea").appendChild(el);

  active.push({
    el,
    note: n.note,
    hit: n.time
  });
}

/* ================= HIT ================= */
function hit(note){

  const now = performance.now() / 1000 - startTime;

  let best = null;
  let bestDiff = 999;

  active.forEach(n => {

    if (n.note !== note) return;

    const d = Math.abs(n.hit - now);

    if (d < bestDiff) {
      bestDiff = d;
      best = n;
    }

  });

  if (best && bestDiff < 0.15) {
    best.el.remove();
    active = active.filter(n => n !== best);

    synth.triggerAttackRelease(note, "8n");
  }
}

/* ================= INPUT ================= */
document.addEventListener("click", async (e) => {

  const key = e.target.closest(".note");
  if (!key) return;

  await Tone.start();
});

</script>

</body>
</html>
