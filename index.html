<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>メロころ♪</title>

<script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>

<style>

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
}

#gameArea::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.35);
  z-index:1;
}
/* ===== 全体の箱 ===== */
#gameArea{
  position:relative;
  width:100%;
  height:350px;   /* ← ここを 100vh から変更 */
  overflow:hidden;
  background-image:url("melokoro.png");
  background-size: 60%;
  background-position: center top;
  background-repeat: no-repeat;
  background-color:#111;
}


/* ===== 背景画像 ===== */
#mascot{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
  pointer-events:none;
}

/* ===== ノーツ ===== */
.note{
  position:absolute;
  width:46px;
  height:46px;
  border-radius:50%;
  background:linear-gradient(135deg,#7ad8ff,#3aa6ff);
  border:2px solid #fff;
  transform:translateX(-50%);
  z-index:10;
}

/* ===== 鍵盤 ===== */
#keyboard{
  position:static;   /* ← absolute をやめる */
  margin-top:0;
  bottom:480px;
  left:0;
  width:100%;
  height:160px;
  z-index:20;
}

/* ===== UI ===== */
#ui{
  position:static;
  bottom:20px;
  left:0;
  width:100%;
  text-align:center;

  z-index:999999;
  pointer-events:auto;
}

/* ===== 判定表示 ===== */
#judgeMini{
  font-size:28px;
  font-weight:bold;
  color:white;
}

/* ===== 回転警告 ===== */
#rotateMessage{
  display:none;
  position:fixed;
  inset:0;
  background:#111;
  color:white;
  font-size:28px;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

@media (max-width: 768px) and (max-height: 500px){
  #rotateMessage{
    display:flex;
  }
}

button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  background:#ff7ac8;
  color:white;
}

</style>
</head>

<body>

<div id="rotateMessage">よこ向きであそんでね！</div>

<div id="gameArea">

  <div id="keyboard"></div>

  <div id="ui">
    <div id="judgeMini"></div>

    <button onclick="startGame()">再生</button>
    <button onclick="stopGame()">停止</button>
  </div>

</div>

<script>

/* ===== 状態 ===== */
let notes = [];
let active = [];
let running = false;
let startTime = 0;
let index = 0;

/* ===== 時間 ===== */
function getTime(){
  return (performance.now() - startTime) / 1000;
}

/* ===== キーボード生成 ===== */
window.onload = () => {

  const gameArea = document.getElementById("gameArea");
  const whiteKeys = ["C4","D4","E4","F4","G4","A4","B4","C5"];
  const blackKeys = ["C#4","D#4","F#4","G#4","A#4"];

  const gameWidth = gameArea.clientWidth;
  const keyWidth = gameWidth / keys.length;

  const kb = document.getElementById("keyboard");

  kb.innerHTML = "";

  keys.forEach((n, i) => {
    const k = document.createElement("div");

    k.style.position = "absolute";
    k.style.left = (i * keyWidth) + "px";
    k.style.width = keyWidth + "px";
    k.style.height = "160px";

    k.style.background = "white";
    k.style.border = "1px solid #333";
    kb.appendChild(k);
  });

};

/* ===== ノーツ生成 ===== */
function spawn(note){
  const el = document.createElement("div");
  el.className = "note";
  el.style.left = Math.random()*300 + "px";
  el.style.top = "-50px";
  document.getElementById("gameArea").appendChild(el);

  active.push({
    el,
    hit: getTime() + 2
  });
}

/* ===== メインループ ===== */
function loop(){
  if(!running) return;

  const t = getTime();

  active.forEach(n=>{
    n.el.style.top = (t - n.hit + 2)*300 + "px";
  });

  requestAnimationFrame(loop);
}

/* ===== 開始 ===== */
function startGame(){
  running = true;
  startTime = performance.now();
  loop();
}

/* ===== 停止 ===== */
function stopGame(){
  running = false;
  active.forEach(n=>n.el.remove());
  active = [];
}

</script>

</body>
</html>
