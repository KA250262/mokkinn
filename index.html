#notes-layer {

.single-note{

@keyframes spawnNote {
    0% {

    }
    100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);    
    }
}

.note {
    position: absolute;
    /* 最初は透明にしておく */

    transition: none;
    width: 24px;
    height: 24px;
    border-radius: 30%;
    /*border: 1px solid rgba(255,255,255,0.9);*/

    opacity: 0.15;

    z-index: 10001 !important;
}

.note-hit-effect {

}

.note.note-active {
  opacity: 1;
}

.note-text {

    font-size: 18px;

function play(note){
    const now = Tone.now();

    // ★ ノートごとにガード（和音はブロックしない）
    if (!lastNoteTime[note]) lastNoteTime[note] = 0;
    if (now - lastNoteTime[note] < 0.03) return; 
    lastNoteTime[note] = now;

    // AudioContext が止まっていたら再開
    if (window.synth.context.state !== "running") {
        window.synth.context.resume();
    }

    try {
        window.synth.triggerAttackRelease(note, 1, now);
    } catch (e) {
        console.error("再生エラー:", e);
    }
}

function stepBack() {
  if (index <= 0) return;

  index--;
  const targetTime = notes[index].time;

  // 同じタイミング（和音）の音をまとめて戻る
  while (index > 0 && Math.abs(notes[index - 1].time - targetTime) < 0.001) {
    index--;
  }

  // 1. ノーツの描画をクリア
  document.getElementById("notes-layer").innerHTML = "";
  active = [];

  // 2. ★超重要：ここを修正
  // 全てを false にせず、巻き戻した時間(targetTime)より過去の音だけを
  // 演奏済み(true)にすることで、ガーンと鳴るのを防ぐ
  notes.forEach(n => {
    n.played = (n.time < targetTime);
  });

  // 3. 再生時間を巻き戻し位置に合わせる
  startTime = performance.now() - (targetTime * 1000) / speed;

  running = false; 
}


// --- 共通の巻き戻し終了処理 ---
function finishRewind() {
  rewindHolding = false;
  clearTimeout(rewindTimer);

  // 巻き戻し後の正確な時間を計算
  const targetTime = notes[index] ? notes[index].time : 0;
  startTime = performance.now() - (targetTime * 1000) / speed;

  // 1. ノイズ防止とフラグ同期をまとめて実行
  syncAudioState();

  // 2. 巻き戻し後は一時停止状態で待機
  running = false;
  stepMode = false;
}

async function startMic() {
    try {
        if (!navigator.mediaDevices?.getUserMedia) return false;
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        const analyzer = Meyda.createMeydaAnalyzer({
            audioContext: audioContext,
            source: source,
            bufferSize: 512,
            featureExtractors: ["rms", "amplitudeSpectrum", "spectralCentroid"],
            callback: (features) => {
                const currentRMS = features.rms || 0;
                const spectrum = features.amplitudeSpectrum || [];
                const centroid = features.spectralCentroid || 0;
                latestRMS = currentRMS;
                latestSpectrum = spectrum;
                baseline = baseline * 0.95 + currentRMS * 0.05;
                let flux = 0;
                if (prevSpectrum.length && prevSpectrum.length === spectrum.length) {
                    for (let i = 0; i < spectrum.length; i++) {
                        flux += Math.abs(spectrum[i] - prevSpectrum[i]);
                    }
                }
                const delta = currentRMS - prevRMS;
                const now = performance.now();

                const debug = document.getElementById("debug");
                if (debug) {
                    debug.textContent = "RMS : " + currentRMS.toFixed(3) + " / base : " + baseline.toFixed(3);
                }

                const attackMode = currentRMS > 0.015 && currentRMS > baseline * 2 && (flux > 0.15 || delta > baseline * 1.2);
                if (attackMode && now - lastHitDetect > 300) {
                    hitNearest();
                    lastHitDetect = now;
                }
                prevRMS = currentRMS;
                prevSpectrum = [...spectrum];
            }
        });
        analyzer.start();
        analyser = analyzer;
        return true;
    } catch (e) { return false; }
}

function loadMidi(buffer, fileName){
  chordSpawnIndex = {};
  const midi = new Midi(buffer);
    timeSignature = midi.header.timeSignatures?.[0]?.timeSignature?.[0] || 4;
  const keySig = midi.header.keySignatures?.[0];
  const keyFix = { "D#":"Eb", "Eb":"Eb", "C#":"Db", "Db":"Db", "F#":"Gb", "Gb":"Gb", "G#":"Ab", "Ab":"Ab", "A#":"Bb", "Bb":"Bb" };

  notes = [];
  usedNotes.clear();

  let playableTrackCount = 0;
  midi.tracks.forEach(t => {
    if (t.notes.length === 0) return;
    t.notes.forEach(n => {
      notes.push({
        time: n.time,
        note: n.name,
        midi: n.midi,
        duration: n.duration,
        hand: (playableTrackCount === 0) ? "right" : "left"
      });
      usedNotes.add(n.name);
    });
    playableTrackCount++;
  });

  notes.sort((a, b) => a.time - b.time);

  let currentChordId = 0;
  for (let i = 0; i < notes.length; i++) {
    if (i > 0 && Math.abs(notes[i].time - notes[i - 1].time) > 0.01) {
      currentChordId++;
    }
    notes[i].chordId = currentChordId;
  }
  totalCount = notes.length;
  paintKeyboard();
}

function paintKeyboard(){

    }
    key.style.opacity = "1";
  });
}

function rewind() {
  // 1. オーディオ時間を実際に巻き戻す
  // (audioが定義されていない場合のエラー回避も入れています)
  if (typeof audio !== 'undefined' && audio) {

  if (typeof syncAudioState === 'function') {
    syncAudioState();
  }

function noteToSolfege(noteName){
    const pitch = noteName.replace(/[0-9]/g, "");
    const normalize = {
        "C":"C", "C#":"C#","Db":"C#", "D":"D", "D#":"D#","Eb":"D#", "E":"E","Fb":"E",
        "F":"F","E#":"F", "F#":"F#","Gb":"F#", "G":"G", "G#":"G#","Ab":"G#", "A":"A",
        "A#":"A#","Bb":"A#", "B":"B","Cb":"B"
    };
    const p = normalize[pitch];
    if(!p) return pitch;

    const key = window.currentKey || "C";
    const majorScale = {
        C:  ["C","D","E","F","G","A","B"], G:  ["C","D","E","F#","G","A","B"],
        D:  ["C#","D","E","F#","G","A","B"], A:  ["C#","D","E","F#","G#","A","B"],
        E:  ["C#","D#","E","F#","G#","A","B"], B:  ["C#","D#","E","F#","G#","A#","B"],
        F:  ["C","D","E","F","G","A","A#"], Bb: ["C","D","D#","F","G","A","A#"],
        Eb: ["C","D","D#","F","G","G#","A#"], Ab: ["C","C#","D#","F","G","G#","A#"]
    };
    const solfege = ["ド","レ","ミ","ファ","ソ","ラ","シ"];
    const scale = majorScale[key];
    const idx = scale.indexOf(p);
    if(idx !== -1) return solfege[idx];

    const kana = {
        "C":"ド", "C#":"ド♯", "D":"レ", "D#":"レ♯", "E":"ミ", "F":"ファ",
        "F#":"ファ♯", "G":"ソ", "G#":"ソ♯", "A":"ラ", "A#":"ラ♯", "B":"シ"
    };
    return kana[p] || p;
}

if (sol.includes("♯")) {

function success(best) {
  if (best.done) return; 
  best.done = true;


  
  best.el.classList.add("note-hit-effect");

  // 2. 0.1秒（transitionの時間）だけ待ってからDOMから完全に削除する
  setTimeout(() => { 
      if (best.el) best.el.remove(); 
  }, 100); // ここを短くするほど速く消えます

  best.keyTop?.classList.remove(
  "pre-hit-left",
  "pre-hit-right",
  "guide-left",
  "guide-right"
);

  best.el.classList.add("note-suck");
  best.removed = true;

  setTimeout(() => { best.el?.remove(); }, 250);
  active = active.filter(n => n !== best);
  hitCount++;
  update();
}

function hitNearest() {
   console.log("🔥 hitNearest fired");
  const now = getTime();

  // guideが出てる & 未処理のノーツだけ対象
  const candidates = active.filter(n => 
    n.guideShown && 
    !n.done && 
    n.keyTop
  );

  if (candidates.length === 0) return;

  // 一番最初の候補を「基準」にする
  const best = candidates[0];

  // 同じキー・同じ手だけまとめる（安全）
  const group = active.filter(n =>
    n.guideShown &&
    !n.done &&
    n.keyTop &&
    n.chordId === best.chordId &&
    n.hand === best.hand
  );

  group.forEach(n => {
    // 🔥 光る
    n.keyTop.classList.add("hit");

    setTimeout(() => {
      n.keyTop?.classList.remove("hit");
    }, 200);

    // 成功処理（1回ずつ安全に）
    success(n);
  });
}

  if (!n.keyTop) {
    console.warn("keyTop missing", n);
    return;

  console.log(n.keyTop.className);

    if (n.note !== note) return;

// 再生位置とフラグを現在の状態に強制同期させる関数
function syncAudioState() {
  const currentMusicTime = getTime();
  
  // 1. ノイズ防止：演奏中の音を止める
  if (window.synth) window.synth.releaseAll();
  
  // 2. 過去の音を「演奏済み」にロック
  notes.forEach(n => {
    n.played = (n.time <= currentMusicTime);
  });

  // 3. 画面のノーツをクリアして再構築
  document.getElementById("notes-layer").innerHTML = "";
  active = [];
  
  // 4. 今から少し先のノーツだけ表示対象にする
  notes.forEach(n => {
    if (n.time > currentMusicTime && n.time < currentMusicTime + 3.0) {
      spawn(n);
    }
  });
}

function nextNote() {
    const now = getTime();
    const next = notes.find(n => n.time > now);
    if (!next) return;

    const t = next.time;
    running = false;
    seekForwardTo(t);

    const chordNotes = notes.filter(n => Math.abs(n.time - t) < 0.01);
    chordNotes.forEach(n => spawn(n));
}

function prevNote() {
    const now = getTime();
    let i = index - 1;
    if (i < 0) return;

    const baseTime = notes[i].time;
    const group = [];
    while (i >= 0 && notes[i].time === baseTime) {
        group.unshift(notes[i]);
        i--;
    }
    index = i + 1;
    seekToTime(baseTime);
    group.forEach(n => play(n.note));
}

function seekForwardTo(t) {
    active.forEach(n => n.el?.remove());
    active = [];
    index = notes.findIndex(n => n.time >= t);
    if(index === -1) index = notes.length;
    startTime = performance.now() - t * 1000 - pausedTime;
    paintKeyboard();
}

function seekToTime(t) {
    hardStop();
    active.forEach(n => n.el?.remove());
    active = [];
    index = notes.findIndex(n => n.time >= t);
    startTime = performance.now() - t * 1000 - pausedTime;
    notes.forEach(n => {
        if (n.time >= t) {
            n.played = false;
            n.hitFired = false;
        }
    });
    paintKeyboard();
    rebuildVisibleNotes();
}

function rebuildVisibleNotes() {
    const gameTime = getTime();
    for (let i = index; i < notes.length; i++) {
        if (notes[i].time <= gameTime + NOTE_EARLY) {
            spawn(notes[i]);
        } else {
            break;
        }
    }
}

function stepForward() {

  document.getElementById("notes-layer").innerHTML = "";
  
    document.querySelectorAll("#keyboard-top .key, #keyboard-top .black")
        .forEach(k => {
            k.classList.remove("hit", "guide-left", "guide-right", "pre-hit-left", "pre-hit-right");
        });

    if (!notes || notes.length === 0) return;
    if (stepIndex >= notes.length) return;

    const currentTime = notes[stepIndex].time;
    const chordNotes = notes.filter(n => Math.abs(n.time - currentTime) < 0.01);

    active.forEach(n => n.el?.remove());
    active = [];

    chordNotes.forEach(n => {
        spawn(n);
        play(n.note);
        const key = document.querySelector(`#keyboard-top [data-note="${n.note}"]`);
        
        function flashKey(k, cls = "hit") {
            if (!k) return;
            k.classList.add(cls);
            setTimeout(() => k.classList.remove(cls), 120);
        }
        flashKey(key);
    });

    stepIndex = notes.findIndex(n => n.time > currentTime);
    if (stepIndex === -1) stepIndex = notes.length;
}
