<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>メロころ♪</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
<script>
</script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<script src="https://unpkg.com/meyda/dist/web/meyda.min.js"></script>

<style>
#rotateMessage{
  display:none;
}

@media (orientation: portrait) {
  #rotateMessage{
    display:flex;
    position:fixed;
    inset:0;
    background:black;
    color:white;
    font-size:32px;
    z-index:999999;
    justify-content:center;
    align-items:center;
  }

  #gameArea,
  #ui,
  #songListRow{
    display:none;
  }
}
html {
  transform-origin: top left;
}

body{
  margin:0;
  padding:0;
  background: #fff176;
  color:white;
  text-align:center;
  font-family:sans-serif;
  overflow:hidden;
  transition: background-color 0.05s ease, filter 0.05s ease;
}

/* 1拍目に一瞬だけ付与されるクラス */
body.beat-flash {
  background-color: #fff176;
  filter: brightness(1.15) ;
}

body.mobile {
    transform: none !important;
    overflow-x: auto !important;
}
body.mobile #keyboard-top {
    width: max-content;
    position: absolute; 
    top: 0;
}

#gameArea {
  position:relative;
  width: 100%;
  height: 60vh;
  background-image: linear-gradient(rgba(0, 77, 64, 0.7), rgba(0, 77, 64, 0.7)), url("melokoro.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  overflow: hidden;
}

#mascot{
  position:absolute;
  width:100%;
  height:70%;
  left:0;
  top:0;
  object-fit:contain;
  object-position:top;
  pointer-events:none;
  z-index:1;
}


#keyboard-top {
  position: relative;
  margin-top: 40px;
  top: 0;
  left: 0;
  width: 100%;
  height: 240px; /* 💡2行がきれいに収まるように高さを広げました */
  z-index: 10;
}

/* ========================================================
   鍵盤を上から見た普通の2行配置にきっぱり分けるCSS
   ======================================================== */

/* 【2行目・手前】：すべての白鍵を一段下にきっぱり落とす */
#keyboard-top .key {
    position: absolute;
    top: 95px !important;
    width: 28px;
    height: 88px !important;
    background: #fffae8;
    border: 1px solid #333;
    border-radius: 2px 2px 6px 6px;
    z-index: 10 !important;
    transition: background 0.15s ease, box-shadow 0.15s ease;
    transform-origin: center center !important;
    
    text-align: center;
    font-weight: bold;
    font-size: 10px;
    padding-top: 60px;
    box-sizing: border-box;
    user-select: none;
    cursor: pointer;
}


/* 【1行目・奥】：すべての黒鍵を一番上にぴったり固定 */
#keyboard-top .black {
    position: absolute;
    top: 35px !important;
    width: 26px;
    height: 75px !important;
    background: #222;
    border: 2px solid #fffae8;
    border-radius: 5px 5px 4px 4px;

    z-index: 20 !important; 
    transition: background 0.15s ease, box-shadow 0.15s ease;
    transform-origin: center center !important;
    
    text-align: center;
    font-weight: bold;
    font-size: 11px;
    color: white;
    padding-top: 40px;
    box-sizing: border-box;
    user-select: none;
    cursor: pointer;
}

/* C4（まん中のド）の下に▲を表示 */
#keyboard-top .key[data-note="C4"]::after {
    content: "▲";
    position: absolute;
    bottom: -20px; /* 鍵盤の下に配置 */
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #ff3399; /* お好みの色に */
    pointer-events: none;
}

#ui {
  display: flex;
  flex-direction: row;     /* 横並びを強制 */
  align-items: center;     /* 縦中央揃え */
  gap: 5px;            
  padding: 4px 8px;   
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(6px);
  border-radius: 20px;
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 95%;              /* パーセント指定で収まりを良くする */
  white-space: nowrap;     /* 改行させない */
  overflow-x: auto;        /* はみ出た場合は横スクロール */
}

/* スマホの時だけスライダーを少し小さくする */
@media (max-width: 600px) {
  #speed-slider {
    width: 60px; /* 100pxから60pxへ短縮 */
  }
  .group {
    display: flex;
    align-items: center;
    gap: 2px;
    font-size: 12px;
  }
}

.controls-container {
  display: flex;
  flex-wrap: nowrap;
  align-items: center; 
  gap: 20px;
  white-space: nowrap;
}

/* 既存の #songListRow のスタイルを以下のように書き換える */
#songListRow {
    position: relative; /* absoluteから変更 */
    width: 100%;
    display: flex;
    gap: 5px;
    overflow-x: auto;
    white-space: nowrap;
    padding: 10px;
    background: rgba(255, 255, 255, 0.1); /* 見やすくするための背景 */
    margin-top: 10px;
    box-sizing: border-box;
}

.songBtn {
    /* 普段はコンパクトなボタン */
    width: 30px; 
    height: 30px;
    background: #ff7ac8;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    flex-shrink: 0;
    
    /* 💡 伸び縮みを滑らかにする */
    transition: width 0.2s ease, font-size 0.2s ease;
    overflow: hidden; /* 伸びるまでは文字がはみ出ないように */
}

/* 💡 クリックしている間（またはホバー中）だけ幅を広げてタイトルを出す */
.songBtn:active, 
.songBtn:hover {
    width: 150px; /* 伸ばしたい長さに調整 */
    font-size: 14px;
}




#hitCount, #score-display {
  font-size: 25px;
  color: rgb(12, 46, 2);
}

/* ========================================================
   鍵盤ヒット・ガイド（上の鍵盤・木琴専用スタイル）
   ======================================================== */

/* 鍵盤を自分で直接タップ・マイク入力でヒットした時の光（ネオングリーン） */
.hit {
    background: #7CFF6B !important; /* お好みの強い色に変更可能 */
    box-shadow: none !important;    /* 発光をオフ */
    z-index: 100 !important; /* 常に最前面へ */
    opacity: 1 !important;          /* 透け感をなくす */
    filter: none !important;        /* ぼかしを除去 */
}

/* 自動演奏時のガイド：左手（青） */
.guide-left {
    animation: guideLeft 0.25s ease-out forwards;
    z-index: 25 !important;
}

/* 自動演奏時のガイド：右手（赤） */
.guide-right {
    animation: guideRight 0.25s ease-out forwards;
    z-index: 25 !important;
}

/* 右手ガイド：影なしで色を塗りつぶして「ぷにっ」と縮む */
@keyframes guideRight {
    0% { 
        transform: scaleY(1); 
        background: #ff4db8; /* 塗りつぶし */
    }
    50% { 
        transform: scaleY(0.88); 
        background: #ff80d5; /* 縮んだ時に少し明るい色にするなど */
    }
    100% { 
        transform: scaleY(1); 
        background: #ff4db8;
    }
}

/* 左手ガイド：影なしで色を塗りつぶして「ぷにっ」と縮む */
@keyframes guideLeft {
    0% { 
        transform: scaleY(1); 
        background: #33cfff; /* 塗りつぶし */
    }
    50% { 
        transform: scaleY(0.88); 
        background: #8ae8ff; /* 縮んだ時に少し明るい色にするなど */
    }
    100% { 
        transform: scaleY(1); 
        background: #33cfff;
    }
}



/* ========================================================
   木琴鍵盤から湧き出るノーツ（音符）システム
   ======================================================== */

#notes-layer {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    /* 💡 鍵盤のz-index(最高100)よりも大きく設定 */
    z-index: 200 !important; 
    pointer-events: none;
}

.note {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff8c0, #ffd860);
    border: 1px solid rgba(255,255,255,0.9);
    will-change: transform;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.2s ease-out, transform 0.2s ease-out; 
    z-index: 201 !important;
}

.note-active {
    opacity: 1;
    transform: scale(1);
}

.note-text {
    position: absolute; 
    top: 50%; 
    left: 50%; 
    transform: translate(-50%, -50%); 
    font-size: 15px; 
    white-space: nowrap; 
    font-weight: 800; 
    color: white; 
    text-shadow: 0 0 4px rgba(0,0,0,1), 0 0 4px rgba(0,0,0,1); /* 影を濃くする */
    z-index: 300; 
}

/* ファ以外に適用される大きめのフォント */
.large-text {
    font-size: 25px !important;
}

.note-spawn {
    animation: noteSpawn 0.12s ease-out;
}

@keyframes noteSpawn {
    0% {
        opacity: 0;
        transform: scale(0.7);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}




.note-hit {
    box-shadow: 0 0 25px 10px rgba(255, 255, 255, 0.9);
    filter: brightness(1.8);
    transition: all 0.15s ease-out;
}

.note-suck {
    animation: suckToLine 0.25s ease-in forwards;
}

@keyframes suckToLine {
    0% {
        transform: scale(1);
        filter: blur(0px);
        opacity: 1;
    }
    100% {
        transform: scale(0.1);
        filter: blur(6px);
        opacity: 0;
    }
}

.note-trail {
    position: absolute;
    height: 8px;
    border-radius: 999px;
    pointer-events: none;
    z-index: 40;
    opacity: 0.5;
    transform-origin: left center;
    filter: blur(3px);
    box-shadow: 0 0 8px currentColor;
}

.note-trail-right {
    background: linear-gradient(90deg, rgba(255,74,74,0.8), rgba(255,74,74,0));
}

.note-trail-left {
    background: linear-gradient(90deg, rgba(74,163,255,0.8), rgba(74,163,255,0));
}


/* #ui 内にスライダー用のスタイルを追加 */
#speed-slider {
    width: 100px;
    vertical-align: middle;
}

.hand-bar{
  position:absolute;
  height:20px;
  border-radius:10px;
  pointer-events:none;
  z-index:25;
  opacity:1 !important;
  border:2px solid white;
  transition: left 0.08s ease-out, top 0.08s ease-out, opacity 0.1s linear;
}

.icon-btn {
  background: #ff7ac8;
  color: white;
  border: none;
  border-radius: 50%; /* 丸いボタン */
  width: 40px;
  height: 40px;
  font-size: 18px;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.icon-btn:hover {
  background: #ff3399;
  transform: scale(1.1);
}

.icon-btn:active {
  transform: scale(0.95);
}




.left-bar{ background:#7fdfff; z-index: 50; }
.right-bar{ background:#ff9ed6; z-index: 50; }

@keyframes comboBounce {
  0%{ transform:scale(1); }
  30%{ transform:scale(1.03) rotate(-1deg); }
  60%{ transform:scale(1.03) rotate(1deg); }
  100%{ transform:scale(1); }
}

@keyframes bubblePop {
  0%{ transform:translateX(-50%) scale(1); opacity:1; }
  50%{ transform:translateX(-50%) scale(1.3); opacity:1; }
  100%{ transform:translateX(-50%) scale(2.2); opacity:0; }
}

.bubble-out {
  animation: bubblePop 0.12s ease-out forwards;
}

.hit-flash{
  position:absolute;
  left:50%;
  transform:translateX(-100%);
  width:90%;
  height:24px;
  border-radius:20px;
  background: radial-gradient(ellipse, rgba(255,255,255,0.95), rgba(120,220,255,0.7), rgba(120,220,255,0));
  pointer-events:none;
  animation:flashAnim 0.10s ease-out forwards;
  z-index:500;
}

/*
.combo-line { 
    position: absolute; 
    height: 12px; 
    background: linear-gradient(90deg, transparent 0%, #ffffff 20%, #ffffff 80%, transparent 100%) !important; 
    box-shadow: 0 0 12px #ffffff, 0 0 20px #ffffff, 0 0 30px #ff7ac8; 
    pointer-events: none; 
    z-index: 20; 
    opacity: 0.7; 
    transition: opacity 0.05s linear; 
}
*/

.chord-surround {
  position: absolute;
  pointer-events: none;
  z-index: 90; 
}

.chord-surround-right { filter: drop-shadow(0 0 8px #ff4a4a) !important; }
.chord-surround-left { filter: drop-shadow(0 0 8px #4aa3ff) !important; }

@keyframes lineFlash {
  0% { opacity: 1; transform: scaleY(1); }
  100% { opacity: 0; transform: scaleY(0); }
}

@keyframes flashFade {
  0% { opacity: 1; }
  100% { opacity: 0; }
}

#score{
  color:gold;
  display:inline-block;
  transition:0.1s;
}

#debug{
  display: none !important;
  position: fixed;
  right: 10px;
  bottom: 10px;
  background: rgba(0,0,0,0.7);
  padding: 10px;
  font-size: 14px;
  text-align: left;
  border-radius: 8px;
  color: white;
}

#goalOverlay {
  pointer-events: none;
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999999;
  background: rgba(0,0,0,0.2);
}

.goalScene {
  display: flex;
  align-items: center;
  gap: 10px;
}

.bird {
  font-size: 40px;
  transform-origin: center;
  animation: wing 0.4s infinite alternate;
}

.leftBird { transform: scaleX(-1); }
.rightBird { transform: scaleX(1); }

.piano-hand {
  display: none !important;
  position: absolute;
  height: 200px;
  z-index: 30;
  pointer-events: none;
  top: 650px;           
  left: 0px;
  transition: left 0.08s ease-out, top 0.1s ease-out, transform 0.05s ease-out, opacity 0.05s linear;
  opacity: 0;
}

.piano-hand.tap {
  transform: scale(0.88) translateY(-5px);
}

.tape {
  background: gold;
  color: #222;
  font-weight: bold;
  padding: 6px 16px;
  border-radius: 6px;
  letter-spacing: 2px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

@keyframes popIn {
  0%   { transform: scale(0.4); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes float {
  0%   { transform: translateY(0px); }
  50%  { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

@keyframes wing {
  0%   { transform: translateY(0px) rotate(-5deg); }
  100% { transform: translateY(-2px) rotate(5deg); }
}

/* #lineLayer {
    position:absolute; 
    left:0; 
    top:0; 
    width:100%; 
    height:100%; 
    pointer-events:none; 
    z-index:90; 
} 
*/

/* 白鍵：透け感のある光 */
.key.pre-hit {
    background: rgba(255, 255, 255, 0.5) !important;
    border: 2px solid rgba(255, 255, 255, 0.8) !important;
    z-index: 50 !important; /* 既存のz-indexを維持 */
}

/* 黒鍵：鮮やかな蛍光色（HIT時と同じ色） */
.black.pre-hit {
    background: #7CFF6B !important;
    border: 2px solid #ffffff !important;
    box-shadow: 0 0 10px #7CFF6B, 0 0 20px #7CFF6B;
    z-index: 150 !important; /* 常に白鍵より手前に出す */
}

/* ガイド用（くっきりした光） */
.guide-left, .guide-right {
    z-index: 30 !important; /* 予兆より上に重ねる */
}

/* 選択中のボタン用のスタイル */
.songBtn.selected {
    background: #ff3399 !important; /* より濃いピンクに */
    border: 2px solid #ffffff !important; /* 白枠で強調 */
    box-shadow: 0 0 10px #ff3399;
}
/* ゴール表示用クラス */
.goal-visible {
    display: flex !important;
}

/* 画面の枠や線を強制的に消す */
#gameArea, #lineLayer, .chord-surround {
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
}

/* もしこれでも残る場合は以下も追加 */
#lineLayer {
    display: none !important;
}

</style>
</head>
<body>
<div id="rotateMessage">
  ♫ 横向きにして遊んでください
</div> 
<div data-midi="60"></div>

<div id="gameArea">
  <img id="mascot">

  <div id="keyboard-top">
    <div id="notes-layer"></div>
    <div class="white-keys"></div>
    <div class="black-keys"></div>
  </div> 
</div> <div id="songListRow"></div>
</div>

<div id="leftBar" class="hand-bar left-bar"></div>
<div id="rightBar" class="hand-bar right-bar"></div>

<div id="ui">
  <div class="group">
    <label for="speed-slider">速度:</label>
    <input type="range" id="speed-slider" min="0.1" max="0.4" step="0.05" value="0.25">
    <span id="speedLabel">ふつう</span>
  </div>

<div class="group">
  <button id="rewind-btn" class="icon-btn">⏪</button>
  <button id="play-btn" class="icon-btn">▶</button>
  <button id="stop-btn" class="icon-btn">■</button>
  <button id="pause-btn" class="icon-btn">⏸</button>
</div>

  <div id="judge"></div>
  <span id="score-display">0 / 0</span>
  <button onclick="startMic()" class="icon-btn">🎤</button>
</div>


<div id="debug"></div>
  
<div id="goalOverlay" class="hidden">
  <div class="goalScene">
    <div class="bird leftBird">🚩</div>
    <div class="tape">GOAL</div>
    <div class="bird rightBird">🐇</div>
  </div>
</div>

<script>

// window.synth の定義部分を以下のように書き換えてください
window.synth = new Tone.Sampler({
  urls: {
  C3: "C3.wav",
  D3: "D3.wav",
  E3: "E3.wav",
  F3: "F3.wav",
  G3: "G3.wav",
  A3: "A3.wav",
  B3: "B3.wav",
  C4: "C4.wav",
  D4: "D4.wav",
  E4: "E4.wav",
  F4: "F4.wav",
  G4: "G4.wav",
  A4: "A4.wav",
  B4: "B4.wav",
  C5: "C5.wav"
},
  baseUrl: "./samples/",
  maxPolyphony: 32, // ←これ追加
  onload: () => {
    console.log("音源ロード完了");
  }
}).toDestination();


window.synth.volume.value = 0;

// ★ここに置く（Sampler 初期化のすぐ下）
window.synth.context.on('statechange', () => {
  console.log("AudioContext state:", window.synth.context.state);
});


// 音源読み込みの成否をチェック
Tone.loaded().then(() => {
    console.log("すべてのサンプルがロードされました");
}).catch((e) => {
    console.error("ロード中にエラー発生:", e);
});


let lastPlayTime = 0;
let prevRMS = 0;
let baseline = 0;
let prevSpectrum = [];
let latestRMS = 0;
let latestSpectrum = [];
let lastHitDetect = 0;
let usedNotes = new Set();
let score = 0;
let running = false;
let paused = false;
let pauseStart = 0;
let pausedTime = 0;
let notes = [];
let active = [];
let index = 0;
let combo = 0;
let hitCount = 0;
let totalCount = 0;
let whiteIndex = 0;
let splitNote = 60;
let speed = 1.0;
let timeSignature = 4; // デフォルトは4拍子
let startTime = 0;
let currentSongName = ""; // 今選んでいる曲名


function play(note){
  console.log("play実行", note);

  try {
    window.synth.triggerAttackRelease(note, 0.6, Tone.now());
  } catch (e) {
    console.error("play error:", e);
  }
}
window.synth.volume.rampTo(-6, 0.1);
setTimeout(() => {
  window.synth.volume.rampTo(0, 0.05);
}, 80);
const buttons = [
    document.getElementById("play-btn"),
    document.getElementById("stop-btn"),
    document.getElementById("pause-btn"),
    document.getElementById("rewind-btn")
];

document.getElementById("play-btn").addEventListener("click", async () => {
  await Tone.start();
await Tone.loaded();

  if (!window.synth) return;

  console.log("synth loaded:", window.synth.loaded);

  startGame();
});

document.getElementById("stop-btn").onclick = stopGame;
document.getElementById("pause-btn").onclick = pauseGame;
document.getElementById("rewind-btn").onclick = rewindGame;

function getTime(){
  const rawTime = (performance.now() - startTime - pausedTime) / 1000;
  return rawTime * speed;  // ← speed は後で説明
}

const playButton = document.getElementById('play-btn');
const pauseButton = document.getElementById('pause-btn');
const stopButton = document.getElementById('stop-btn');

function changeButtonColor(activeButton) {
  buttons.forEach(btn => btn.classList.remove('active'));
  if (activeButton) activeButton.classList.add('active');
}

playButton.addEventListener('click', () => { changeButtonColor(playButton); });
pauseButton.addEventListener('click', () => { changeButtonColor(pauseButton); });

function renderKeyboard(id) {
    const kb = document.getElementById(id);
    if (!kb) return;
    
    kb.querySelectorAll(".key,.black").forEach(e => e.remove());
    const whiteNotes = keys.filter(n => !n.includes("#"));
    const isMobile = window.innerWidth <= 768;
    const whiteWidth = isMobile ? 35 : (window.innerWidth / whiteNotes.length);
    
    let whiteIndex = 0;
    keys.forEach(note => {
        const isBlack = note.includes("#");
        const key = document.createElement("div");
        key.dataset.note = note;
        
        if (isBlack) {
            key.className = "black";
            key.style.left = (whiteIndex * whiteWidth - 11) + "px"; 
        } else {
            key.className = "key";
            key.style.left = (whiteIndex * whiteWidth) + "px";
            key.style.width = whiteWidth + "px";
            whiteIndex++;
        }
        kb.appendChild(key);
    });
    paintKeyboard();
}

async function startMic() {
    try {
        if (!navigator.mediaDevices?.getUserMedia) return false;
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        const analyzer = Meyda.createMeydaAnalyzer({
            audioContext: audioContext,
            source: source,
            bufferSize: 512,
            featureExtractors: ["rms", "amplitudeSpectrum", "spectralCentroid"],
            callback: (features) => {
                const currentRMS = features.rms || 0;
                const spectrum = features.amplitudeSpectrum || [];
                const centroid = features.spectralCentroid || 0;
                latestRMS = currentRMS;
                latestSpectrum = spectrum;
                baseline = baseline * 0.95 + currentRMS * 0.05;
                let flux = 0;
                if (prevSpectrum.length && prevSpectrum.length === spectrum.length) {
                    for (let i = 0; i < spectrum.length; i++) {
                        flux += Math.abs(spectrum[i] - prevSpectrum[i]);
                    }
                }
                const delta = currentRMS - prevRMS;
                const now = performance.now();

                const debug = document.getElementById("debug");
                if (debug) {
                    debug.textContent = "RMS : " + currentRMS.toFixed(3) + " / base : " + baseline.toFixed(3);
                }

                const attackMode = currentRMS > 0.015 && currentRMS > baseline * 2 && (flux > 0.15 || delta > baseline * 1.2);
                if (attackMode && now - lastHitDetect > 300) {
                    hitNearest();
                    lastHitDetect = now;
                }
                prevRMS = currentRMS;
                prevSpectrum = [...spectrum];
            }
        });
        analyzer.start();
        analyser = analyzer;
        return true;
    } catch (e) { return false; }
}

function loadInitialMidi() {
    const saved = localStorage.getItem("savedMidi");
    if (saved) {
        try {
            const obj = JSON.parse(saved);
            const uint = new Uint8Array(obj.data);
            loadMidi(uint.buffer, obj.name);
            return Promise.resolve();
        } catch (e) { console.warn("saved MIDI破損:", e); }
    }
    return loadMidiFromUrl("./songs/55.mid", "55.mid");
}

async function loadMidiFromUrl(url, fileName){
  const res = await fetch(url);
  const buf = await res.arrayBuffer();
  loadMidi(buf, fileName);
}

function loadMidi(buffer, fileName){
  chordSpawnIndex = {};
  const midi = new Midi(buffer);
    timeSignature = midi.header.timeSignatures?.[0]?.timeSignature?.[0] || 4;
  const keySig = midi.header.keySignatures?.[0];
  const keyFix = { "D#":"Eb", "Eb":"Eb", "C#":"Db", "Db":"Db", "F#":"Gb", "Gb":"Gb", "G#":"Ab", "Ab":"Ab", "A#":"Bb", "Bb":"Bb" };
  window.currentKey = keyFix[keySig?.key] || "C";

  notes = [];
  usedNotes.clear();

  let playableTrackCount = 0;
  midi.tracks.forEach(t => {
    if (t.notes.length === 0) return;
    t.notes.forEach(n => {
      notes.push({
        time: n.time,
        note: n.name,
        midi: n.midi,
        duration: n.duration,
        hand: (playableTrackCount === 0) ? "right" : "left"
      });
      usedNotes.add(n.name);
    });
    playableTrackCount++;
  });

  notes.sort((a, b) => a.time - b.time);

  let currentChordId = 0;
  for (let i = 0; i < notes.length; i++) {
    if (i > 0 && Math.abs(notes[i].time - notes[i - 1].time) > 0.01) {
      currentChordId++;
    }
    notes[i].chordId = currentChordId;
  }
  totalCount = notes.length;
  paintKeyboard();
}

function noteToSolfege(noteName){
    const pitch = noteName.replace(/[0-9]/g, "");
    const normalize = {
        "C":"C", "C#":"C#","Db":"C#", "D":"D", "D#":"D#","Eb":"D#", "E":"E","Fb":"E",
        "F":"F","E#":"F", "F#":"F#","Gb":"F#", "G":"G", "G#":"G#","Ab":"G#", "A":"A",
        "A#":"A#","Bb":"A#", "B":"B","Cb":"B"
    };
    const p = normalize[pitch];
    if(!p) return pitch;

    const key = window.currentKey || "C";
    const majorScale = {
        C:  ["C","D","E","F","G","A","B"], G:  ["C","D","E","F#","G","A","B"],
        D:  ["C#","D","E","F#","G","A","B"], A:  ["C#","D","E","F#","G#","A","B"],
        E:  ["C#","D#","E","F#","G#","A","B"], B:  ["C#","D#","E","F#","G#","A#","B"],
        F:  ["C","D","E","F","G","A","A#"], Bb: ["C","D","D#","F","G","A","A#"],
        Eb: ["C","D","D#","F","G","G#","A#"], Ab: ["C","C#","D#","F","G","G#","A#"]
    };
    const solfege = ["ド","レ","ミ","ファ","ソ","ラ","シ"];
    const scale = majorScale[key];
    const idx = scale.indexOf(p);
    if(idx !== -1) return solfege[idx];

    const kana = {
        "C":"ド", "C#":"ド♯", "D":"レ", "D#":"レ♯", "E":"ミ", "F":"ファ",
        "F#":"ファ♯", "G":"ソ", "G#":"ソ♯", "A":"ラ", "A#":"ラ♯", "B":"シ"
    };
    return kana[p] || p;
}

function loop() {
  if (!running || paused) return;
  const now = performance.now();
  last = now;
  const gameTime = getTime();

  const currentBpm = typeof bpm !== 'undefined' ? bpm : 120;
  const secondsPerBeat = 60 / currentBpm;
  const currentBeatIndex = Math.floor(gameTime / secondsPerBeat);

if (currentBeatIndex % timeSignature === 0 && gameTime > 0.05) {
    const beatProgress = gameTime % secondsPerBeat;
    if (beatProgress < 0.05 && !window.hasFlashedThisBeat) {
      const bodyEl = document.body;
      bodyEl.classList.add('beat-flash');
      window.hasFlashedThisBeat = true;
      setTimeout(() => { bodyEl.classList.remove('beat-flash'); }, 160);
    }
  }

  if (gameTime % secondsPerBeat >= 0.05) {
    window.hasFlashedThisBeat = false;
  }

while (index < notes.length && notes[index].time <= gameTime) {
  const n = notes[index];

  console.log("再生", n.note);

  play(n.note);   // ←これ

  spawn(n);

  index++;
}

  active.forEach(n => {
    if (n.removed) return;

    // --- ノーツの位置更新 ---
    const isBlack = n.keyTop.classList.contains("black");
    if (isBlack) {
      n.el.style.top = (n.keyTop.offsetTop + 25) + "px";
    } else {
      n.el.style.top = (n.keyTop.offsetTop + 20) + "px";
    }

    // --- 1. 予兆（pre-hit）の判定：0.2秒前から光り始める ---
    if (!n.preShown && gameTime >= n.hit - 0.2) {
      n.keyTop?.classList.add("pre-hit");
      n.preShown = true;
    }

    // --- 2. ガイド発光の判定：0.15秒前から光る（くっきりした光） ---
    if (!n.guideShown && gameTime >= n.hit - 0.15) {
      n.el.classList.add("note-active");
      if (n.hand === "left") {
        n.keyTop?.classList.add("guide-left");
      } else {
        n.keyTop?.classList.add("guide-right");
      }
      n.guideShown = true;
    }

const stayTime = Math.max(n.duration || 0.15, 0.15);
// loop関数内のミス判定・削除ブロックを修正
if (!n.missed && gameTime - n.hit > stayTime) {
    n.missed = true;
    n.keyTop?.classList.remove("pre-hit", "guide-left", "guide-right");

// 💡 削除の代わりにクラスを外してフェードアウトさせる
    n.el.classList.remove("note-active"); 
    
    // 0.2秒（CSSのtransition時間）待ってから要素を削除
    setTimeout(() => {
        n.el?.remove();
    }, 200);

      active = active.filter(x => x !== n);
      return;
    }

    // --- 手のバー表示ロジック ---
    if (gameTime > n.hit - 0.35 && gameTime < n.hit + 0.2) {
      const BAR_WIDTH = 280;
      leftBar.style.width = BAR_WIDTH + "px";
      rightBar.style.width = BAR_WIDTH + "px";
      const handId = n.hand === "left" ? "leftHand" : "rightHand";
      const handEl = document.getElementById(handId);
      const gameRect = document.getElementById("gameArea").getBoundingClientRect();

      let xs = [];
      const chordNotes = active.filter(x => x.chordId === n.chordId && x.hand === n.hand && !x.missed);
      chordNotes.forEach(cn => {
        const r = cn.keyTop?.getBoundingClientRect();
        if (r) {
          const x = (r.left - gameRect.left) + r.width / 2;
          xs.push(x);
        }
      });

      if (xs.length === 0) return;
      const centerX = xs.reduce((sum, v) => sum + v, 0) / xs.length;

      if (handEl) {
        handEl.style.top = "520px";
        handEl.style.opacity = "0.4";
        handEl.classList.add("active");
      }

      if (n.hand === "right") {
        rightBar.style.left = (centerX - BAR_WIDTH / 2) + "px";
        rightBar.style.top = "480px";
        rightBar.style.opacity = "0.7";
        leftBar.style.opacity = "0";
      } else if (n.hand === "left") {
        leftBar.style.left = (centerX - BAR_WIDTH / 2) + "px";
        leftBar.style.top = "480px";
        leftBar.style.opacity = "0.7";
        rightBar.style.opacity = "0";
      }
    }
  });

  if (index >= notes.length && active.length === 0) {
    running = false;
    showGoal();
    return;
  }
  requestAnimationFrame(loop);
}



function success(best) {
  if (best.done) return; 
  best.done = true;

  best.keyTop?.classList.remove("pre-hit", "guide-left", "guide-right");
  const handId = best.hand === "left" ? "leftHand" : "rightHand";
  const handEl = document.getElementById(handId);
  if (handEl) {
    handEl.classList.remove("tap");
    void handEl.offsetWidth;
    handEl.classList.add("tap");
    
    clearTimeout(handEl.timer);
    handEl.timer = setTimeout(() => {
      handEl.classList.remove("tap");
      const now = getTime();
      const hasIncoming = active.some(x => x.hand === best.hand && x.hit - now < 0.4 && !x.missed);
      if (!hasIncoming) {
        handEl.classList.remove("active");
        handEl.style.top = "650px"; 
        handEl.style.opacity = "0";
        handEl.style.transform = "scale(1)";
      }
    }, 150);
  }

  best.el.classList.add("note-suck");
  best.removed = true;

  setTimeout(() => { best.el?.remove(); }, 250);
  active = active.filter(n => n !== best);
  hitCount++;
  update();
}

function hitNearest(){
  const now = getTime();
  const candidates = active.filter(n => n.guideShown && !n.done);
  if(candidates.length === 0) return;

  const best = candidates[0];
  active.filter(n => n.chordId === best.chordId && n.hand === best.hand).forEach(n => {
      // ⭐ 改定：マイクヒット時も上の鍵盤をピカッと輝かせる
      if (n.keyTop) {
          n.keyTop.classList.add("hit");
          setTimeout(() => n.keyTop.classList.remove("hit"), 140);
      }
      success(n);
  });
}

/* ================= ⭐ 改定：TAP用HIT処理 ================= */
function hit(note){
  // ⭐ 下の鍵盤へのクラス付与になっていた箇所を「keyboard-top」へ完全移行
  /*
  const key = document.querySelector(`#keyboard-top [data-note="${note}"]`);
  if (key) {
    key.classList.add("hit");
    setTimeout(() => key.classList.remove("hit"), 140);
  }
*/
  const t = getTime();
  const JUDGE_WINDOW = 0.6;
  let best = null;
  let bestDiff = 999;

  active.forEach(n => {
    if (n.note !== note) return;
    const diff = n.hit - t;
    if (Math.abs(diff) > JUDGE_WINDOW) return;
    const absDiff = Math.abs(diff);
    if (absDiff < bestDiff) {
      bestDiff = absDiff;
      best = n;
    }
  });

  if (best) {
    success(best, note);
    score += 300;
    combo++;
  }
  update();
}

  }
}

    btn.textContent = song.title.substring(0, 2);
    
    // 押している（ホバー）間だけフルネームに切り替え
    btn.onmouseover = () => btn.textContent = song.title;
    btn.onmouseout = () => btn.textContent = song.title.substring(0, 2);
    
    // クリック時の処理
    btn.onclick = () => loadSong(song.file);
    row.appendChild(btn);
});
}
// ページ読み込み時に実行
initSongMenu();

function toggleSongMenu() {
  const menu = document.getElementById("songMenu");
  menu.style.display = (menu.style.display === "block") ? "none" : "block";
}



</script>
