<html lang="ja">

<style>

body{
  margin:0;
  padding:0;
  background: #fff176;
  color:white;
  text-align:center;
  font-family:sans-serif;
  overflow:hidden;
}

#gameArea {

  width: 100%;
  height: 60vh;

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

}

#mascot{
  position:absolute;
  width:100%;
  height:70%;
  left:0;
  top:0;
  object-fit:contain;
  object-position:top;
  pointer-events:none;
  z-index:1;
}


#keyboard-top {
  position: relative;
  margin-top: 40px;
  top: 0;
  left: 0;
  width: 100%;
  height: 120px; 
  z-index: 10;
}

#keyboard-bottom {
  position: relative;
  margin-top: 70px;   
  height: 140px;
  z-index: 10;
}


#ui {
  display: flex;
  gap: 5px;            
  padding: 4px 10px;   
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(6px);
  border-radius: 20px;

  top: 10px;
  left: 50%;

}

.controls-container {

  flex-wrap: nowrap;

  white-space: nowrap;
}


/* 曲選択ボタン（花） */
.flowerBtn{

  align-items: center;
  border:none;
  background:none;
  font-size:36px;
  cursor:pointer;
  transition:0.2s;
  justify-content: center;
  height: 28px; /* 大きさ調整 */
}
/*お花の位置 */
#flowerBar{
  position:absolute;
  top:10px;
  left:100px;
  transform:translateX(-50%);/*結局これが良い */
  display:flex;
  gap:20px;
  z-index:200;
}
/*お花押すと出るメニューの位置と枠 */
#songMenu {
    position: absolute;
    top: 60px; 
    left: 100px;   /* 上記flowerBar と揃える */
    background: rgba(0, 0, 0, 0.9); 
    border: 2px solid #ff7ac8;
    border-radius: 10px; 
    z-index: 999; 
    display: none; 
    flex-direction: column; 
    gap: 8px;

}
/*メニューボタン*/
.menuSongBtn {
    /* レイアウト */
    display: block;
    width: 100%;
    padding: 10px 12px;
    text-align: center;

    /* 見た目 */
    background: #ff7ac8;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;

}

.menuSongBtn:hover {
    background: #ff3399;
}


/* スコアの文字サイズ調整 */
#hitCount, #score-display {
  font-size: 25px;
  color: rgb(12, 46, 2);
}


/* hitしたら鍵盤光る */
.hit {
  background: #ff3399 !important; 
  box-shadow: inset 0 0 15px rgba(255, 51, 153, 0.8), 0 0 15px #ff3399; 
}

/* 光る鍵盤(上）ガイド */
.guide{
  box-shadow: 0 0 8px rgba(120,220,255,0.5);
}
.guide-active {
  animation: guideGlow 0.25s ease-out;
}


.guide-right{

}

.guide-left{

}

@keyframes guideRight{
  0%{
    transform: scaleY(1);

  }

}
@keyframes guideLeft{

  }

  opacity: 0;
  transform: none;
  transition: opacity 0.15s ease;
  z-index: 50; 
}

.note-active {
  opacity: 1;
  transform: none;
}

.note-text{
  position:absolute; 
  top:50%; 
  left:50%;

  color:white;

.note-hit {

}

.note-suck{

/* ✨ スタイルシート内の .piano-hand の設定を以下に丸ごと置き換え */
.piano-hand {
  display: none !important;
  position: absolute;
  height: 200px;         /* 鍵盤のサイズに合わせて少し小ぶりに調整 */

  pointer-events: none; /* クリック判定を邪魔しない */
  
  /* 初期位置：鍵盤（470px）の下に完全に隠す（ゲームエリアの高さは88vh≒約600〜700px） */
  top: 650px;           
  left: 0px;
  
  /* じわっと消えずに、キビキビ動かすためにtransitionを最適化 */

/* 叩いた瞬間：少しだけ上にピョコッと動く（または縮む） */

/* 登場 */

/* フワフワ浮遊 */

#lineLayer{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:90;

</style>

<script>

/* ===== グローバル（ここが全部の土台）===== */
let prevRMS = 0;
let baseline = 0;
let prevSpectrum = [];
let latestRMS = 0;
let latestSpectrum = [];
let lastHitDetect = 0;
let usedNotes = new Set();
let score = 0;
let running = false;
let paused = false;
let pauseStart = 0;
let pausedTime = 0;

/* ===== ボタンのイベント登録（ここがベスト）===== */
document.getElementById("play-btn").onclick = startGame;
document.getElementById("stop-btn").onclick = stopGame;
document.getElementById("pause-btn").onclick = pauseGame;

function pauseGame(){
  if (!running) return;

  if (!paused){
    // 一時停止に入る
    paused = true;
    pauseStart = performance.now();
  } else {
    // 再開する
    paused = false;
    pausedTime += performance.now() - pauseStart;
    requestAnimationFrame(loop);
  }
}




async function startMic() {

  const stream =
    await navigator.mediaDevices.getUserMedia({
      audio: true
    });

  const audioContext =
    new AudioContext();

  const source =
    audioContext.createMediaStreamSource(
      stream
    );

  const analyzer =
    Meyda.createMeydaAnalyzer({
      audioContext: audioContext,
      source: source,
      bufferSize: 512,
      featureExtractors: [
        "rms",
        "amplitudeSpectrum",
        "spectralCentroid"
      ],

      callback: (features) => {

        const currentRMS =
          features.rms || 0;

        const spectrum =
          features.amplitudeSpectrum || [];

        const centroid =
          features.spectralCentroid || 0;

        latestRMS = currentRMS;
        latestSpectrum = spectrum;

        /* ================= baseline ================= */

        baseline =
          baseline * 0.95 +
          currentRMS * 0.05;

        /* ================= flux ================= */

        let flux = 0;

        if(
          prevSpectrum.length &&
          prevSpectrum.length === spectrum.length
        ){

          for(let i = 0; i < spectrum.length; i++){

            flux += Math.abs(
              spectrum[i] - prevSpectrum[i]
            );

          }

        }

        /* ================= delta ================= */

        const delta =
          currentRMS - prevRMS;

        const now =
          performance.now();

        /* ================= DEBUG ================= */

        const debug =
          document.getElementById("debug");

        if(debug){

          debug.textContent =

            "RMS : "
            + currentRMS.toFixed(3)

            + " / Δ : "
            + delta.toFixed(3)

            + " / base : "
            + baseline.toFixed(3)

            + " / flux : "
            + flux.toFixed(3)

            + " / centroid : "
            + centroid.toFixed(0);

        }

        /* ================= HIT DETECT ================= */

        const attackMode =
          currentRMS > 0.015 &&
          currentRMS > baseline * 2 &&
          (
            flux > 0.15 ||
            delta > baseline * 1.2
          );
        if(
          attackMode &&
          now - lastHitDetect > 300
        ){
          console.log("押された！");
          hitNearest();
          lastHitDetect = now;
        }

        /* ================= SAVE ================= */

        prevRMS = currentRMS;

        prevSpectrum = [...spectrum];

      }

    });

  analyser = analyzer;

  analyser.start();

} // startMic end
/* ================= AUDIO （音）================= */
let mic;
let analyser;

const synth = new Tone.PolySynth(
  Tone.Synth,
  {
    oscillator:{
      type:"triangle"
    }
  }
).toDestination();


/* ================= STATE （ゲーム状態）================= */

let notes = [];
let active = [];
let index = 0;

let combo = 0;

let hitCount = 0;
let totalCount = 0;

let whiteIndex = 0;

let splitNote = 60;
let speed = 0.5;

/* ================= TIMING （時間）=================== */

let startTime = 0;

function getTime(){

  const rawTime =
    (performance.now() - startTime - pausedTime)
    / 1000
    - 3;

  return rawTime * speed;
}

// HTMLからすべてのコントロールボタンを取得
const buttons = document.querySelectorAll('.control-btn');

// 再生・一時停止・ストップの各ボタン要素（IDなどで個別にも取得しておく）
const playButton = document.getElementById('play-btn');
const pauseButton = document.getElementById('pause-btn');
const stopButton = document.getElementById('stop-btn');

// 全てのボタンの色を一旦元に戻す共通の関数
function changeButtonColor(activeButton) {
  buttons.forEach(btn => {
    btn.classList.remove('active'); // 一旦すべての active クラスを消す
  });
  
  if (activeButton) {
    activeButton.classList.add('active'); // 押されたボタンだけに active をつける
  }
}

/* ================= 各ボタンのイベント ================= */

// 1. 再生ボタンが押されたとき
playButton.addEventListener('click', () => {
  changeButtonColor(playButton); // 再生ボタンの色を変える
  
  // ここに再生の処理（isPlaying = true など）を書く
});

// 2. 一時停止ボタンが押されたとき
pauseButton.addEventListener('click', () => {
  changeButtonColor(pauseButton); // 一時停止ボタンの色を変える
  
  // ここに一時停止の処理を書く
});

// 3. ストップボタンが押されたとき
stopButton.addEventListener('click', () => {
  // ストップボタンは押した瞬間だけ色が変わればいい（ or 全ての色を消す）ので
  // 今回は「全部のボタンの色を元に戻す（未選択状態にする）」にします
  changeButtonColor(null); 
  
  // ここにストップの処理（時間を最初に戻すなど）を書く
});


/* ================= CONFIG （設定）================= */
const travelTime = 3.0; // 1.2秒だと一瞬で通り過ぎて早すぎるので、2.5〜3.0秒くらいがオススメです
const hitY = 300;       // ★上の段の鍵盤の頭（120px付近）を判定ラインにする
const spawnY = -50;     // ★画面の一番上（見えない上空 -50px）から降らせる
const SPEED_MAP = {slow: 0.4, normal: 0.6, fast: 0.8 };
const gameArea = document.getElementById("gameArea");


let gameWidth = gameArea.clientWidth;

function loadInitialMidi() {
  // 優先：保存データ
  const saved = localStorage.getItem("savedMidi");

  if (saved) {
    try {
      const obj = JSON.parse(saved);
      const uint = new Uint8Array(obj.data);

      loadMidi(uint.buffer, obj.name);
      return;
    } catch (e) {
      console.warn("saved MIDI破損:", e);
    }
  }

  // フォールバック：固定曲
  loadMidiFromUrl("./songs/55.mid", "55.mid");
}

function noteToSolfege(noteName){
    // ① オクターブ除去
    const pitch = noteName.replace(/[0-9]/g, "");

    // ② 異名同音を統一
    const normalize = {
        "C":"C",
        "C#":"C#","Db":"C#",
        "D":"D",
        "D#":"D#","Eb":"D#",
        "E":"E","Fb":"E",
        "F":"F","E#":"F",
        "F#":"F#","Gb":"F#",
        "G":"G",
        "G#":"G#","Ab":"G#",
        "A":"A",
        "A#":"A#","Bb":"A#",
        "B":"B","Cb":"B"
    };

    const p = normalize[pitch];
    if(!p) return pitch;

    // ③ 調性（メジャー）
    const key = window.currentKey || "C";

    const majorScale = {
        C:  ["C","D","E","F","G","A","B"],
        G:  ["C","D","E","F#","G","A","B"],
        D:  ["C#","D","E","F#","G","A","B"],
        A:  ["C#","D","E","F#","G#","A","B"],
        E:  ["C#","D#","E","F#","G#","A","B"],
        B:  ["C#","D#","E","F#","G#","A#","B"],
        F:  ["C","D","E","F","G","A","A#"],
        Bb: ["C","D","D#","F","G","A","A#"],
        Eb: ["C","D","D#","F","G","G#","A#"],
        Ab: ["C","C#","D#","F","G","G#","A#"]
    };

    const solfege = ["ド","レ","ミ","ファ","ソ","ラ","シ"];

    const scale = majorScale[key];

    // ④ スケール内 → ドレミ
    const idx = scale.indexOf(p);
    if(idx !== -1){
        return solfege[idx];
    }

    // ⑤ スケール外 → カタカナ臨時音
    const kana = {
        "C":"ド",
        "C#":"ド♯",
        "D":"レ",
        "D#":"レ♯",
        "E":"ミ",
        "F":"ファ",
        "F#":"ファ♯",
        "G":"ソ",
        "G#":"ソ♯",
        "A":"ラ",
        "A#":"ラ♯",
        "B":"シ"
    };

    return kana[p] || p;
}

/* ================= SPAWN ================= */
function spawn(n){
  console.log(n.note, n.duration);

  // ★ 機能を入れ替え：top がメイン（判定・ノーツ表示）、bottom が予告ガイド用
  const keyTop =
    document.querySelector(`#keyboard-top [data-note="${n.note}"]`);

  const keyBottom =
    document.querySelector(`#keyboard-bottom [data-note="${n.note}"]`);

  if(!keyTop) return;

  const g = document.getElementById("gameArea").getBoundingClientRect();
  const k = keyTop.getBoundingClientRect();

  const isBlack = keyTop.classList.contains("black");

  const el = document.createElement("div");
  el.className = "note note-spawn";

  let color =
    n.hand === "left"
      ? (isBlack ? "#1f4f7a" : "#4aa3ff")
      : (isBlack ? "#7a1f1f" : "#ff4a4a");

  el.style.background = color;

  const text = document.createElement("div");
  text.className = "note-text";
  text.textContent = noteToSolfege(n.note);

  el.appendChild(text);

  // ★ 基準をすべて keyTop に変更
  el.style.top =
    (keyTop.offsetTop + (isBlack ? 35 : 70)) + "px";

  el.style.left =
    (keyTop.offsetLeft + keyTop.offsetWidth / 2 - 15) + "px";
    
  document.getElementById("notes-layer").appendChild(el);

  const idx = notes.indexOf(n);

  let next =
    notes
      .slice(idx + 1)
      .find(x => x.hand === n.hand);

  if(
    next &&
    next.note === n.note &&
    next.time - n.time < 0.3
  ){
    return;
  }

  if(next){
    // ★ 次の鍵盤も top から探す
    const nextKey =
      document.querySelector(
        `#keyboard-top [data-note="${next.note}"]`
      );

    if(nextKey){
      // ★ 現在の keyTop の中心座標
      const x1 =
        keyTop.offsetLeft + keyTop.offsetWidth / 2;

      const y1 =
        keyTop.offsetTop + (isBlack ? 35 : 80);

      // ★ 次の keyTop の中心座標
      const x2 =
        nextKey.offsetLeft + nextKey.offsetWidth / 2;

      const y2 =
        nextKey.offsetTop +
        (nextKey.classList.contains("black") ? 35 : 70);

      const dx = x2 - x1;
      const dy = y2 - y1;

      const angle = Math.atan2(dy, dx) * 180 / Math.PI;

      const beak = document.createElement("div");

      beak.style.position = "absolute";
      beak.style.pointerEvents = "none";
      beak.style.zIndex = "25";

      beak.style.width = "0";
      beak.style.height = "0";

      beak.style.borderTop = "8px solid transparent";
      beak.style.borderBottom = "8px solid transparent";

      beak.style.borderRight =
        n.hand === "left"
          ? "5px solid rgba(74,163,255,0.7)"
          : "5px solid rgba(255,74,74,0.7)";

      beak.style.left = (x1 - 12) + "px";
      beak.style.top  = (y1 - 8) + "px";

      beak.style.transformOrigin = "right center";
      beak.style.transform = `rotate(${angle}deg)`;

      document.getElementById("notes-layer").appendChild(beak);

      setTimeout(() => {
        beak.style.transition = "opacity 0.15s";
        beak.style.opacity = "0";
      }, 80);

      setTimeout(() => {
        beak.remove();
      }, 250);
    }
  }

  active.push({
    el,
    note: n.note,
    keyBottom, // 下鍵盤（新・ガイド用）
    keyTop,    // 上鍵盤（新・メイン判定用）
    hit: n.time,
    hand: n.hand,
    chordId: n.chordId,
    duration: n.duration,
    missed: false
  });
}

let last = performance.now();

function loop() {


  if (!running) return;
  if (paused) return;

  const now = performance.now();
 
  console.log(
    "FPS",
    Math.round(1000 / (now - last))
  );

  last = now;
  
  const gameTime = getTime();

  // ★ ノーツ生成（このままでOK）
  while (index < notes.length && notes[index].time <= gameTime) {
    spawn(notes[index]);
    index++;
  }

active.forEach(n => {
    if (n.removed) return;

    // ==========================================
    // ① ノーツを【上の鍵盤（keyTop）】の位置に固定
    // ==========================================
    const isBlack = n.keyTop.classList.contains("black");

    n.el.style.top =
      (n.keyTop.offsetTop + (isBlack ? 35 : 80)) + "px";

    n.el.style.left =
      (n.keyTop.offsetLeft + n.keyTop.offsetWidth / 2 - 11) + "px";

    // ==========================================
    // ② ガイド処理（【下の鍵盤（keyBottom）】を光らせる）
    // ==========================================
    if (!n.guideShown && gameTime >= n.hit - 0.15) {
      n.el.classList.add("note-active");
      if (n.hand === "left") {
        n.keyBottom?.classList.add("guide-left");  // 下の鍵盤を光らせる
      } else {
        n.keyBottom?.classList.add("guide-right"); // 下の鍵盤を光らせる
      }
      n.guideShown = true;
    }

    // ==========================================
    // MISS処理（変更なし）
    // ==========================================
    const stayTime = Math.max(n.duration || 0.15, 0.15);

    if (!n.missed && gameTime - n.hit > stayTime) {
      n.missed = true;

      // 下の鍵盤のガイドを消去
      n.keyBottom?.classList.remove("guide-left", "guide-right");
      n.el?.remove();

      active = active.filter(x => x !== n);
      return;
    }

    // ==========================================
    // ③ 手・バーの追従（【上の鍵盤（keyTop）】の和音中央を計算）
    // ==========================================
    if (gameTime > n.hit - 0.35 && gameTime < n.hit + 0.2) {

      const leftBar = document.getElementById("leftBar");
      const rightBar = document.getElementById("rightBar");

      const BAR_WIDTH = 280;
      leftBar.style.width = BAR_WIDTH + "px";
      rightBar.style.width = BAR_WIDTH + "px";

      const handId = n.hand === "left" ? "leftHand" : "rightHand";
      const handEl = document.getElementById(handId);
      const gameRect = document.getElementById("gameArea").getBoundingClientRect();

      // 同じタイミング・同じ手のノーツのX座標を【上の鍵盤】からすべて集める
      let xs = [];
      const chordNotes = active.filter(x => x.chordId === n.chordId && x.hand === n.hand && !x.missed);

      chordNotes.forEach(cn => {
        const r = cn.keyTop?.getBoundingClientRect(); // ★基準を keyTop に変更
        if (r) {
          // 上鍵盤の中心のX座標をゲームエリア基準で計算
          const x = (r.left - gameRect.left) + r.width / 2;
          xs.push(x);
        }
      });

      // データが無い場合はスキップ
      if (xs.length === 0) return;

      // すべての音の「平均中心値」を計算
      const centerX = xs.reduce((sum, v) => sum + v, 0) / xs.length;

      // イラスト（手）の更新
      if (handEl) {
        handEl.style.top = "520px";
        handEl.style.opacity = "0.4";
        handEl.classList.add("active");
      }

      // トラックバーの追従（左右分離）
      if (n.hand === "right") {
        rightBar.style.left = (centerX - BAR_WIDTH / 2) + "px";
        rightBar.style.top = "480px";
        rightBar.style.opacity = "0.7";
        leftBar.style.opacity = "0"; 
      } 
      else if (n.hand === "left") {
        leftBar.style.left = (centerX - BAR_WIDTH / 2) + "px";
        leftBar.style.top = "480px";
        leftBar.style.opacity = "0.7";
        rightBar.style.opacity = "0"; 
      }
    }

  });

  // ③ 終了判定
  if (index >= notes.length && active.length === 0) {
    running = false;
    showGoal();
    return;
  }

  requestAnimationFrame(loop);
}

 best.done = true;

const hasIncoming = active.some(x =>

  }

best.el.classList.add("note-suck");

best.removed = true; // ←重要

setTimeout(() => {

}, 250);

active = active.filter(n => n !== best);
  hitCount++;

/* ================= hitnearest ================= */
function hitNearest(){

  const hitRange = 40;

  let bestDist = 999;

  // 一番近いノーツを探す
  active.forEach(n => {
    if (n.done) return false;

    const rect = n.el.getBoundingClientRect();
    const game = document.getElementById("gameArea").getBoundingClientRect();

    const y = rect.top - game.top;

    const dist = Math.abs(y - hitY);

    if(dist < bestDist){
      bestDist = dist;
    }

  });

  if(bestDist > hitRange) return;

  let judge = "GOOD";

  if(bestDist < 15){
    judge = "PERFECT";
  }

  // 一番近いノーツと同じタイミングのものを全部消す
  active
    .filter(n => {

      const rect = n.el.getBoundingClientRect();
      const game = document.getElementById("gameArea").getBoundingClientRect();

      const y = rect.top - game.top;

      const dist = Math.abs(y - hitY);

      return Math.abs(dist - bestDist) < 12;

    })
    .forEach(n => success(n));

  showJudge(judge);
}


/* ================= HIT ================= */
function hit(note){
  // 鍵盤を光らせる
  const key = document.querySelector(`#keyboard-bottom [data-note="${note}"]`);
  if (key) {
    key.classList.add("hit");
    setTimeout(() => key.classList.remove("hit"), 100);
  }

  // ノーツ判定（最も近いノーツを1つだけ取る）
  const t = getTime();
  const JUDGE_WINDOW = 0.6;

  let best = null;
  let bestDiff = 999;

  active.forEach(n => {
    if (n.note !== note) return;

    const diff = n.hit - t;
    if (Math.abs(diff) > JUDGE_WINDOW) return;

    const absDiff = Math.abs(diff);
    if (absDiff < bestDiff) {
      bestDiff = absDiff;
      best = n;
    }
  });

  // ノーツが見つかったら消してスコア加算
  if (best) {
    success(best, note);   // ← ノーツ削除
    score += 300;          // ← スコア加算（固定）
    combo++;               // ← コンボ増加
  }

  update(); // ← スコア表示更新
}

  j.style.transform = "scale(1.4)";

  if(text === "PERFECT"){
    j.style.color = "gold";
  }else if(text === "GOOD"){
    j.style.color = "cyan";
  }else{
    j.style.color = "red";
  }

  clearTimeout(j.timer);

  j.timer = setTimeout(()=>{

    j.textContent = "";
    j.style.transform = "scale(1)";
    j.style.opacity = "0.7";

  },500);

}
function showGoal() {
const el = document.getElementById("hitCount");
if (el) el.textContent = hitCount;

  setTimeout(() => {
    el.style.display = "none";
  }, 2500);
}




function loadSong(fileName){

  loadMidiFromUrl(
    "./songs/" + fileName,
    fileName
  );

}

const songList = [
    { file: "55.mid", title: "バイエル 55番" },
    { file: "3A_前奏曲.mid", title: "オールインワン 前奏曲" },
    { file: "3B_15_マリオネットのダンス.mid", title: "サウンドツリー マリオネット" },
    { file: "コナン.mid", title: "コナン メインテーマ" },
    { file: "カントリーロード.mid", title: "カントリーロード" },
    { file: "Turkishi.mid", title: "トルコ行進曲" },
    { file: "革命.mid", title: "ショパン 革命" }
];


function initSongMenu() {
    const menu = document.getElementById("songMenu");
    if (!menu) return;
    
    menu.innerHTML = "";

    songList.forEach(song => {
        const btn = document.createElement("button");
        btn.className = "menuSongBtn";
        btn.textContent = song.title;
        
        btn.onclick = () => {
            loadSong(song.file);
            menu.style.display = "none";
        };
        
        menu.appendChild(btn);
    });

    console.log("メニューの作成が完了しました！ボタン数:", songList.length);
}
initSongMenu();


function toggleSongMenu() {
  const menu = document.getElementById("songMenu");
  if (menu.style.display === "block") {
    menu.style.display = "none";
  } else {
    menu.style.display = "block";
  }
}


</script>
