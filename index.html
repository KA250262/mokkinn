 z-index:101;

  100% { transform: translateY(-2px) rotate(5deg); }

<script>

/* ===== グローバル（ここが全部の土台）===== */
let prevRMS = 0;
let baseline = 0;
let prevSpectrum = [];
let latestRMS = 0;
let latestSpectrum = [];
let lastHitDetect = 0;
let usedNotes = new Set();
let score = 0;

async function startMic() {

  const stream =
    await navigator.mediaDevices.getUserMedia({
      audio: true
    });

  const audioContext =
    new AudioContext();

  const source =
    audioContext.createMediaStreamSource(
      stream
    );

  const analyzer =
    Meyda.createMeydaAnalyzer({
      audioContext: audioContext,
      source: source,
      bufferSize: 512,
      featureExtractors: [
        "rms",
        "amplitudeSpectrum",
        "spectralCentroid"
      ],

      callback: (features) => {

        const currentRMS =
          features.rms || 0;

        const spectrum =
          features.amplitudeSpectrum || [];

        const centroid =
          features.spectralCentroid || 0;

        latestRMS = currentRMS;
        latestSpectrum = spectrum;

        /* ================= baseline ================= */

        baseline =
          baseline * 0.95 +
          currentRMS * 0.05;

        /* ================= flux ================= */

        let flux = 0;

        if(
          prevSpectrum.length &&
          prevSpectrum.length === spectrum.length
        ){

          for(let i = 0; i < spectrum.length; i++){

            flux += Math.abs(
              spectrum[i] - prevSpectrum[i]
            );

          }

        }

        /* ================= delta ================= */

        const delta =
          currentRMS - prevRMS;

        const now =
          performance.now();

        /* ================= DEBUG ================= */

        const debug =
          document.getElementById("debug");

        if(debug){

          debug.textContent =

            "RMS : "
            + currentRMS.toFixed(3)

            + " / Δ : "
            + delta.toFixed(3)

            + " / base : "
            + baseline.toFixed(3)

            + " / flux : "
            + flux.toFixed(3)

            + " / centroid : "
            + centroid.toFixed(0);

        }

        /* ================= HIT DETECT ================= */

        const attackMode =
          currentRMS > 0.015 &&
          currentRMS > baseline * 2 &&
          (
            flux > 0.15 ||
            delta > baseline * 1.2
          );
        if(
          attackMode &&
          now - lastHitDetect > 300
        ){
          console.log("押された！");
          hitNearest();
          lastHitDetect = now;
        }

        /* ================= SAVE ================= */

        prevRMS = currentRMS;

        prevSpectrum = [...spectrum];

      }

    });

  analyser = analyzer;

  analyser.start();

} // startMic end
/* ================= AUDIO （音）================= */
let mic;
let analyser;

const synth = new Tone.PolySynth(
  Tone.Synth,
  {
    oscillator:{
      type:"triangle"
    }
  }
).toDestination();


/* ================= STATE （ゲーム状態）================= */

let notes = [];
let active = [];
let index = 0;
let running = false;

let combo = 0;

let hitCount = 0;
let totalCount = 0;

let whiteIndex = 0;

let splitNote = 60;
let speed = 0.5;

/* ================= TIMING （時間）=================== */

let startTime = 0;

function getTime(){

  const rawTime =
    (performance.now() - startTime)
    / 1000
    - 3;
  return rawTime * speed;
}
/* ================= CONFIG （設定）================= */
const travelTime = 1.2;
const hitY = 470;
const spawnY = -40;

const SPEED_MAP = {
  slow: 0.4,
  normal: 0.6,
  fast: 0.8
};

const songConfig = {
  "song.mid": { split: 60 },
  "55.mid": { split: 70 },
  "3B_15_マリオネットのダンス.mid": { split: 67 },
  "3A_前奏曲.mid": { split: 68 }
};

const noteMap = {
  "C":"ど",
  "D":"れ",
  "E":"み",
  "F":"ふぁ",
  "G":"そ",
  "A":"ら",
  "B":"し"
};


const gameArea = document.getElementById("gameArea");
const gameWidth = gameArea.clientWidth;
/* ================= KEYBOARD ================= */

const keys = ["C1","C#1","D1","D#1","E1","F1","F#1","G1","G#1","A1","A#1",
"B1", "C2","C#2","D2","D#2","E2","F2","F#2","G2","G#2","A2","A#2","B2",
 "C3","C#3","D3","D#3","E3","F3","F#3","G3","G#3","A3","A#3","B3", 
 "C4","C#4","D4","D#4","E4","F4","F#4","G4","G#4","A4","A#4","B4", 
 "C5","C#5","D5","D#5","E5","F5","F#5","G5","G#5","A5","A#5","B5",
 "C6","C#6","D6","D#6","E6","F6","F#6","G6","G#6","A6","A#6","B6", "C7" ];

const kb = document.getElementById("keyboard");

kb.innerHTML = "";


keys.forEach(n=>{
  const k = document.createElement("div");
  k.dataset.note = n;

  const isBlack = n.includes("#");
  k.className = isBlack ? "black" : "key";

  if(isBlack){
    k.style.left =
      (whiteIndex * 28 - 9) + "px";

  }else{
    k.style.left =
      (whiteIndex * 28) + "px";

    whiteIndex++;
  }

  kb.appendChild(k);

});

kb.style.width =
  (whiteIndex * 28) + "px";

/* ================= AUTO LOAD ================= */

window.addEventListener("load", () => {

    loadMidiFromUrl("./songs/55.mid","55.mid");

  
  const saved = localStorage.getItem("savedMidi");
  if (!saved) return;
  const obj = JSON.parse(saved);

  const uint = new Uint8Array(obj.data);

  loadMidi(uint.buffer, obj.name);

});

/* ================= COLOR UTIL ================= */
function getNoteColor(note){

  if(note.hand === "left"){
    return "#4aa3ff"; // 青系
  }

  return "#ff4a4a";   // 赤系（右手）
}

/* ================= MIDI URL LOAD ================= */

async function loadMidiFromUrl(url, fileName){

  console.log("読み込み開始");

  const res = await fetch(url);

  console.log("status:", res.status);

  const buf = await res.arrayBuffer();

  console.log("サイズ:", buf.byteLength);

  loadMidi(buf, fileName);

  console.log("MIDI読込成功");
}

/* ================= MIDI LOAD ================= */

function loadMidi(buffer, fileName){
  chordSpawnIndex = {};
  const midi = new Midi(buffer);

  notes = [];
  usedNotes.clear();

  splitNote = songConfig[fileName]?.split ?? 60;

  // ================= MIDI展開 =================
  midi.tracks.forEach(t => {

    t.notes.forEach(n => {

      const midiNum = n.midi;

      notes.push({
        time: n.time,
        note: n.name,
        midi: midiNum,

        // 🎯 左右判定
        hand: midiNum < splitNote ? "left" : "right"
        
      });
      usedNotes.add(n.name);
    });

  });

  // ================= 時間順ソート =================
  notes.sort((a, b) => a.time - b.time);

  // ================= 和音グループ化 =================
  for (let i = 0; i < notes.length; i++) {
  notes[i].chordId = i;
}

  // ================= UI更新 =================
  totalCount = notes.length;
  document.getElementById("totalCount").textContent = totalCount;

  console.log("MIDI OK:", notes.length);
  console.log("splitNote:", splitNote);

  paintKeyboard();

console.log(
  notes.slice(0,30).map(n =>
    `${n.time.toFixed(3)} ${n.note}`
  )
);
}


function paintKeyboard(){

  document
    .querySelectorAll(".key,.black")
    .forEach(key=>{

      const note = key.dataset.note;

      if(usedNotes.has(note)){

        if(key.classList.contains("black")){

          key.style.background = "#222";

        }else{

          key.style.background = "white";

        }

        key.style.opacity = "1";

      }else{

        if(key.classList.contains("black")){

          key.style.background =
            "repeating-linear-gradient(90deg,#7b5a3a 0px,#7b5a3a 4px,#6a4b2d 4px,#6a4b2d 8px)";

        }else{

          key.style.background =
            "repeating-linear-gradient(90deg,#d8b184 0px,#d8b184 4px,#c89b6d 4px,#c89b6d 8px)";

        }

        key.style.opacity = "0.7";

      }

    });

}

/* ================= START ================= */
async function startGame(){
  chordSpawnIndex = {};
  await Tone.start();
  console.log("音声OK");

  if(!analyser){
    await startMic();
  }

  if(!notes.length){
    alert("MIDIを読み込んでね");
    return;
  }

  stopGame();

  score = 0;
  combo = 0;
  update();

  running = true;
  index = 0;

  countdown(3);
}


/* ================= COUNTDOWN ================= */

function countdown(n){

  const judge =
    document.getElementById("judge");

  judge.textContent = n;

  if(n <= 0){
  
    startTime = performance.now();

    judge.textContent = "START!";

   setTimeout(()=>{
    judge.textContent = "";
  },800);

  requestAnimationFrame(loop);

  return;
}

  setTimeout(()=>{
    countdown(n-1);
  },1000);

}

/* ================= STOP ================= */

function stopGame(){

  running = false;

  active.forEach(n=>n.el.remove());

  active = [];

  hitCount = 0;

  document.getElementById("hitCount")
    .textContent = 0;

}

/* ================= SPAWN ================= */

function spawn(n){

  const key = document.querySelector(`[data-note="${n.note}"]`);
  if(!key) return;

  const g = document.getElementById("gameArea").getBoundingClientRect();
  const k = key.getBoundingClientRect();

  const el = document.createElement("div");
  el.className = "note note-spawn";


  setTimeout(() => {
    el.classList.remove("note-spawn");
  }, 250);


  const isBlack = key.classList.contains("black");

  let color;

  if(n.hand === "left"){
    color = isBlack ? "#1f4f7a" : "#4aa3ff";
  }else{
    color = isBlack ? "#7a1f1f" : "#ff4a4a";
  }

  el.style.background = color;

  // 位置
  el.style.left =
    (k.left - g.left + k.width / 2) + "px";

  // テキスト
  const text = document.createElement("div");
  text.className = "note-text";
  text.textContent = noteMap[n.note[0]];
  el.appendChild(text);

  document.getElementById("gameArea").appendChild(el);


  const dropOffset = 0;
active.push({
  el,
  note:n.note,
  hit:n.time,
  chordId:n.chordId,
  hand:n.hand,
  missed:false,
  dropOffset:0
});

}

/* ================= Loop ================= */
function loop() {

  if (!running) return;

  const rawTime =
    (performance.now() - startTime) / 1000 - 3;

  const gameTime = rawTime * speed;

  const PREVIEW_TIME = 0;

  // =========================
  // ノーツ生成
  // =========================
  while (
    index < notes.length &&
    notes[index].time <= gameTime + travelTime + PREVIEW_TIME
  ) {
    spawn(notes[index]);
    index++;
  }

  // =========================
  // ノーツ更新
  // =========================
  active.forEach(n => {

    const visualTime = gameTime - n.dropOffset;

    const p =
      1 - ((n.hit - visualTime) / travelTime);

    const y =
      spawnY + p * (hitY - spawnY);

    n.el.style.top = y + "px";

    const gameHeight = document.getElementById("gameArea").clientHeight;

if (y > gameHeight + 50) {
  n.el.remove();
  active = active.filter(x => x !== n);
  return;
}

    const dist = Math.abs(y - hitY);

    n.el.style.zIndex = Math.floor(1000 - dist);

    // 拡大演出
if (dist < 20) {
  n.el.style.transform = "translateX(-50%) scale(1.8)";
  n.el.style.zIndex = 2000;
} else {
  n.el.style.transform = "translateX(-50%) scale(1)";
}

    // 判定ライン通過後フェード
    const passed = (gameTime > n.hit + 0.05);

    n.el.style.opacity = passed ? "0" : "1";

    // MISS処理
    if (!n.missed && n.hit + 0.15 < gameTime) {
      n.missed = true;
      n.el.remove();
      n.el.style.opacity = "0.3";
    }

  });

  // =========================
  // 終了判定（GOAL）
  // =========================
  if (
    index >= notes.length &&
    active.length === 0
  ) {
    console.log(index, notes.length, active.length);
    console.log("GOAL条件入った");
    running = false;

    showGoal(); // ←ここが演出
    return; 
    setTimeout(() => {
      showResult();
    }, 2500);

    return;
  }

  requestAnimationFrame(loop);
}

function showResult(){
  const judge = document.getElementById("judge");

  judge.textContent = "FINISH!";
  judge.style.color = "gold";
  judge.style.transform = "scale(1.5)";
  judge.style.opacity = "1";

  setTimeout(() => {
    judge.textContent = "";
    judge.style.transform = "scale(1)";
    judge.style.opacity = "0.7";
  }, 2000);
}

/* ================= hitnearest ================= */
function hitNearest(){

  const hitRange = 40;

  let bestDist = 999;

  // 一番近いノーツを探す
  active.forEach(n => {

    const rect = n.el.getBoundingClientRect();
    const game = document.getElementById("gameArea").getBoundingClientRect();

    const y = rect.top - game.top;

    const dist = Math.abs(y - hitY);

    if(dist < bestDist){
      bestDist = dist;
    }

  });

  if(bestDist > hitRange) return;

  let judge = "GOOD";

  if(bestDist < 15){
    judge = "PERFECT";
  }

  // 一番近いノーツと同じタイミングのものを全部消す
  active
    .filter(n => {

      const rect = n.el.getBoundingClientRect();
      const game = document.getElementById("gameArea").getBoundingClientRect();

      const y = rect.top - game.top;

      const dist = Math.abs(y - hitY);

      return Math.abs(dist - bestDist) < 12;

    })
    .forEach(n => success(n));

  showJudge(judge);
}
/* ================= HIT ================= */

function hit(note){

  const t = getTime();

  const JUDGE_WINDOW = 0.6;

  let best = null;
  let bestDiff = 999;

  active.forEach(n=>{

    if(n.note !== note) return;

    const diff = n.hit - t;

    if(diff > JUDGE_WINDOW) return;
    if(diff < -JUDGE_WINDOW) return;

    const absDiff = Math.abs(diff);

    if(absDiff < bestDiff){
      bestDiff = absDiff;
      best = n;
    }

  });

  if(best && bestDiff < 0.30){

  success(best,note);

  score += 300;

  combo++;

  showJudge("PERFECT");

} else if(best && bestDiff < 0.6){

  success(best,note);

  score += 100;

  combo++;

  showJudge("GOOD");

} 

update();

}

/* ================= SUCCESS ================= */

function success(best){

best.el.classList.add("note-suck");

setTimeout(() => {
  best.el.remove();
}, 180);

  active =
    active.filter(n=>n!==best);

  hitCount++;

  document.getElementById("hitCount")
    .textContent = hitCount;

}

  const key = document.elementFromPoint(
    e.touches[0].clientX,
    e.touches[0].clientY
  );

  if(key && key.dataset.note){
    hit(key.dataset.note);
  }

});
