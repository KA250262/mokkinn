<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>メロころ♪</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<script src="https://unpkg.com/meyda/dist/web/meyda.min.js"></script>

<style>

html {
  transform-origin: top left;
}

body{
  margin:0;
  padding:0;
  background: #fff176;
  color:white;
  text-align:center;
  font-family:sans-serif;
  overflow:hidden;
  transition: background-color 0.05s ease, filter 0.05s ease;
}

/* 1拍目に一瞬だけ付与されるクラス */
body.beat-flash {
  background-color: #fff176;
  filter: brightness(1.15) ;
}

body.mobile {
    transform: none !important;
    overflow-x: auto !important;
}
body.mobile #keyboard-top {
    width: max-content;
    position: absolute; 
    top: 0;
}

#gameArea {
  position:relative;
  width: 100%;
  height: 60vh;
  background-image: url("melokoro.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  overflow: hidden;
}

#mascot{
  position:absolute;
  width:100%;
  height:70%;
  left:0;
  top:0;
  object-fit:contain;
  object-position:top;
  pointer-events:none;
  z-index:1;
}


#keyboard-top {
  position: relative;
  margin-top: 40px;
  top: 0;
  left: 0;
  width: 100%;
  height: 240px; /* 💡2行がきれいに収まるように高さを広げました */
  z-index: 10;
}

/* ========================================================
   鍵盤を上から見た普通の2行配置にきっぱり分けるCSS
   ======================================================== */

/* 【2行目・手前】：すべての白鍵を一段下にきっぱり落とす */
#keyboard-top .key {
    position: absolute;
    top: 95px !important;
    width: 28px;
    height: 105px !important;
    background: #fffae8;
    border: 1px solid #333;
    border-radius: 2px 2px 6px 6px;
    /* 💡 z-indexを黒鍵より低く固定 */
    z-index: 50 !important;
    transition: background 0.15s ease, box-shadow 0.15s ease;
    transform-origin: center center !important;
    
    text-align: center;
    font-weight: bold;
    font-size: 10px;
    padding-top: 80px;
    box-sizing: border-box;
    user-select: none;
    cursor: pointer;
}


/* 【1行目・奥】：すべての黒鍵を一番上にぴったり固定 */
#keyboard-top .black {
    position: absolute;
    top: 25px !important;
    width: 26px;
    height: 85px !important;
    background: #222;
    border: 2px solid #fffae8;
    border-radius: 5px 5px 4px 4px;
    /* 💡 z-indexを大きくし、アニメーション中でも手前を維持 */
    z-index: 100 !important; 
    transition: background 0.15s ease, box-shadow 0.15s ease;
    transform-origin: center center !important;
    
    text-align: center;
    font-weight: bold;
    font-size: 11px;
    color: white;
    padding-top: 55px;
    box-sizing: border-box;
    user-select: none;
    cursor: pointer;
}


#ui {
  display: flex;
  gap: 5px;            
  padding: 4px 10px;   
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(6px);
  border-radius: 20px;
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  max-width: 98%;
}

.controls-container {
  display: flex;
  flex-wrap: nowrap;
  align-items: center; 
  gap: 20px;
  white-space: nowrap;
}

/* 曲選択ボタン（花） */
.flowerBtn{
  display: flex;
  align-items: center;
  border:none;
  background:none;
  font-size:36px;
  cursor:pointer;
  transition:0.2s;
  justify-content: center;
  height: 28px;
}

#flowerBar{
  position:absolute;
  top:10px;
  left:100px;
  transform:translateX(-50%);
  display:flex;
  gap:20px;
  z-index:200;
}

#songMenu {
    position: absolute;
    top: 60px; 
    left: 100px;
    background: rgba(0, 0, 0, 0.9); 
    border: 2px solid #ff7ac8;
    border-radius: 10px; 
    z-index: 999; 
    display: none; 
    flex-direction: column; 
    gap: 8px; 
    width: 220px; 
}

.menuSongBtn {
    display: block;
    width: 100%;
    padding: 10px 12px;
    text-align: center;
    background: #ff7ac8;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.menuSongBtn:hover {
    background: #ff3399;
}

/* 既存の #songListRow のスタイルを以下のように書き換える */
#songListRow {
    position: relative; /* absoluteから変更 */
    width: 100%;
    display: flex;
    gap: 5px;
    overflow-x: auto;
    white-space: nowrap;
    padding: 10px;
    background: rgba(255, 255, 255, 0.1); /* 見やすくするための背景 */
    margin-top: 10px;
    box-sizing: border-box;
}

.songBtn {
    /* 普段はコンパクトなボタン */
    width: 30px; 
    height: 30px;
    background: #ff7ac8;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    flex-shrink: 0;
    
    /* 💡 伸び縮みを滑らかにする */
    transition: width 0.2s ease, font-size 0.2s ease;
    overflow: hidden; /* 伸びるまでは文字がはみ出ないように */
}

/* 💡 クリックしている間（またはホバー中）だけ幅を広げてタイトルを出す */
.songBtn:active, 
.songBtn:hover {
    width: 150px; /* 伸ばしたい長さに調整 */
    font-size: 14px;
}




#hitCount, #score-display {
  font-size: 25px;
  color: rgb(12, 46, 2);
}

/* ========================================================
   鍵盤ヒット・ガイド（上の鍵盤・木琴専用スタイル）
   ======================================================== */

/* 鍵盤を自分で直接タップ・マイク入力でヒットした時の光（ネオングリーン） */
.hit {
    background: #7CFF6B !important; 
    box-shadow: inset 0 0 20px rgba(124, 255, 107, 0.8), 0 0 20px #7CFF6B !important;
    transition: background 0.1s ease, box-shadow 0.1s ease !important;
}

/* 自動演奏時のガイド：左手（青） */
.guide-left {
    animation: guideLeft 0.25s ease-out forwards;
    z-index: 25 !important;
}

/* 自動演奏時のガイド：右手（赤） */
.guide-right {
    animation: guideRight 0.25s ease-out forwards;
    z-index: 25 !important;
}

/* 右手ガイド：赤ピンクに光りながら、真ん中を中心に「ぷにっ」と縮む */
@keyframes guideRight {
    0% { 
        transform: scaleY(1); 
        box-shadow: inset 0 0 20px #ff4db8, 0 0 15px #ff4db8;
    }
    50% { 
        transform: scaleY(0.88); 
        box-shadow: inset 0 0 35px #ff4db8, 0 0 25px #ff80d5;
    }
    100% { 
        transform: scaleY(1); 
        box-shadow: inset 0 0 10px #ff4db8;
    }
}

/* 左手ガイド：水色に光りながら、真ん中を中心に「ぷにっ」と縮む */
@keyframes guideLeft {
    0% { 
        transform: scaleY(1); 
        box-shadow: inset 0 0 20px #33cfff, 0 0 15px #33cfff;
    }
    50% { 
        transform: scaleY(0.88); 
        box-shadow: inset 0 0 35px #33cfff, 0 0 25px #8ae8ff;
    }
    100% { 
        transform: scaleY(1); 
        box-shadow: inset 0 0 10px #33cfff;
    }
}



/* ========================================================
   木琴鍵盤から湧き出るノーツ（音符）システム
   ======================================================== */

#notes-layer {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    /* 💡 鍵盤のz-index(最高100)よりも大きく設定 */
    z-index: 200 !important; 
    pointer-events: none;
}

.note {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff8c0, #ffd860);
    border: 1px solid rgba(255,255,255,0.9);
    will-change: transform;
    opacity: 0;
    transform: none;
    transition: opacity 0.15s ease;
    z-index: 201 !important;
}

.note-active {
    opacity: 1;
    transform: none;
}

.note-text {
    position: absolute; 
    top: 50%; 
    left: 50%; 
    transform: translate(-50%, -50%); 
    font-size: 10px; 
    white-space: nowrap; 
    font-weight: 900; 
    color: white; 
    text-shadow: 0 1px 2px rgba(0,0,0,0.7); 
    z-index: 300; 
}

.note-spawn {
    animation: noteSpawn 0.12s ease-out;
}

@keyframes noteSpawn {
    0% {
        opacity: 0;
        transform: scale(0.7);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}

/* #ui 内にスライダー用のスタイルを追加 */
#speed-slider {
    width: 100px;
    vertical-align: middle;
}


.note-hit {
    box-shadow: 0 0 25px 10px rgba(255, 255, 255, 0.9);
    filter: brightness(1.8);
    transition: all 0.15s ease-out;
}

.note-suck {
    animation: suckToLine 0.25s ease-in forwards;
}

@keyframes suckToLine {
    0% {
        transform: scale(1);
        filter: blur(0px);
        opacity: 1;
    }
    100% {
        transform: scale(0.1);
        filter: blur(6px);
        opacity: 0;
    }
}

.note-trail {
    position: absolute;
    height: 8px;
    border-radius: 999px;
    pointer-events: none;
    z-index: 40;
    opacity: 0.5;
    transform-origin: left center;
    filter: blur(3px);
    box-shadow: 0 0 8px currentColor;
}

.note-trail-right {
    background: linear-gradient(90deg, rgba(255,74,74,0.8), rgba(255,74,74,0));
}

.note-trail-left {
    background: linear-gradient(90deg, rgba(74,163,255,0.8), rgba(74,163,255,0));
}

.hand-bar{
  position:absolute;
  height:20px;
  border-radius:10px;
  pointer-events:none;
  z-index:25;
  opacity:1 !important;
  border:2px solid white;
  transition: left 0.08s ease-out, top 0.08s ease-out, opacity 0.1s linear;
}

.left-bar{ background:#7fdfff; z-index: 50; }
.right-bar{ background:#ff9ed6; z-index: 50; }

@keyframes comboBounce {
  0%{ transform:scale(1); }
  30%{ transform:scale(1.03) rotate(-1deg); }
  60%{ transform:scale(1.03) rotate(1deg); }
  100%{ transform:scale(1); }
}

@keyframes bubblePop {
  0%{ transform:translateX(-50%) scale(1); opacity:1; }
  50%{ transform:translateX(-50%) scale(1.3); opacity:1; }
  100%{ transform:translateX(-50%) scale(2.2); opacity:0; }
}

.bubble-out {
  animation: bubblePop 0.12s ease-out forwards;
}

.hit-flash{
  position:absolute;
  left:50%;
  transform:translateX(-100%);
  width:90%;
  height:24px;
  border-radius:20px;
  background: radial-gradient(ellipse, rgba(255,255,255,0.95), rgba(120,220,255,0.7), rgba(120,220,255,0));
  pointer-events:none;
  animation:flashAnim 0.10s ease-out forwards;
  z-index:500;
}

.combo-line {
  position: absolute;
  height: 12px; 
  background: linear-gradient(90deg, transparent 0%, #ffffff 20%, #ffffff 80%, transparent 100%) !important;
  box-shadow: 0 0 12px #ffffff, 0 0 20px #ffffff, 0 0 30px #ff7ac8;
  pointer-events: none;
  z-index: 20;
  opacity: 0.7; 
  transition: opacity 0.05s linear;
}

.chord-surround {
  position: absolute;
  pointer-events: none;
  z-index: 90; 
}

.chord-surround-right { filter: drop-shadow(0 0 8px #ff4a4a) !important; }
.chord-surround-left { filter: drop-shadow(0 0 8px #4aa3ff) !important; }

@keyframes lineFlash {
  0% { opacity: 1; transform: scaleY(1); }
  100% { opacity: 0; transform: scaleY(0); }
}

@keyframes flashFade {
  0% { opacity: 1; }
  100% { opacity: 0; }
}

#score{
  color:gold;
  display:inline-block;
  transition:0.1s;
}

#debug{
  position: fixed;
  right: 10px;
  bottom: 10px;
  background: rgba(0,0,0,0.7);
  padding: 10px;
  font-size: 14px;
  text-align: left;
  border-radius: 8px;
  color: white;
}

#goalOverlay {
  pointer-events: none;
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999999;
  background: rgba(0,0,0,0.2);
}

.goalScene {
  display: flex;
  align-items: center;
  gap: 10px;
}

.bird {
  font-size: 40px;
  transform-origin: center;
  animation: wing 0.4s infinite alternate;
}

.leftBird { transform: scaleX(-1); }
.rightBird { transform: scaleX(1); }

.piano-hand {
  display: none !important;
  position: absolute;
  height: 200px;
  z-index: 30;
  pointer-events: none;
  top: 650px;           
  left: 0px;
  transition: left 0.08s ease-out, top 0.1s ease-out, transform 0.05s ease-out, opacity 0.05s linear;
  opacity: 0;
}

.piano-hand.tap {
  transform: scale(0.88) translateY(-5px);
}

.tape {
  background: gold;
  color: #222;
  font-weight: bold;
  padding: 6px 16px;
  border-radius: 6px;
  letter-spacing: 2px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

@keyframes popIn {
  0%   { transform: scale(0.4); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes float {
  0%   { transform: translateY(0px); }
  50%  { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

@keyframes wing {
  0%   { transform: translateY(0px) rotate(-5deg); }
  100% { transform: translateY(-2px) rotate(5deg); }
}

#lineLayer{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:90;
}

</style>

<script>
let prevRMS = 0;
let baseline = 0;
let prevSpectrum = [];
let latestRMS = 0;
let latestSpectrum = [];
let lastHitDetect = 0;
let usedNotes = new Set();
let score = 0;
let running = false;
let paused = false;
let pauseStart = 0;
let pausedTime = 0;

document.getElementById("play-btn").addEventListener("click", () => { startGame(); });
document.getElementById("stop-btn").onclick = stopGame;
document.getElementById("pause-btn").onclick = pauseGame;

function pauseGame(){
  if (!running) return;
  if (!paused){
    paused = true;
    pauseStart = performance.now();
  } else {
    paused = false;
    pausedTime += performance.now() - pauseStart;
    requestAnimationFrame(loop);
  }
}

async function startMic() {
    try {
        if (!navigator.mediaDevices?.getUserMedia) return false;
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        const analyzer = Meyda.createMeydaAnalyzer({
            audioContext: audioContext,
            source: source,
            bufferSize: 512,
            featureExtractors: ["rms", "amplitudeSpectrum", "spectralCentroid"],
            callback: (features) => {
                const currentRMS = features.rms || 0;
                const spectrum = features.amplitudeSpectrum || [];
                const centroid = features.spectralCentroid || 0;
                latestRMS = currentRMS;
                latestSpectrum = spectrum;
                baseline = baseline * 0.95 + currentRMS * 0.05;
                let flux = 0;
                if (prevSpectrum.length && prevSpectrum.length === spectrum.length) {
                    for (let i = 0; i < spectrum.length; i++) {
                        flux += Math.abs(spectrum[i] - prevSpectrum[i]);
                    }
                }
                const delta = currentRMS - prevRMS;
                const now = performance.now();

                const debug = document.getElementById("debug");
                if (debug) {
                    debug.textContent = "RMS : " + currentRMS.toFixed(3) + " / base : " + baseline.toFixed(3);
                }

                const attackMode = currentRMS > 0.015 && currentRMS > baseline * 2 && (flux > 0.15 || delta > baseline * 1.2);
                if (attackMode && now - lastHitDetect > 300) {
                    hitNearest();
                    lastHitDetect = now;
                }
                prevRMS = currentRMS;
                prevSpectrum = [...spectrum];
            }
        });
        analyzer.start();
        analyser = analyzer;
        return true;
    } catch (e) { return false; }
}

let mic;
let analyser;
const synth = new Tone.PolySynth(Tone.Synth, { oscillator:{ type:"triangle" } }).toDestination();

let notes = [];
let active = [];
let index = 0;
let combo = 0;
let hitCount = 0;
let totalCount = 0;
let whiteIndex = 0;
let splitNote = 60;
let speed = 0.5;
let startTime = 0;

function getTime(){
  const rawTime = (performance.now() - startTime - pausedTime) / 1000 - 3;
  return rawTime * speed;
}

const playButton = document.getElementById('play-btn');
const pauseButton = document.getElementById('pause-btn');
const stopButton = document.getElementById('stop-btn');

function changeButtonColor(activeButton) {
  buttons.forEach(btn => btn.classList.remove('active'));
  if (activeButton) activeButton.classList.add('active');
}

playButton.addEventListener('click', () => { changeButtonColor(playButton); });
pauseButton.addEventListener('click', () => { changeButtonColor(pauseButton); });
stopButton.addEventListener('click', () => { changeButtonColor(null); });

const travelTime = 3.0; 
const keys = ["C1","C#1","D1","D#1","E1","F1","F#1","G1","G#1","A1","A#1", "B1", "C2","C#2","D2","D#2","E2","F2","F#2","G2","G#2","A2","A#2","B2", "C3","C#3","D3","D#3","E3","F3","F#3","G3","G#3","A3","A#3","B3", "C4","C#4","D4","D#4","E4","F4","F#4","G4","G#4","A4","A#4","B4", "C5","C#5","D5","D#5","E5","F5","F#5","G5","G#5","A5","A#5","B5", "C6","C#6","D6","D#6","E6","F6","F#6","G6","G#6","A6","A#6","B6", "C7" ];

renderKeyboard("keyboard-top");

function renderKeyboard(id) {
    const kb = document.getElementById(id);
    if (!kb) return;
    
    kb.querySelectorAll(".key,.black").forEach(e => e.remove());
    const whiteNotes = keys.filter(n => !n.includes("#"));
    const isMobile = window.innerWidth <= 768;
    const whiteWidth = isMobile ? 35 : (window.innerWidth / whiteNotes.length);
    
    let whiteIndex = 0;
    keys.forEach(note => {
        const isBlack = note.includes("#");
        const key = document.createElement("div");
        key.dataset.note = note;
        
        if (isBlack) {
            key.className = "black";
            key.style.left = (whiteIndex * whiteWidth - 11) + "px"; 
        } else {
            key.className = "key";
            key.style.left = (whiteIndex * whiteWidth) + "px";
            key.style.width = whiteWidth + "px";
            whiteIndex++;
        }
        kb.appendChild(key);
    });
    paintKeyboard();
}

let scaleTimer;
function applyScale() {
    if (window.innerWidth <= 768) {
        document.body.classList.add("mobile");
    } else {
        document.body.classList.remove("mobile");
    }
}

function applyScaleDebounced() {
    clearTimeout(scaleTimer);
    scaleTimer = setTimeout(() => {
        applyScale();
        renderKeyboard("keyboard-top");
    }, 100);
}

window.addEventListener("load", () => {
    applyScale();
    initApp();
});
window.addEventListener("resize", applyScaleDebounced);
window.addEventListener("orientationchange", applyScaleDebounced);

function initApp() {
    initSongMenu();
    renderKeyboard("keyboard-top");
    loadInitialMidi().then(() => { console.log("MIDI準備完了"); });
}

function loadInitialMidi() {
    const saved = localStorage.getItem("savedMidi");
    if (saved) {
        try {
            const obj = JSON.parse(saved);
            const uint = new Uint8Array(obj.data);
            loadMidi(uint.buffer, obj.name);
            return Promise.resolve();
        } catch (e) { console.warn("saved MIDI破損:", e); }
    }
    return loadMidiFromUrl("./songs/55.mid", "55.mid");
}

function getNoteColor(note){
  return note.hand === "left" ? "#4aa3ff" : "#ff4a4a";
}

async function loadMidiFromUrl(url, fileName){
  const res = await fetch(url);
  const buf = await res.arrayBuffer();
  loadMidi(buf, fileName);
}

function loadMidi(buffer, fileName){
  chordSpawnIndex = {};
  const midi = new Midi(buffer);
  const keySig = midi.header.keySignatures?.[0];
  const keyFix = { "D#":"Eb", "Eb":"Eb", "C#":"Db", "Db":"Db", "F#":"Gb", "Gb":"Gb", "G#":"Ab", "Ab":"Ab", "A#":"Bb", "Bb":"Bb" };
  window.currentKey = keyFix[keySig?.key] || "C";

  notes = [];
  usedNotes.clear();

  let playableTrackCount = 0;
  midi.tracks.forEach(t => {
    if (t.notes.length === 0) return;
    t.notes.forEach(n => {
      notes.push({
        time: n.time,
        note: n.name,
        midi: n.midi,
        duration: n.duration,
        hand: (playableTrackCount === 0) ? "right" : "left"
      });
      usedNotes.add(n.name);
    });
    playableTrackCount++;
  });

  notes.sort((a, b) => a.time - b.time);

  let currentChordId = 0;
  for (let i = 0; i < notes.length; i++) {
    if (i > 0 && Math.abs(notes[i].time - notes[i - 1].time) > 0.01) {
      currentChordId++;
    }
    notes[i].chordId = currentChordId;
  }
  totalCount = notes.length;
  paintKeyboard();
}

function paintKeyboard(){
  document.querySelectorAll(".key, .black").forEach(key=>{
    if(key.classList.contains("black")){
      key.style.background = "#222";
    } else {
      key.style.background = "#fffae8"; /* ⭐初期色をアイボリーに変更 */
    }
    key.style.opacity = "1";
  });
}

async function startGame() {
  if (!notes || notes.length === 0) return;
  running = false;
  paused = false;
  active.forEach(n => n.el?.remove());
  active = [];
  score = 0;
  combo = 0;
  hitCount = 0;
  totalCount = notes.length;
  update();

  try { await Tone.start(); } catch (e) {}
  if (!analyser) { startMic().catch(e => {}); }

  if (window.innerWidth <= 768) {
    document.body.classList.add("mobile");
  } else {
    document.body.classList.remove("mobile");
  }
  index = 0;
  pausedTime = 0;
  startTime = performance.now();
  running = true;
  countdown(3);
}

function countdown(n){
  const judge = document.getElementById("judge");
  if(n <= 0){
    startTime = performance.now();
    judge.textContent = "START!";
    setTimeout(()=>{
      judge.textContent = "";
      judge.style.opacity = "0";
    }, 800);
    requestAnimationFrame(loop);
    return;
  }
  judge.style.opacity = "1";
  judge.textContent = n;
  setTimeout(()=>{ countdown(n-1); }, 1000);
}

function stopGame(){
  running = false;
  paused = false;
  active.forEach(n => n.el?.remove());
  active = [];
  document.querySelectorAll(".guide-left, .guide-right, .hit").forEach(el => {
    el.classList.remove("guide-left", "guide-right", "hit");
  });
  const scoreDisplay = document.getElementById("score-display");
  if (scoreDisplay) scoreDisplay.textContent = "0 / 0"; 
  document.querySelectorAll(".combo-line, .chord-surround").forEach(e=>e.remove());
  paintKeyboard();
}

function noteToSolfege(noteName){
    const pitch = noteName.replace(/[0-9]/g, "");
    const normalize = {
        "C":"C", "C#":"C#","Db":"C#", "D":"D", "D#":"D#","Eb":"D#", "E":"E","Fb":"E",
        "F":"F","E#":"F", "F#":"F#","Gb":"F#", "G":"G", "G#":"G#","Ab":"G#", "A":"A",
        "A#":"A#","Bb":"A#", "B":"B","Cb":"B"
    };
    const p = normalize[pitch];
    if(!p) return pitch;

    const key = window.currentKey || "C";
    const majorScale = {
        C:  ["C","D","E","F","G","A","B"], G:  ["C","D","E","F#","G","A","B"],
        D:  ["C#","D","E","F#","G","A","B"], A:  ["C#","D","E","F#","G#","A","B"],
        E:  ["C#","D#","E","F#","G#","A","B"], B:  ["C#","D#","E","F#","G#","A#","B"],
        F:  ["C","D","E","F","G","A","A#"], Bb: ["C","D","D#","F","G","A","A#"],
        Eb: ["C","D","D#","F","G","G#","A#"], Ab: ["C","C#","D#","F","G","G#","A#"]
    };
    const solfege = ["ド","レ","ミ","ファ","ソ","ラ","シ"];
    const scale = majorScale[key];
    const idx = scale.indexOf(p);
    if(idx !== -1) return solfege[idx];

    const kana = {
        "C":"ド", "C#":"ド♯", "D":"レ", "D#":"レ♯", "E":"ミ", "F":"ファ",
        "F#":"ファ♯", "G":"ソ", "G#":"ソ♯", "A":"ラ", "A#":"ラ♯", "B":"シ"
    };
    return kana[p] || p;
}

function spawn(n){
  const keyTop = document.querySelector(`#keyboard-top [data-note="${n.note}"]`);
  if(!keyTop) return;

  const isBlack = keyTop.classList.contains("black");
  const el = document.createElement("div");
  el.className = "note note-spawn";

  let color = n.hand === "left" ? (isBlack ? "#1f4f7a" : "#4aa3ff") : (isBlack ? "#7a1f1f" : "#ff4a4a");
  el.style.background = color;

  const text = document.createElement("div");
  text.className = "note-text";
  text.textContent = noteToSolfege(n.note);
  el.appendChild(text);

  el.style.top = (keyTop.offsetTop + (isBlack ? 35 : 70)) + "px";
  el.style.left = (keyTop.offsetLeft + keyTop.offsetWidth / 2 - 15) + "px";
  document.getElementById("notes-layer").appendChild(el);

  const idx = notes.indexOf(n);
  let next = notes.slice(idx + 1).find(x => x.hand === n.hand);
  if(next && next.note === n.note && next.time - n.time < 0.3) return;

  if(next){
    const nextKey = document.querySelector(`#keyboard-top [data-note="${next.note}"]`);
    if(nextKey){
      const x1 = keyTop.offsetLeft + keyTop.offsetWidth / 2;
      const y1 = keyTop.offsetTop + (isBlack ? 35 : 80);
      const x2 = nextKey.offsetLeft + nextKey.offsetWidth / 2;
      const y2 = nextKey.offsetTop + (nextKey.classList.contains("black") ? 35 : 70);
      const dx = x2 - x1; const dy = y2 - y1;
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;

      const beak = document.createElement("div");
      beak.style.position = "absolute"; beak.style.pointerEvents = "none"; beak.style.zIndex = "25";
      beak.style.width = "0"; beak.style.height = "0";
      beak.style.borderTop = "8px solid transparent"; beak.style.borderBottom = "8px solid transparent";
      beak.style.borderRight = n.hand === "left" ? "5px solid rgba(74,163,255,0.7)" : "5px solid rgba(255,74,74,0.7)";
      beak.style.left = (x1 - 12) + "px"; beak.style.top  = (y1 - 8) + "px";
      beak.style.transformOrigin = "right center";
      beak.style.transform = `rotate(${angle}deg)`;
      document.getElementById("notes-layer").appendChild(beak);

      setTimeout(() => { beak.style.transition = "opacity 0.15s"; beak.style.opacity = "0"; }, 80);
      setTimeout(() => { beak.remove(); }, 250);
    }
  }

  active.push({
    el, note: n.note, keyTop, hit: n.time, hand: n.hand, chordId: n.chordId, duration: n.duration,
    missed: false, guideShown: false, guideRemoved: false
  });
}

const leftBar = document.getElementById("leftBar");
const rightBar = document.getElementById("rightBar");
const BAR_WIDTH = 200;
leftBar.style.width = BAR_WIDTH + "px";
rightBar.style.width = BAR_WIDTH + "px";

let last = performance.now();

function loop() {
  if (!running || paused) return;
  const now = performance.now();
  last = now;
  const gameTime = getTime();

  const currentBpm = typeof bpm !== 'undefined' ? bpm : 120; 
  const secondsPerBeat = 60 / currentBpm; 
  const currentBeatIndex = Math.floor(gameTime / secondsPerBeat); 
  
  if (currentBeatIndex % 4 === 0 && gameTime > 0.05) {
    const beatProgress = gameTime % secondsPerBeat;
    if (beatProgress < 0.05 && !window.hasFlashedThisBeat) {
      const bodyEl = document.body;
      bodyEl.classList.add('beat-flash');
      window.hasFlashedThisBeat = true;
      setTimeout(() => { bodyEl.classList.remove('beat-flash'); }, 160);
    }
  }

  if (gameTime % secondsPerBeat >= 0.05) {
    window.hasFlashedThisBeat = false;
  }

  while (index < notes.length && notes[index].time <= gameTime) {
    spawn(notes[index]);
    index++;
  }

  active.forEach(n => {
    if (n.removed) return;

    const isBlack = n.keyTop.classList.contains("black");
   if (isBlack) {
        // 黒鍵ノーツは今まで通り
        n.el.style.top = (n.keyTop.offsetTop + 35) + "px";
    } else {
        // 白鍵ノーツは「-15px」することで上にずらす（数値は調整してください）
        n.el.style.top = (n.keyTop.offsetTop + 80 - 25) + "px"; 
    }
    // ==========================================
    // ⭐ 改定：上の鍵盤（keyTop）をガイド発光・変形させる
    // ==========================================
    if (!n.guideShown && gameTime >= n.hit - 0.15) {
      n.el.classList.add("note-active");
      if (n.hand === "left") {
        n.keyTop?.classList.add("guide-left");
      } else {
        n.keyTop?.classList.add("guide-right");
      }
      n.guideShown = true;
    }

    if (n.guideShown && !n.guideRemoved && gameTime >= n.hit + n.duration){
      n.keyTop?.classList.remove("guide-left", "guide-right");
      n.guideRemoved = true;
    }

    const stayTime = Math.max(n.duration || 0.15, 0.15);
    if (!n.missed && gameTime - n.hit > stayTime) {
      n.missed = true;
      n.keyTop?.classList.remove("guide-left", "guide-right");
      n.el?.remove();
      active = active.filter(x => x !== n);
      return;
    }

    if (gameTime > n.hit - 0.35 && gameTime < n.hit + 0.2) {
      const BAR_WIDTH = 280;
      leftBar.style.width = BAR_WIDTH + "px";
      rightBar.style.width = BAR_WIDTH + "px";
      const handId = n.hand === "left" ? "leftHand" : "rightHand";
      const handEl = document.getElementById(handId);
      const gameRect = document.getElementById("gameArea").getBoundingClientRect();

      let xs = [];
      const chordNotes = active.filter(x => x.chordId === n.chordId && x.hand === n.hand && !x.missed);
      chordNotes.forEach(cn => {
        const r = cn.keyTop?.getBoundingClientRect();
        if (r) {
          const x = (r.left - gameRect.left) + r.width / 2;
          xs.push(x);
        }
      });

      if (xs.length === 0) return;
      const centerX = xs.reduce((sum, v) => sum + v, 0) / xs.length;

      if (handEl) {
        handEl.style.top = "520px";
        handEl.style.opacity = "0.4";
        handEl.classList.add("active");
      }

      if (n.hand === "right") {
        rightBar.style.left = (centerX - BAR_WIDTH / 2) + "px";
        rightBar.style.top = "480px";
        rightBar.style.opacity = "0.7";
        leftBar.style.opacity = "0"; 
      } else if (n.hand === "left") {
        leftBar.style.left = (centerX - BAR_WIDTH / 2) + "px";
        leftBar.style.top = "480px";
        leftBar.style.opacity = "0.7";
        rightBar.style.opacity = "0"; 
      }
    }
  });

  if (index >= notes.length && active.length === 0) {
    running = false;
    showGoal();
    return;
  }
  requestAnimationFrame(loop);
}

function success(best) {
  if (best.done) return; 
  best.done = true;
  const handId = best.hand === "left" ? "leftHand" : "rightHand";
  const handEl = document.getElementById(handId);
  if (handEl) {
    handEl.classList.remove("tap");
    void handEl.offsetWidth;
    handEl.classList.add("tap");
    
    clearTimeout(handEl.timer);
    handEl.timer = setTimeout(() => {
      handEl.classList.remove("tap");
      const now = getTime();
      const hasIncoming = active.some(x => x.hand === best.hand && x.hit - now < 0.4 && !x.missed);
      if (!hasIncoming) {
        handEl.classList.remove("active");
        handEl.style.top = "650px"; 
        handEl.style.opacity = "0";
        handEl.style.transform = "scale(1)";
      }
    }, 150);
  }

  best.el.classList.add("note-suck");
  best.removed = true;

  setTimeout(() => { best.el?.remove(); }, 250);
  active = active.filter(n => n !== best);
  hitCount++;
  update();
}

function hitNearest(){
  const now = getTime();
  const candidates = active.filter(n => n.guideShown && !n.done);
  if(candidates.length === 0) return;

  const best = candidates[0];
  active.filter(n => n.chordId === best.chordId && n.hand === best.hand).forEach(n => {
      // ⭐ 改定：マイクヒット時も上の鍵盤をピカッと輝かせる
      if (n.keyTop) {
          n.keyTop.classList.add("hit");
          setTimeout(() => n.keyTop.classList.remove("hit"), 140);
      }
      success(n);
  });
}

/* ================= ⭐ 改定：TAP用HIT処理 ================= */
function hit(note){
  // ⭐ 下の鍵盤へのクラス付与になっていた箇所を「keyboard-top」へ完全移行
  const key = document.querySelector(`#keyboard-top [data-note="${note}"]`);
  if (key) {
    key.classList.add("hit");
    setTimeout(() => key.classList.remove("hit"), 140);
  }

  const t = getTime();
  const JUDGE_WINDOW = 0.6;
  let best = null;
  let bestDiff = 999;

  active.forEach(n => {
    if (n.note !== note) return;
    const diff = n.hit - t;
    if (Math.abs(diff) > JUDGE_WINDOW) return;
    const absDiff = Math.abs(diff);
    if (absDiff < bestDiff) {
      bestDiff = absDiff;
      best = n;
    }
  });

  if (best) {
    success(best, note);
    score += 300;
    combo++;
  }
  update();
}

function update(){
  const total = (typeof notes !== 'undefined' && notes.length) ? notes.length : 0;
  const scoreDisplay = document.getElementById("score-display");
  if (scoreDisplay) {
    scoreDisplay.textContent = `${hitCount} / ${total}`;
  }
}
