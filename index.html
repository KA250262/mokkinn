<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メロころ♪</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<script src="https://unpkg.com/meyda/dist/web/meyda.min.js"></script>

<style>

body{
  margin:0;
  padding:0;
  background:#111;
  color:white;
  text-align:center;
  font-family:sans-serif;
  overflow:hidden;
}

#gameArea{
  position: relative;
  width: 95vw;
  max-width: 1200px;
  height: 88vh;
  margin:0 auto;
  background:#222;


  border:3px solid #555;
  border-radius:20px;
  overflow:hidden;
}

#keyboard{
  position:absolute;

  left:50%;
  top: 470px;

  display: flex;
  width: 100%;

  transform:translateX(-50%);

  height:180px;

  z-index:3;
}

h1{
  color:#ffb3d9;
  text-shadow:0 0 10px hotpink;
}

#ui{

  position:absolute;

  top:200px;
  left:50%;

  transform:translateX(-50%);

  z-index:100;

  display:flex;

  gap:10px;

  align-items:center;

  background:
    rgba(255,255,255,0.15);

  backdrop-filter: blur(6px);

  padding:10px 16px;

  border-radius:20px;
}

/* 🎯 判定タイミングで自動で光る鍵盤の色 */
.hit {
  background: #ff3399 !important; /* 目立つネオンピンク（お好みで #7CFF6B などの緑系にしてもOK） */
  box-shadow: inset 0 0 15px rgba(255, 51, 153, 0.8), 0 0 15px #ff3399; /* 内側と外側を発光させる */
}

#hitUI{

  position:absolute;

  top:20px;
  right:20px;

  z-index:200;

  font-size:28px;
  font-weight:bold;

  color:white;

  text-shadow:
    0 0 6px black;
}


#lineLayer{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:90;
}


button{
  font-size:18px;
  padding:8px 18px;
  border:none;
  border-radius:10px;
  background:#ff7ac8;
  color:white;
  cursor:pointer;
}

button:hover{
  transform:scale(1.05);
}

#flowerBar{

  position:absolute;

  top:270px;

  left:50%;

  transform:translateX(-50%);

  display:flex;

  gap:20px;

  z-index:150;
}

.flowerBtn{

  border:none;

  background:none;

  font-size:42px;

  cursor:pointer;

  transition:0.2s;
}

.flowerBtn:hover{

  transform:scale(1.15);

}

#songMenu {
    position: absolute;
    top: 340px; /* お花ボタンの下 */
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.9) !important; /* 真っ黒な背景 */
    border: 2px solid #ff7ac8 !important;
    border-radius: 10px !important; /* 丸すぎない角丸 */
    padding: 10px !important;
    z-index: 99999 !important; /* 一番手前に出す */
    
    /* 最初は非表示。表示する時はJavaScriptで flex にします */
    display: none; 
    flex-direction: column !important; /* 必ず縦並び */
    gap: 8px !important; /* ボタン同士の隙間 */
    
    /* 横幅と縦幅をドットや線にさせない設定 */
    width: 220px !important; 
    height: auto !important; 
}

/* メニュー内の曲選択ボタン */
.menuSongBtn {
    display: block !important; /* 確実に表示 */
    visibility: visible !important;
    width: 100% !important; /* メニューの横幅いっぱいに広げる */
    height: auto !important;
    background: #ff7ac8 !important; /* 可愛いピンク */
    color: white !important; /* 白文字 */
    border: none !important;
    padding: 10px 12px !important;
    border-radius: 6px !important;
    font-size: 15px !important;
    font-weight: bold !important;
    cursor: pointer !important;
    white-space: nowrap !important; /* 改行しない */
    text-align: center !important;
    box-shadow: none !important;
}

.menuSongBtn:hover {
    background: #ff3399 !important; /* ホバーで濃いピンク */
}
#score{
  color:gold;
  display:inline-block;
  transition:0.1s;
}

#combo{
  color:lime;
  display:inline-block;
  transition:0.1s;
}

#judge{
  height:40px;
  font-size:32px;
  font-weight:bold;
  margin:5px;
}

.combo-bounce{
  animation: comboBounce 0.5s ease;
}
.guide{
  box-shadow: 0 0 8px rgba(120,220,255,0.5);
  opacity: 0.6;
}


.flower{
  width:48px;
  height:48px;

  border:none;
  background:none;

  font-size:32px;

  cursor:pointer;

  transition:0.2s;
}

.flower:hover{
  transform:scale(1.2) rotate(10deg);
}

.flower1{ filter:hue-rotate(0deg); }
.flower2{ filter:hue-rotate(40deg); }
.flower3{ filter:hue-rotate(80deg); }
.flower4{ filter:hue-rotate(120deg); }
.flower5{ filter:hue-rotate(180deg); }
.flower6{ filter:hue-rotate(240deg); }
.flower7{ filter:hue-rotate(300deg); }


#mascot{

  position:absolute;

  width:100%;
  height:70%;

  left:0;
  top:0;

  object-fit:contain;

  object-position:top;

  pointer-events:none;

  z-index:1;
}
/* 判定ライン */
/* ノーツ */
.note{
  position:absolute;
  width:46px; height:46px;
  /* 🎯 transformのアニメーションを削除し、scale(1)（等倍）を固定にする */
  transition: opacity 0.1s linear; /* 不透明度のアニメーションだけ残す */
  border-radius:40%;
  background:linear-gradient(135deg, #7ad8ff, #3aa6ff );
  border:2px solid rgba(255,255,255,0.85);
  opacity:0.92;
  /* 🎯 ここから transform の記述を完全に削除する */
  z-index:100;
  margin-left: -8px !important;
}

.note-hit {
  box-shadow: 0 0 25px 10px rgba(255, 255, 255, 0.9);
  filter: brightness(1.8);
  transition: all 0.15s ease-out;
}


/* 修正前：translateY(20px) や横方向のズレを無くし、その場で綺麗に消す */
@keyframes suckToLine {
  0% {
    transform: scale(1);
    opacity: 1;
  }
  100% {
    transform: scale(0.6);
    opacity: 0;
  }
}


.note-suck {
  animation: suckToLine 0.18s ease-in forwards;
  pointer-events: none;
}

.note-text{
  position:absolute; 
  top:50%; 
  left:50%; 
  transform:translate(-50%, -50%); 
  font-size:14px; /* 🎯 3文字でも収まるように少し小さく(14px〜15px) */
  white-space: nowrap; /* 🎯 絶対に自動改行（縦書き）させない魔法のプロパティ */
  font-weight:900; 
  color:white; 
  text-shadow: 0 1px 2px rgba(0,0,0,0.7); 
  z-index:101; 
}

@keyframes comboBounce {

  0%{
    transform:scale(1);
  }

  30%{
    transform:scale(1.03) rotate(-1deg);
  }

  60%{
    transform:scale(1.03) rotate(1deg);
  }

  100%{
    transform:scale(1);
  }

}

@keyframes bubblePop {

  0%{
    transform:translateX(-50%) scale(1);
    opacity:1;
  }

  50%{
    transform:translateX(-50%) scale(1.3);
    opacity:1;
  }

  100%{
    transform:translateX(-50%) scale(2.2);
    opacity:0;
  }

}

.bubble-out {
  animation: bubblePop 0.12s ease-out forwards;
}

.key {
  position: absolute;
  flex: 1;
  min-width: 12px;
  top:30px;
  width: 28px;
  height: 105px; /* 🎯 白鍵の縦幅を少し短く（120px から 105px に変更） */
  margin-top: 25px; /* 🎯 上側に25pxの隙間を作って、短く見せる */
  background: white;
  border: 1px solid #333;
  /* 🎯 白鍵の角の調整：上側を少しだけ丸く（2px）、下側をしっかり丸く（6px） */
  border-radius: 2px 2px 6px 6px; 
  transition: background 0.1s ease, box-shadow 0.1s ease;
}

.black {
  position: absolute;
  width: 22px;
  top:43px;
  height: 70px; /* 🎯 黒鍵の縦幅を少し伸ばして存在感を出す */
  margin-top: 0; /* 🎯 隙間なく一番上から配置することで、白鍵より上に飛び出させる */
  background: #222;
  border: 2px solid white;
  /* 🎯 黒鍵の角の調整：上側の角も下側と同じように丸っこく（5px）変更 */
  border-radius: 5px 5px 4px 4px; 
  z-index: 20;
  transition: background 0.1s ease, box-shadow 0.1s ease;
}



.hit{
  background:#7CFF6B !important;
}

.hit-flash{
  position:absolute;
  left:50%;
  transform:translateX(-100%);

  width:90%;
  height:24px;

  border-radius:20px;

  background:
    radial-gradient(
      ellipse,
      rgba(255,255,255,0.95),
      rgba(120,220,255,0.7),
      rgba(120,220,255,0)
    );

  pointer-events:none;

  animation:flashAnim 0.10s ease-out forwards;

  z-index:40;
}

/* 🎯 白鍵が光る色：鮮やかな緑（ライム）＋消える時のフワッとした余韻を追加 */
.hit {
  background: #ffffff !important;
  box-shadow: inset 0 0 15px rgba(51, 255, 51, 0.8), 0 0 15px #33ff33;
  /* 🎯 transition を追加して、クラスが外れた時に0.35秒かけてフワッと元の色に戻す */
  transition: background 0.35s cubic-bezier(0.1, 0.8, 0.3, 1), box-shadow 0.35s cubic-bezier(0.1, 0.8, 0.3, 1) !important;
}

/* 🎯 黒鍵が光る色：パキッとした黄色（ネオンイエロー）＋消える時のフワッとした余韻を追加 */
.hit-black {
  background: #ffff00 !important;
  box-shadow: inset 0 0 15px rgba(255, 255, 0, 0.8), 0 0 15px #ffff00;
  /* 🎯 同様に0.35秒のフワッとした余韻を追加 */
  transition: background 0.35s cubic-bezier(0.1, 0.8, 0.3, 1), box-shadow 0.35s cubic-bezier(0.1, 0.8, 0.3, 1) !important;
}




/* 🎯 同時押しノーツを繋ぐ光の線（両手同時のみ・薄め版） */
.combo-line {
  position: absolute;
  height: 3px; /* 少し細くしてシャープに */
  background: linear-gradient(90deg, transparent 0%, #ffffff 20%, #ffffff 80%, transparent 100%) !important;
  box-shadow: 0 0 6px #ffffff, 0 0 10px #ff7ac8; /* 光の広がり（ボカシ）を半分くらいに縮小 */
  pointer-events: none;
  z-index: 9999 !important;
  opacity: 0.55; /* 🌟 濃ゆすぎたので、全体の不透明度を 55% まで薄く設定 */
  transition: opacity 0.05s linear;
}

/* 🎯 和音ノーツを片手ずつぐるっと囲むエフェクト */
.chord-surround {
  position: absolute;
  pointer-events: none;
  z-index: 90; /* ノーツ(100)より下、同時押し線(9999)より下 */
  /* 基本的にSVGとして描画されます */
}

/* 右手和音（赤）の囲み */
.chord-surround-right {
  filter: drop-shadow(0 0 8px #ff4a4a) !important;
}

/* 左手和音（青）の囲み */
.chord-surround-left {
  filter: drop-shadow(0 0 8px #4aa3ff) !important;
}

@keyframes lineFlash {
  0% { opacity: 1; transform: scaleY(1); }
  100% { opacity: 0; transform: scaleY(0); }
}



@keyframes flashFade {
  0% {
    opacity: 1;
  }

  100% {
    opacity: 0;
  }
}



/* 修正前：translateY(-10px) などが入っていたのを、位置を動かさないように修正 */
.note-spawn {
  animation: noteSpawn 0.1s ease-out; /* 時間も少し短くしてキレを良く */
}

@keyframes noteSpawn {
  0%   { opacity: 0; }
  100% { opacity: 1; }
}


#debug{
  position: fixed;
  right: 10px;
  bottom: 10px;
  background: rgba(0,0,0,0.7);
  padding: 10px;
  font-size: 14px;
  text-align: left;
  border-radius: 8px;
  color: white;
   
}
/* 画面全体オーバーレイ */
#goalOverlay {
  pointer-events: none;
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999999;
  background: rgba(0,0,0,0.2);
}

/* シーン全体 */
.goalScene {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* 小鳥 */
.bird {
  font-size: 40px;
  transform-origin: center;
  animation: wing 0.4s infinite alternate;
}

/* 左右でちょいズレ */
.leftBird {
  transform: scaleX(-1); /* 右向き（内側） */
}

.rightBird {
  transform: scaleX(1);  /* 左向き（内側） */
}
/* 手のイラストの共通スタイル */
.piano-hand {
  position: absolute;
  height: 100px; /* 手のサイズ（鍵盤の大きさに合わせて調整してください） */
  z-index: 50;   /* 鍵盤より手前、ノーツより後ろ、または最前面(102)などお好みで */
  pointer-events: none; /* クリックを邪魔しないようにする */
  
  /* 初期位置は画面の下に隠しておく */
  top: 650px; 
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  
  /* 移動を滑らかにする魔法のプロパティ */
  transition: left 0.1s ease-out, top 0.1s ease-out, transform 0.05s ease-out;
  opacity: 0; /* 最初は透明 */
}

/* アクティブ（弾いているとき）に表示するクラス */
.piano-hand.active {
  opacity: 1;
}

/* 鍵盤を「叩いた瞬間」のバウンスエフェクト */
.piano-hand.tap {
  transform: translateX(-50%) scale(0.85); /* 瞬間的に少しキュッと小さくして叩いた感を出す */
}


/* GOALテープ */
.tape {
  background: gold;
  color: #222;
  font-weight: bold;
  padding: 6px 16px;
  border-radius: 6px;
  letter-spacing: 2px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

/* 登場 */
@keyframes popIn {
  0%   { transform: scale(0.4); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* フワフワ浮遊 */
@keyframes float {
  0%   { transform: translateY(0px); }
  50%  { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

/* 羽ばたき */
@keyframes wing {
  0%   { transform: translateY(0px) rotate(-5deg); }
  100% { transform: translateY(-2px) rotate(5deg); }
  
}
</style>

 <button onclick="setSpeed('slow')">ゆっくり</button>

  </div>

<script>

/* ===== グローバル（ここが全部の土台）===== */
let prevRMS = 0;
let baseline = 0;
let prevSpectrum = [];
let latestRMS = 0;
let latestSpectrum = [];
let lastHitDetect = 0;
let usedNotes = new Set();
let score = 0;


async function startMic() {

  const stream =
    await navigator.mediaDevices.getUserMedia({
      audio: true
    });

  const audioContext =
    new AudioContext();

  const source =
    audioContext.createMediaStreamSource(
      stream
    );

  const analyzer =
    Meyda.createMeydaAnalyzer({
      audioContext: audioContext,
      source: source,
      bufferSize: 512,
      featureExtractors: [
        "rms",
        "amplitudeSpectrum",
        "spectralCentroid"
      ],

      callback: (features) => {

        const currentRMS =
          features.rms || 0;

        const spectrum =
          features.amplitudeSpectrum || [];

        const centroid =
          features.spectralCentroid || 0;

        latestRMS = currentRMS;
        latestSpectrum = spectrum;

        /* ================= baseline ================= */

        baseline =
          baseline * 0.95 +
          currentRMS * 0.05;

        /* ================= flux ================= */

        let flux = 0;

        if(
          prevSpectrum.length &&
          prevSpectrum.length === spectrum.length
        ){

          for(let i = 0; i < spectrum.length; i++){

            flux += Math.abs(
              spectrum[i] - prevSpectrum[i]
            );

          }

        }

        /* ================= delta ================= */

        const delta =
          currentRMS - prevRMS;

        const now =
          performance.now();

        /* ================= DEBUG ================= */

        const debug =
          document.getElementById("debug");

        if(debug){

          debug.textContent =

            "RMS : "
            + currentRMS.toFixed(3)

            + " / Δ : "
            + delta.toFixed(3)

            + " / base : "
            + baseline.toFixed(3)

            + " / flux : "
            + flux.toFixed(3)

            + " / centroid : "
            + centroid.toFixed(0);

        }

        /* ================= HIT DETECT ================= */

        const attackMode =
          currentRMS > 0.015 &&
          currentRMS > baseline * 2 &&
          (
            flux > 0.15 ||
            delta > baseline * 1.2
          );
        if(
          attackMode &&
          now - lastHitDetect > 300
        ){
          console.log("押された！");
          hitNearest();
          lastHitDetect = now;
        }

        /* ================= SAVE ================= */

        prevRMS = currentRMS;

        prevSpectrum = [...spectrum];

      }

    });

  analyser = analyzer;

  analyser.start();

} // startMic end
/* ================= AUDIO （音）================= */
let mic;
let analyser;

const synth = new Tone.PolySynth(
  Tone.Synth,
  {
    oscillator:{
      type:"triangle"
    }
  }
).toDestination();


/* ================= STATE （ゲーム状態）================= */

let notes = [];
let active = [];
let index = 0;
let running = false;

let combo = 0;

let hitCount = 0;
let totalCount = 0;

let whiteIndex = 0;

let splitNote = 60;
let speed = 0.5;

/* ================= TIMING （時間）=================== */

let startTime = 0;

function getTime(){

  const rawTime =
    (performance.now() - startTime)
    / 1000
    - 3;
  return rawTime * speed;
}


/* ================= CONFIG （設定）================= */
const travelTime = 1.2;
const hitY = 470;
const spawnY = -40;
const SPEED_MAP = {slow: 0.4, normal: 0.6, fast: 0.8 };
const gameArea = document.getElementById("gameArea");

// 🔑 エラーの原因だった数式はここから完全に削除し、安全に初期化します
let gameWidth = gameArea.clientWidth; 
let keyWidth = 0; 

/* ================= KEYBOARD ================= */
// 🔑 省略なしの正しい鍵盤配列リストです。このまま貼り付けてください
const keys = ["C1","C#1","D1","D#1","E1","F1","F#1","G1","G#1","A1","A#1", "B1", "C2","C#2","D2","D#2","E2","F2","F#2","G2","G#2","A2","A#2","B2", "C3","C#3","D3","D#3","E2","F3","F#3","G3","G#3","A3","A#3","B3", "C4","C#4","D4","D#4","E4","F4","F#4","G4","G#4","A4","A#4","B4", "C5","C#5","D5","D#5","E5","F5","F#5","G5","G#5","A5","A#5","B5", "C6","C#6","D6","D#6","E6","F6","F#6","G6","G#6","A6","A#6","B6", "C7" ];

// 🔑 keysが定義された「直後」なので、ここで安全に計算させます
keyWidth = gameWidth / keys.length; 

const kb = document.getElementById("keyboard");
kb.innerHTML = "";
keys.forEach(n=>{
    const k = document.createElement("div");
    k.dataset.note = n;
    const isBlack = n.includes("#");
    k.className = isBlack ? "black" : "key";
    if(isBlack){
        k.style.left = (whiteIndex * 28 - 9) + "px";
    }else{
        k.style.left = (whiteIndex * 28) + "px";
        whiteIndex++;
    }
    kb.appendChild(k);
});

kb.style.width =
  (whiteIndex * 28) + "px";

/* ================= AUTO LOAD ================= */

window.addEventListener("load", () => {

    loadMidiFromUrl("./songs/55.mid","55.mid");

  
  const saved = localStorage.getItem("savedMidi");
  if (!saved) return;
  const obj = JSON.parse(saved);

  const uint = new Uint8Array(obj.data);

  loadMidi(uint.buffer, obj.name);

});

/* ================= COLOR UTIL ================= */

/* ================= MIDI LOAD ================= */

function loadMidi(buffer, fileName){
  chordSpawnIndex = {};
  const midi = new Midi(buffer);

  const keySig = midi.header.keySignatures?.[0];
window.currentKey = keySig?.key || "C";
const keyFix = {
  "D#":"Eb",
  "Eb":"Eb",
  "C#":"Db",
  "Db":"Db",
  "F#":"Gb",
  "Gb":"Gb",
  "G#":"Ab",
  "Ab":"Ab",
  "A#":"Bb",
  "Bb":"Bb"
};

window.currentKey = keyFix[keySig?.key] || "C";
console.log("調性:", window.currentKey);

console.log(midi.header);
console.log("KeySignatures:", midi.header.keySignatures);
console.log(
  JSON.stringify(midi.header.keySignatures, null, 2)
); 

notes = [];
  usedNotes.clear();


// ================= MIDI展開 =================
let playableTrackCount = 0; // 音符のあるトラックを数えるカウンター

midi.tracks.forEach(t => {
  if (t.notes.length === 0) return; // 音データがないトラックは無視

  t.notes.forEach(n => {
    notes.push({
      time: n.time,
      note: n.name,
      midi: n.midi,
      // 最初の音符入りトラックなら右手(right)、それ以外(2番目以降)なら左手(left)
      hand: (playableTrackCount === 0) ? "right" : "left"
    });
    usedNotes.add(n.name);
  });

  playableTrackCount++; // 次の音符入りトラックへ
});


  // ================= 時間順ソート =================
  notes.sort((a, b) => a.time - b.time);

// ================= 和音グループ化 =================
// 🎯 同じ時間のノーツには同じchordIdを割り振って、システムに同時押しだと認識させる
let currentChordId = 0;
for (let i = 0; i < notes.length; i++) {
  if (i > 0 && Math.abs(notes[i].time - notes[i - 1].time) > 0.01) {
    currentChordId++;
  }
  notes[i].chordId = currentChordId;
}

  // ================= UI更新 =================
  totalCount = notes.length;
  document.getElementById("totalCount").textContent = totalCount;

  console.log("MIDI OK:", notes.length);
  console.log("splitNote:", splitNote);

  paintKeyboard();


}


function paintKeyboard(){
  document
    .querySelectorAll(".key,.black")
    .forEach(key=>{
      if(key.classList.contains("black")){
        // 🎯 黒鍵は一律で「すべて黒」にする
        key.style.background = "#222";
        key.style.opacity = "1";
      }else{
        // 🎯 白鍵は一律で「すべて木目調」にする（使われていない鍵盤に割り当てられていた綺麗な木目グラデーションです）
        key.style.background = "repeating-linear-gradient(90deg,#d8b184 0px,#d8b184 4px,#c89b6d 4px,#c89b6d 8px)";
        key.style.opacity = "1"; // 不透明度を1にしてクッキリ表示
      }
    });
}

function noteToSolfege(noteName){
    // ① オクターブ除去
    const pitch = noteName.replace(/[0-9]/g, "");

    // ② 異名同音を統一
    const normalize = {
        "C":"C",
        "C#":"C#","Db":"C#",
        "D":"D",
        "D#":"D#","Eb":"D#",
        "E":"E","Fb":"E",
        "F":"F","E#":"F",
        "F#":"F#","Gb":"F#",
        "G":"G",
        "G#":"G#","Ab":"G#",
        "A":"A",
        "A#":"A#","Bb":"A#",
        "B":"B","Cb":"B"
    };

    const p = normalize[pitch];
    if(!p) return pitch;

    // ③ 調性（メジャー）
    const key = window.currentKey || "C";

    const majorScale = {
        C:  ["C","D","E","F","G","A","B"],
        G:  ["C","D","E","F#","G","A","B"],
        D:  ["C#","D","E","F#","G","A","B"],
        A:  ["C#","D","E","F#","G#","A","B"],
        E:  ["C#","D#","E","F#","G#","A","B"],
        B:  ["C#","D#","E","F#","G#","A#","B"],
        F:  ["C","D","E","F","G","A","A#"],
        Bb: ["C","D","D#","F","G","A","A#"],
        Eb: ["C","D","D#","F","G","G#","A#"],
        Ab: ["C","C#","D#","F","G","G#","A#"]
    };

    const solfege = ["ド","レ","ミ","ファ","ソ","ラ","シ"];

    const scale = majorScale[key];

    // ④ スケール内 → ドレミ
    const idx = scale.indexOf(p);
    if(idx !== -1){
        return solfege[idx];
    }

    // ⑤ スケール外 → カタカナ臨時音
    const kana = {
        "C":"ド",
        "C#":"ド♯",
        "D":"レ",
        "D#":"レ♯",
        "E":"ミ",
        "F":"ファ",
        "F#":"ファ♯",
        "G":"ソ",
        "G#":"ソ♯",
        "A":"ラ",
        "A#":"ラ♯",
        "B":"シ"
    };

    return kana[p] || p;
}

    color = isBlack ? "#1f4f7a" : "#4aa3ff";
  }else{
    color = isBlack ? "#7a1f1f" : "#ff4a4a";
  }

el.style.background = color;



  // 🌟【修正】ノーツと鍵盤のズレをなくすため、xOffset（左右のズレ補正）を完全に0にする
  let xOffset = 0;

// 🌟【修正版】ブラウザの画面全体のズレ（スクロールや外枠の余白）の影響をなくす計算
const gameRect = g; // gameArea の座標
const keyRect = k;  // ターゲット鍵盤の座標

// gameArea の左端を基準にして、鍵盤の真ん中の位置を正確に割り出す
const exactX = (keyRect.left - gameRect.left) + (keyRect.width / 2);

// 補正なし（xOffset=0）で正確に代入
el.style.left = exactX + "px";





  // テキスト
  const text = document.createElement("div");
  text.className = "note-text";
  text.textContent = noteToSolfege(n.note);

  el.appendChild(text);

  const dropOffset = 0;
active.push({

  note:n.note,
  hit:n.time,
  chordId:n.chordId,
  hand:n.hand,
  missed:false,
  dropOffset:0
});

}


function loop() {
  if (!running) return;
  const rawTime = (performance.now() - startTime) / 1000 - 3;
  const gameTime = rawTime * speed;
  const PREVIEW_TIME = 0;

  // ==========================================
  // ① ノーツ生成
  // ==========================================
  while (index < notes.length && notes[index].time <= gameTime + travelTime + PREVIEW_TIME) {
    spawn(notes[index]);
    index++;
  }

  // ==========================================
  // ② ノーツ更新＆同時押し線ロジック
  // ==========================================
  active.forEach(n => {
    const visualTime = gameTime - n.dropOffset;
    const p = 1 - ((n.hit - visualTime) / travelTime);
    const y = spawnY + p * (hitY - spawnY);
    n.el.style.top = y + "px";
    
    const gameHeight = document.getElementById("gameArea").clientHeight;
    if (y > gameHeight + 50) {
      n.el.remove();
      const line = document.querySelector(`.combo-line[data-chord-id="${n.chordId}"]`);
      if (line) line.remove();
      const cid = `${n.chordId}-${n.hand}`;
      const surround = document.querySelector(`.chord-surround[data-chord-group="${cid}"]`);
      if (surround) surround.remove();
      active = active.filter(x => x !== n);
      return;
    }

    const dist = Math.abs(y - hitY);
    n.el.style.zIndex = Math.floor(1000 - dist);

    if (gameTime > n.hit) {
      // ーーー 判定タイミングを過ぎた後（フェードアウト） ーーー
      const timePast = gameTime - n.hit;
      const fadeDuration = 0.10;
      const opacity = Math.max(0, 1 - (timePast / fadeDuration));
      n.el.style.transform = `scale(1)`;
      n.el.style.opacity = opacity;
      
      const line = document.querySelector(`.combo-line[data-chord-id="${n.chordId}"]`);
      if (line) line.style.opacity = opacity * 0.55;
      
      const cid = `${n.chordId}-${n.hand}`;
      const surround = document.querySelector(`.chord-surround[data-chord-group="${cid}"]`);
      if (surround) {
        surround.style.opacity = opacity;
        if (opacity <= 0) surround.remove();
      }
    } else {
      // ーーー 判定位置に近づく前（降下中） ーーー
      n.el.style.transform = `scale(1)`;
      n.el.style.opacity = "1";

      // ✨【追加】ジャストタイミングの約0.25秒前に手を鍵盤位置へ移動させる
      if (n.hit - gameTime < 0.25 && n.hit - gameTime > -0.1 && !n.missed) {
        const targetKey = document.querySelector(`#keyboard [data-note="${n.note}"]`);
        if (targetKey) {
          const gameRect = document.getElementById("gameArea").getBoundingClientRect();
          const keyRect = targetKey.getBoundingClientRect();
          const exactX = (keyRect.left - gameRect.left) + (keyRect.width / 2);
          
          const handId = n.hand === "left" ? "leftHand" : "rightHand";
          const handEl = document.getElementById(handId);
          if (handEl) {
            handEl.classList.add("active");
            handEl.style.left = exactX + "px";
            handEl.style.top = "475px"; // 鍵盤の下あたり
          }
        }
      }

      // 🌟 両手同時押し線を画面の中央付近から出現させる
      if (dist < 220 && !n.isLineDrawn) {
        const partner = active.find(other => other !== n && other.chordId === n.chordId && other.hand !== n.hand);
        if (partner && !partner.isLineDrawn) {
          n.isLineDrawn = true;
          partner.isLineDrawn = true;
          const gameRect = document.getElementById("gameArea").getBoundingClientRect();
          const rect1 = n.el.getBoundingClientRect();
          const rect2 = partner.el.getBoundingClientRect();
          const x1 = rect1.left - gameRect.left + (rect1.width / 2);
          const x2 = rect2.left - gameRect.left + (rect2.width / 2);
          const leftX = Math.min(x1, x2);
          const lineWidth = Math.abs(x1 - x2);
          const lineEl = document.createElement("div");
          lineEl.className = "combo-line";
          lineEl.style.left = leftX + "px";
          lineEl.style.width = lineWidth + "px";
          lineEl.dataset.chordId = n.chordId;
          document.getElementById("gameArea").appendChild(lineEl);
        }
      }

      // 🌟 生成された線をノーツの降下に完全に同期させる
      const existingLine = document.querySelector(`.combo-line[data-chord-id="${n.chordId}"]`);
      if (existingLine) {
        const gameRect = document.getElementById("gameArea").getBoundingClientRect();
        const rect1 = n.el.getBoundingClientRect();
        const currentY = rect1.top - gameRect.top + (rect1.height / 2);
        existingLine.style.top = currentY + "px";
        if (dist < 25) {
          existingLine.style.opacity = (dist / 25) * 0.55;
        } else {
          existingLine.style.opacity = "0.55";
        }
      }

      // ③ ジャストの瞬間（鍵盤が光る処理：dist < 25）
      if (dist < 25 && !n.isKeyFlashed) {
        n.isKeyFlashed = true;
        const targetKey = document.querySelector(`#keyboard [data-note="${n.note}"]`);
        if (targetKey) {
          const isBlackKey = targetKey.classList.contains("black");
          const flashClass = isBlackKey ? "hit-black" : "hit";
          targetKey.classList.add(flashClass);
          setTimeout(() => {
            targetKey.classList.remove(flashClass);
          }, 150);
        }
      }
    }

    // MISS処理
    if (!n.missed && n.hit + 0.15 < gameTime) {
      n.missed = true;
      const line = document.querySelector(`.combo-line[data-chord-id="${n.chordId}"]`);
      if (line) line.remove();
      const cid = `${n.chordId}-${n.hand}`;
      const surround = document.querySelector(`.chord-surround[data-chord-group="${cid}"]`);
      if (surround) surround.remove();
      n.el.remove();
    }
  });

  // ==========================================
  // ③ 和音の囲み（サークリング）ロジック
  // ==========================================
  const chords = {};
  active.forEach(n => {
    if (gameTime > n.hit) return;
    const hand = n.hand;
    const cid = `${n.chordId}-${hand}`;
    if (!chords[cid]) chords[cid] = [];
    chords[cid].push(n);
  });

  Object.keys(chords).forEach(cid => {
    const notesInChord = chords[cid];
    if (notesInChord.length < 2) {
      const existingSurround = document.querySelector(`.chord-surround[data-chord-group="${cid}"]`);
      if (existingSurround) existingSurround.remove();
      return;
    }
    const hand = notesInChord[0].hand;
    const handClass = hand === "right" ? "chord-surround-right" : "chord-surround-left";
    const handColor = hand === "right" ? "#ff4a4a" : "#4aa3ff";
    let surroundEl = document.querySelector(`.chord-surround[data-chord-group="${cid}"]`);
    if (!surroundEl) {
      surroundEl = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      surroundEl.classList.add("chord-surround", handClass);
      surroundEl.dataset.chordGroup = cid;
      surroundEl.style.transition = "opacity 0.05s linear";
      const pathEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pathEl.style.fill = `${handColor}20`;
      pathEl.style.stroke = handColor;
      pathEl.style.strokeWidth = "3px";
      pathEl.style.strokeLinecap = "round";
      surroundEl.appendChild(pathEl);
      document.getElementById("gameArea").appendChild(surroundEl);
    }
    const gRect = document.getElementById("gameArea").getBoundingClientRect();
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    notesInChord.forEach(n => {
      const r = n.el.getBoundingClientRect();
      minX = Math.min(minX, r.left);
      minY = Math.min(minY, r.top);
      maxX = Math.max(maxX, r.right);
      maxY = Math.max(maxY, r.bottom);
    });
    const padding = 15;
    minX -= (padding + gRect.left);
    minY -= (padding + gRect.top);
    maxX += (padding - gRect.left);
    maxY += (padding - gRect.top);
    surroundEl.setAttribute("width", (maxX - minX));
    surroundEl.setAttribute("height", (maxY - minY));
    surroundEl.style.left = minX + "px";
    surroundEl.style.top = minY + "px";
    const pathEl = surroundEl.querySelector("path");
    const cx = (maxX - minX) / 2;
    const cy = (maxY - minY) / 2;
    const rx = (maxX - minX) / 2;
    const ry = (maxY - minY) / 2;
    pathEl.setAttribute("d", `M ${cx}, ${cy} m ${-rx}, 0 a ${rx},${ry} 0 1,0 ${rx*2},0 a ${rx},${ry} 0 1,0 ${-rx*2},0`);
  });

  document.querySelectorAll(".chord-surround").forEach(surround => {
    const cid = surround.dataset.chordGroup;
    if (!chords[cid]) {
      if (surround.style.opacity === "" || parseFloat(surround.style.opacity) > 0) {
        // フェードアウト中
      } else {
        surround.remove();
      }
    }
  });

  // ==========================================
  // ④ 終了判定（GOAL）
  // ==========================================
  if (index >= notes.length && active.length === 0) {
    document.querySelectorAll(".combo-line").forEach(l => l.remove());
    document.querySelectorAll(".chord-surround").forEach(s => s.remove());
    running = false;
    showGoal();
    return;
  }
  requestAnimationFrame(loop);
}

/* ================= hitnearest ================= */
function hitNearest(){

  const hitRange = 40;

  let bestDist = 999;

  // 一番近いノーツを探す
  active.forEach(n => {

    const rect = n.el.getBoundingClientRect();
    const game = document.getElementById("gameArea").getBoundingClientRect();

    const y = rect.top - game.top;

    const dist = Math.abs(y - hitY);

    if(dist < bestDist){
      bestDist = dist;
    }

  });

  if(bestDist > hitRange) return;

  let judge = "GOOD";

  if(bestDist < 15){
    judge = "PERFECT";
  }

  // 一番近いノーツと同じタイミングのものを全部消す
  active
    .filter(n => {

      const rect = n.el.getBoundingClientRect();
      const game = document.getElementById("gameArea").getBoundingClientRect();

      const y = rect.top - game.top;

      const dist = Math.abs(y - hitY);

      return Math.abs(dist - bestDist) < 12;

    })
    .forEach(n => success(n));

  showJudge(judge);
}
/* ================= HIT ================= */

function hit(note){

  const t = getTime();

  const JUDGE_WINDOW = 0.6;

  let best = null;
  let bestDiff = 999;

  active.forEach(n=>{

    if(n.note !== note) return;

    const diff = n.hit - t;

    if(diff > JUDGE_WINDOW) return;
    if(diff < -JUDGE_WINDOW) return;

    const absDiff = Math.abs(diff);

    if(absDiff < bestDiff){
      bestDiff = absDiff;
      best = n;
    }

  });

  if(best && bestDiff < 0.30){

  success(best,note);

  score += 300;

  combo++;

  showJudge("PERFECT");

} else if(best && bestDiff < 0.6){

  success(best,note);

  score += 100;

  combo++;

  showJudge("GOOD");

} 

update();

}

/* ================= SUCCESS ================= */
function success(best) {
  // ✨ 手のタップ＆引き揚げ制御
  const handId = best.hand === "left" ? "leftHand" : "rightHand";
  const handEl = document.getElementById(handId);
  if (handEl) {
    handEl.classList.remove("tap");
    void handEl.offsetWidth; // クラス再適用用のハック
    handEl.classList.add("tap");
    
    clearTimeout(handEl.timer);
    handEl.timer = setTimeout(() => {
      handEl.classList.remove("tap");
      
      const rawTime = (performance.now() - startTime) / 1000 - 3;
      const gameTime = rawTime * speed;
      const hasIncoming = active.some(x => x.hand === best.hand && x.hit - gameTime < 0.4 && !x.missed);
      
      if (!hasIncoming) {
        handEl.classList.remove("active");
        handEl.style.top = "650px"; // 画面外に戻す
      }
    }, 180);
  }

  // 既存のノーツ消去処理
  best.el.classList.add("note-suck");
  setTimeout(() => {
    best.el.remove();
  }, 180);
  active = active.filter(n => n !== best);
  hitCount++;
  document.getElementById("hitCount").textContent = hitCount;
}

    "./songs/" + fileName,
    fileName
  );

}
/* ================= 📦 曲リストの定義 ================= */
const songList = [
    { file: "55.mid", title: "バイエル 55番" },
    { file: "3A_前奏曲.mid", title: "オールインワン 前奏曲" },
    { file: "3B_15_マリオネットのダンス.mid", title: "サウンドツリー マリオネット" },
    { file: "コナン.mid", title: "コナン メインテーマ" },
    { file: "革命.mid", title: "ショパン 革命" }
];

/* ================= 🛠️ メニューの動的生成 ================= */
function initSongMenu() {
    const menu = document.getElementById("songMenu");
    if (!menu) return;
    
    menu.innerHTML = ""; // 一旦中身を空っぽにする

    songList.forEach(song => {
        const btn = document.createElement("button");
        btn.className = "menuSongBtn";
        btn.textContent = song.title;
        
        btn.onclick = () => {
            loadSong(song.file);
            menu.style.display = "none"; // 🔑 「style」は1つだけに修正
        };
        
        menu.appendChild(btn);
    });
    console.log("メニューの作成が完了しました！ボタン数:", songList.length);
}

/* ================= 🎛️ メニューの表示・非表示切り替え ================= */
function toggleSongMenu() {
    const menu = document.getElementById("songMenu");
    if (!menu) return;
    
    // 現在の表示状態をチェックして切り替える
    if (menu.style.display === "none" || menu.style.display === "") {
        menu.style.setProperty("display", "flex", "important"); // 確実に縦並びで表示
    } else {
        menu.style.setProperty("display", "none", "important"); // 非表示
    }
}

// 画面が読み込まれたら確実に実行する（2つのタイミングで保険をかけます）
window.addEventListener("DOMContentLoaded", initSongMenu);
window.addEventListener("load", initSongMenu);
</script>
