<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>メロころ♪</title>

<script src="https://unpkg.com/tone"></script>
<script src="https://unpkg.com/@tonejs/midi"></script>

<style>

body{
  background:#222;
  color:white;
  text-align:center;
  font-family:sans-serif;
}

#ui{
  margin:10px;
  font-size:20px;
}

#score{ color:gold; }
#combo{ color:lime; }

#gameArea{
  position:relative;
  width:840px;
  height:320px;
  margin:auto;

  background-image: url("melokoro.png");
  background-size: cover;
  background-position:center;

  overflow:hidden;
  border:2px solid #444;
}

#hitLine{
  position:absolute;
  bottom:60px;
  width:100%;
  height:3px;
  background:yellow;
}

.note{
  position:absolute;
  width:24px;
  height:24px;
  background:orange;
  border-radius:50%;
  transform:translateX(-50%);
}

#keyboard{
  position:relative;
  width:840px;
  height:180px;
  margin:20px auto;
}

.white{
  position:absolute;
  width:60px;
  height:160px;
  background:white;
  border:1px solid black;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  font-size:12px;
}

.black{
  position:absolute;
  width:40px;
  height:100px;
  background:#222;
  border:2px solid white;
  z-index:10;
}

.correct{
  background:lime !important;
}

</style>
</head>

<body>

<h1>メロころ♪</h1>

<div id="ui">
<input type="file" id="midiFile">
<button onclick="playScore()">再生</button>

<br><br>

スコア: <span id="score">0</span>
　コンボ: <span id="combo">0</span>
</div>

<div id="gameArea">
  <div id="hitLine"></div>
</div>

<div id="keyboard"></div>

<script>

const synth = new Tone.Synth().toDestination();

/* ================= DATA ================= */

let scoreData = [];
let activeNotes = [];

let score = 0;
let combo = 0;

function updateUI(){
  document.getElementById("score").textContent = score;
  document.getElementById("combo").textContent = combo;
}

/* ================= MIDI LOAD ================= */

document.getElementById("midiFile")
.addEventListener("change", async (e)=>{

  const file = e.target.files[0];
  const buffer = await file.arrayBuffer();
  const midi = new Midi(buffer);

  scoreData = [];

  midi.tracks.forEach(t=>{
    t.notes.forEach(n=>{
      scoreData.push({
        time: n.time,   // 秒
        note: n.name
      });
    });
  });

  scoreData.sort((a,b)=>a.time-b.time);

});

/* ================= GAME SETTINGS ================= */

const travelTime = 2.5; // ★これが全ノーツ共通の落下時間
const endY = 260;

/* ================= PLAY ================= */

function playScore(){

  if(scoreData.length === 0){
    alert("MIDIを読み込んでね");
    return;
  }

  const startTime = Tone.now();

  scoreData.forEach(n => {

    const spawnTime = n.time - travelTime;

    if(spawnTime < 0) return;

    setTimeout(()=>{
      spawnNote(n.note, n.time);
    }, spawnTime * 1000);

  });

}

/* ================= NOTE ================= */

function spawnNote(noteName, hitTime){

  const key = document.querySelector(`[data-note="${noteName}"]`);
  if(!key) return;

  const gameRect = document.getElementById("gameArea").getBoundingClientRect();
  const keyRect = key.getBoundingClientRect();

  const note = document.createElement("div");
  note.className = "note";
  note.dataset.note = noteName;
  note.dataset.hitTime = hitTime;

  activeNotes.push(note);

  note.style.left =
    (keyRect.left - gameRect.left + keyRect.width/2) + "px";

  document.getElementById("gameArea").appendChild(note);

  let y = 0;

  const speed = endY / (travelTime * 60);

  const fall = setInterval(()=>{

    y += speed;
    note.style.top = y + "px";

    if(y >= endY){

      note.remove();
      activeNotes = activeNotes.filter(n => n !== note);
      combo = 0;
      updateUI();
      clearInterval(fall);
    }

  },16);

}

/* ================= HIT ================= */

function checkHit(noteName){

  const line = document.getElementById("hitLine").getBoundingClientRect();

  let hit = false;

  activeNotes.forEach(n=>{

    if(n.dataset.note !== noteName) return;

    const rect = n.getBoundingClientRect();
    const diff = Math.abs(rect.top - line.top);

    if(diff < 30){

      n.remove();
      activeNotes = activeNotes.filter(x => x !== n);

      score += 100;
      combo++;

      hit = true;
    }

  });

  if(!hit) combo = 0;

  updateUI();
}

/* ================= KEY INPUT ================= */

document.addEventListener("click", async (e)=>{

  const key = e.target.closest("[data-note]");
  if(!key) return;

  await Tone.start();

  const note = key.dataset.note;

  synth.triggerAttackRelease(note, "8n");

  checkHit(note);

  key.classList.add("correct");
  setTimeout(()=>key.classList.remove("correct"),120);

});

</script>

</body>
</html>

</body>
</html>
