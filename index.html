<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>メロころ♪</title>

<script src="https://unpkg.com/tone"></script>
<script src="https://unpkg.com/@tonejs/midi"></script>

<style>

body{
  background: linear-gradient(#2b2b2b,#1a1a1a);
  color:white;
  text-align:center;
  font-family:sans-serif;
}

/* ================= UI（サンリオ風） ================= */

#ui{
  margin:10px;
  font-size:20px;
  color:#ffd6f5;
}

#score{ color:#ffd36e; }
#combo{ color:#7df9ff; }

/* ================= GAME ================= */

#gameArea{
  position:relative;
  width:840px;
  height:320px;
  margin:auto;

  background-image: url("melokoro.png");
  background-size: cover;
  background-position: center;
  overflow:hidden;

  border-radius:20px;
  border:3px solid #ffb6d9;
}

#hitLine{
  position:absolute;
  bottom:60px;
  width:100%;
  height:3px;
  background:#fff;
  opacity:0.7;
}

/* 🌸 サンリオ風ノーツ */
.note{
  position:absolute;
  width:26px;
  height:26px;
  border-radius:50%;
  background: radial-gradient(circle at 30% 30%, #fff, #ff8fd1);
  box-shadow:0 0 10px #ff8fd1;
  transform:translateX(-50%);
}

/* ================= KEYBOARD ================= */

#keyboard{
  position:relative;
  width:840px;
  height:180px;
  margin:20px auto;
}

/* 白鍵 */
.white{
  position:absolute;
  width:60px;
  height:160px;
  background:white;
  border:1px solid #ddd;
  border-radius:0 0 8px 8px;

  display:flex;
  justify-content:center;
  align-items:flex-end;
  color:#444;
  font-size:14px;
}

/* 黒鍵（自動生成対応） */
.black{
  position:absolute;
  width:40px;
  height:100px;
  background:#222;
  border:2px solid #ffb6d9;
  border-radius:0 0 8px 8px;
  z-index:10;
}

/* キー演出 */
.correct{
  background:#7CFF6B !important;
}

</style>
</head>

<body>

<h1>🌸 メロころ♪</h1>

<div id="ui">
<input type="file" id="midiFile">
<button onclick="playScore()">再生</button>

<br><br>

スコア: <span id="score">0</span>
　コンボ: <span id="combo">0</span>
</div>

<div id="gameArea">
  <div id="hitLine"></div>
</div>

<div id="keyboard"></div>

<script>

const synth = new Tone.Synth().toDestination();

let scoreData = [];
let currentIndex = 0;
let activeNotes = [];

let score = 0;
let combo = 0;

/* ================= UI ================= */

function updateUI(){
  document.getElementById("score").textContent = score;
  document.getElementById("combo").textContent = combo;
}

/* ================= ① ピアノ自動生成（黒鍵付き） ================= */

const notes = [
  "C4","C#4","D4","D#4","E4","F4","F#4","G4","G#4","A4","A#4","B4",
  "C5","C#5","D5","D#5","E5","F5","F#5","G5","G#5","A5","A#5","B5"
];

const whiteKeys = [];
const keyboard = document.getElementById("keyboard");

let x = 0;

notes.forEach(n=>{

  const isBlack = n.includes("#");

  const key = document.createElement("div");
  key.dataset.note = n;
  key.textContent = isBlack ? "" : n.replace(/[0-9]/g,"");

  if(isBlack){
    key.className = "black";
    key.style.left = (x - 20) + "px";
  }else{
    key.className = "white";
    key.style.left = x + "px";
    whiteKeys.push(x);
    x += 60;
  }

  keyboard.appendChild(key);

});

/* ================= MIDI LOAD ================= */

document.getElementById("midiFile")
.addEventListener("change", async (e)=>{

  const file = e.target.files[0];
  const buffer = await file.arrayBuffer();
  const midi = new Midi(buffer);

  scoreData = [];

  midi.tracks.forEach(t=>{
    t.notes.forEach(n=>{
      scoreData.push({
        time:n.time,
        note:n.name
      });
    });
  });

  scoreData.sort((a,b)=>a.time-b.time);

});

/* ================= ② 音ゲー（BPM同期風） ================= */

function playScore(){

  if(scoreData.length === 0){
    alert("MIDIを読み込んでね");
    return;
  }

  currentIndex = 0;

  const startTime = Tone.now();

  function loop(){

    if(currentIndex >= scoreData.length) return;

    const n = scoreData[currentIndex];

    const delay = (n.time - (scoreData[0].time || 0));

    setTimeout(()=>{

      spawnNote(n.note);

    }, delay * 1000);

    currentIndex++;
    loop();
  }

  loop();
}

/* ================= NOTE ================= */

function spawnNote(noteName){

  const key = document.querySelector(`[data-note="${noteName}"]`);
  if(!key) return;

  const gameRect = document.getElementById("gameArea").getBoundingClientRect();
  const keyRect = key.getBoundingClientRect();

  const note = document.createElement("div");
  note.className = "note";
  note.dataset.note = noteName;

  activeNotes.push(note);

  note.style.left =
    (keyRect.left - gameRect.left + keyRect.width/2) + "px";

  document.getElementById("gameArea").appendChild(note);

  let y = 0;

  const speed = 2 + Math.random()*2; // ゆる音ゲー

  const fall = setInterval(()=>{

  y += speed;
  note.style.top = y + "px";

  if(y >= endY){
    note.remove();
    activeNotes = activeNotes.filter(n => n !== note);
    combo = 0;
    updateUI();
    clearInterval(fall);
  }

}, 16);

}

/* ================= HIT ================= */

function checkHit(noteName){

  const line = document.getElementById("hitLine").getBoundingClientRect();

  let hit = false;

  activeNotes.forEach(n=>{

    if(n.dataset.note !== noteName) return;

    const rect = n.getBoundingClientRect();
    const diff = Math.abs(rect.top - line.top);

    if(diff < 30){

      n.remove();
      activeNotes = activeNotes.filter(x => x !== n);

      score += 100;
      combo++;

      hit = true;
    }

  });

  if(!hit) combo = 0;

  updateUI();
}

/* ================= KEY INPUT ================= */

document.addEventListener("click", async (e)=>{

  const key = e.target.closest("[data-note]");
  if(!key) return;

  await Tone.start();

  const note = key.dataset.note;0

  synth.triggerAttackRelease(note,"8n");

  checkHit(note);

  key.classList.add("correct");
  setTimeout(()=>key.classList.remove("correct"),120);

});

</script>

</body>
</html>
