<script>

/* ===== グローバル（ここが全部の土台）===== */

let prevRMS = 0;

let baseline = 0;

let prevSpectrum = [];

let latestRMS = 0;
let latestSpectrum = [];

let lastHitDetect = 0;

let keyHighlight = {};
let songLibrary = [];
let usedNotes = new Set();



async function startMic() {

  const stream =
    await navigator.mediaDevices.getUserMedia({
      audio: true
    });

  const audioContext =
    new AudioContext();

  const source =
    audioContext.createMediaStreamSource(
      stream
    );

  const analyzer =
    Meyda.createMeydaAnalyzer({

      audioContext: audioContext,

      source: source,

      bufferSize: 512,

      featureExtractors: [
        "rms",
        "amplitudeSpectrum",
        "spectralCentroid"
      ],

      callback: (features) => {

        const currentRMS =
          features.rms || 0;

        const spectrum =
          features.amplitudeSpectrum || [];

        const centroid =
          features.spectralCentroid || 0;

        latestRMS = currentRMS;
        latestSpectrum = spectrum;

        /* ================= baseline ================= */

        baseline =
          baseline * 0.95 +
          currentRMS * 0.05;

        /* ================= flux ================= */

        let flux = 0;

        if(
          prevSpectrum.length &&
          prevSpectrum.length === spectrum.length
        ){

          for(let i = 0; i < spectrum.length; i++){

            flux += Math.abs(
              spectrum[i] - prevSpectrum[i]
            );

          }

        }

        /* ================= delta ================= */

        const delta =
          currentRMS - prevRMS;

        const now =
          performance.now();

        /* ================= DEBUG ================= */

        const debug =
          document.getElementById("debug");

        if(debug){

          debug.textContent =

            "RMS : "
            + currentRMS.toFixed(3)

            + " / Δ : "
            + delta.toFixed(3)

            + " / base : "
            + baseline.toFixed(3)

            + " / flux : "
            + flux.toFixed(3)

            + " / centroid : "
            + centroid.toFixed(0);

        }

        /* ================= HIT DETECT ================= */

        const attackMode =

          currentRMS > 0.015 &&

          currentRMS > baseline * 2 &&

          (
            flux > 0.15 ||
            delta > baseline * 1.2
          );

        if(
          attackMode &&
          now - lastHitDetect > 120
        ){

          console.log("押された！");

          hitNearest();

          lastHitDetect = now;

        }

        /* ================= SAVE ================= */

        prevRMS = currentRMS;

        prevSpectrum = [...spectrum];

      }

    });

  analyser = analyzer;

  analyser.start();

} // startMic end
/* ================= AUDIO （音）================= */
let mic;
let analyser;

const synth = new Tone.PolySynth(
  Tone.Synth,
  {
    oscillator:{
      type:"triangle"
    }
  }
).toDestination();


/* ================= STATE （ゲーム状態）================= */

let notes = [];
let active = [];
let index = 0;
let running = false;

let score = 0;
let combo = 0;

let hitCount = 0;
let totalCount = 0;

let whiteIndex = 0;

let splitNote = 60;
let speed = 0.5;


/* ================= TIMING （時間）=================== */

let startTime = 0;
let lastHitTime = 0;

function getTime(){

  return (
    (performance.now() - startTime)
    / 1000
    - 3
  );

}
/* ================= CONFIG （設定）================= */
const travelTime = 3;
const hitY = 500;
const spawnY = -50;

const SPEED_MAP = {
  slow: 0.4,
  normal: 0.6,
  fast: 0.8
};

const songConfig = {
  "song.mid": { split: 60 },
  "55.mid": { split: 70 },
  "song3.mid": { split: 65 }
};


const noteMap = {
  "C":"ど",
  "D":"れ",
  "E":"み",
  "F":"ふぁ",
  "G":"そ",
  "A":"ら",
  "B":"し"
};



/* ================= KEYBOARD ================= */

const keys = [
"C2","C#2","D2","D#2","E2","F2","F#2","G2","G#2","A2","A#2","B2",
"C3","C#3","D3","D#3","E3","F3","F#3","G3","G#3","A3","A#3","B3",
"C4","C#4","D4","D#4","E4","F4","F#4","G4","G#4","A4","A#4","B4",
"C5","C#5","D5","D#5","E5","F5","F#5","G5","G#5","A5","A#5","B5",
"C6","C#6","D6","D#6","E6","F6","F#6","G6","G#6","A6","A#6","B6"
];

const kb = document.getElementById("keyboard");

kb.innerHTML = "";


keys.forEach(n=>{

  const k = document.createElement("div");

  k.dataset.note = n;

  const isBlack = n.includes("#");

  k.className = isBlack ? "black" : "key";

  if(isBlack){

    k.style.left =
      (whiteIndex * 28 - 9) + "px";

  }else{

    k.style.left =
      (whiteIndex * 28) + "px";

    whiteIndex++;
  }

  kb.appendChild(k);

});

kb.style.width =
  (whiteIndex * 28) + "px";
/* ================= MIDI LOAD ================= */

document.getElementById("midiFile")
.addEventListener("change", async (e) => {

  const file = e.target.files[0];
  if (!file) return;

  const buf = await file.arrayBuffer();

  const array = Array.from(new Uint8Array(buf));

  localStorage.setItem("savedMidi", JSON.stringify({
    name: file.name,
    data: array
  }));

  loadMidi(buf, file.name);

});

/* ================= AUTO LOAD ================= */

window.addEventListener("load", () => {
  const saved = localStorage.getItem("savedMidi");
  if (!saved) return;
  const obj = JSON.parse(saved);

  const uint = new Uint8Array(obj.data);

  loadMidi(uint.buffer, obj.name);

});


/* ================= COLOR UTIL ================= */
function getNoteColor(note){

  if(note.hand === "left"){
    return "#4aa3ff"; // 青系
  }

  return "#ff4a4a";   // 赤系（右手）
}

function loadMidi(buffer, fileName){

  const midi = new Midi(buffer);

  notes = [];
  usedNotes.clear();

  // 🎯 曲ごとのスプリット（デフォルト60）
  splitNote = songConfig[fileName]?.split ?? 60;

  // ================= MIDI展開 =================
  midi.tracks.forEach(t => {

    t.notes.forEach(n => {

      const midiNum = n.midi;

      notes.push({
        time: n.time,
        note: n.name,
        midi: midiNum,

        // 🎯 左右判定
        hand: midiNum < splitNote ? "left" : "right"
        
      });
      usedNotes.add(n.name);
    });

  });

  // ================= 時間順ソート =================
  notes.sort((a, b) => a.time - b.time);

  // ================= 和音グループ化 =================
  let chordId = 0;

  for (let i = 0; i < notes.length; i++) {

    if (i > 0) {
      const gap = notes[i].time - notes[i - 1].time;

      if (gap > 0.03) {
        chordId++;
      }
    }

    notes[i].chordId = chordId;
  }


  // ================= UI更新 =================
  totalCount = notes.length;
  document.getElementById("totalCount").textContent = totalCount;

  console.log("MIDI OK:", notes.length);
  console.log("splitNote:", splitNote);

  paintKeyboard();
}


function paintKeyboard(){

  document
    .querySelectorAll(".key,.black")
    .forEach(key=>{

      const note = key.dataset.note;

      if(usedNotes.has(note)){

        // 曲で使う鍵盤は普通の色
        if(key.classList.contains("black")){

          key.style.background = "#222";

        }else{

          key.style.background = "white";

        }

        key.style.opacity = "1";

      }else{

        // 曲で使わない鍵盤は木目

        if(key.classList.contains("black")){

          key.style.background =
            "repeating-linear-gradient(90deg,#7b5a3a 0px,#7b5a3a 4px,#6a4b2d 4px,#6a4b2d 8px)";

        }else{

          key.style.background =
            "repeating-linear-gradient(90deg,#d8b184 0px,#d8b184 4px,#c89b6d 4px,#c89b6d 8px)";

        }

        key.style.opacity = "0.7";

      }

    });

}

/* ================= START ================= */
async function startGame(){

  await Tone.start();
  console.log("音声OK");

  // マイク初期化
  if(!analyser){
    await startMic();
  }

  // MIDIチェック
  if(!notes.length){
    alert("MIDIを読み込んでね");
    return;
  }

  // ゲームリセット
  stopGame();

  score = 0;
  combo = 0;
  update();

  running = true;
  index = 0;

  // カウントダウン開始
  countdown(3);
}


/* ================= COUNTDOWN ================= */

function countdown(n){

  const judge =
    document.getElementById("judge");

  judge.textContent = n;

  if(n <= 0){
  
    startTime = performance.now();

    judge.textContent = "START!";

   setTimeout(()=>{
    judge.textContent = "";
  },800);

  requestAnimationFrame(loop);

  return;
}

  setTimeout(()=>{
    countdown(n-1);
  },1000);

}

/* ================= STOP ================= */

function stopGame(){

  running = false;

  active.forEach(n=>n.el.remove());

  active = [];

  hitCount = 0;

  document.getElementById("hitCount")
    .textContent = 0;

}

function updateNextKey(){
return;
  document
    .querySelectorAll(".next")
    .forEach(k=>k.classList.remove("next"));

  if(active.length === 0) return;

  const next = active[0];

  const key = document.querySelector(
    `[data-note="${next.note}"]`
  );

  if(key){
    key.classList.add("next");
  }

}

/* ================= SPAWN ================= */
function spawn(n){

  const key =
    document.querySelector(
      `[data-note="${n.note}"]`
    );

  if(!key) return;

  const g =
    document.getElementById("gameArea")
    .getBoundingClientRect();

  const k =
    key.getBoundingClientRect();

  const el =
    document.createElement("div");

  el.className = "note";

  // 🎨 ここで色を付ける（正解ポイント）
  el.style.background = getNoteColor(n);

  el.style.left =
    (k.left - g.left + k.width / 2)
    + "px";

  const text = document.createElement("div");

  text.className = "note-text";

  text.textContent = noteMap[n.note[0]];

  el.appendChild(text);

  document
    .getElementById("gameArea")
    .appendChild(el);

  active.push({
    el,
    note: n.note,
    hit: n.time,
    chordId: n.chordId,
    missed: false,
    hand: n.hand
  });

  updateNextKey();
}


/* ================= Loop ================= */
function loop(){
const rawTime = (performance.now() - startTime) / 1000 - 3;
const gameTime = rawTime * speed;
 

  if(!running) return;
 
  const PREVIEW_TIME = 0.3; // 先読み量

 while(
    index < notes.length &&
    notes[index].time <= gameTime + travelTime + PREVIEW_TIME
  ){
    spawn(notes[index]);
    index++;
  }

  active.forEach(n => {

    const p =
      1 - ((n.hit - gameTime) / travelTime);

    const y =
      spawnY + p * (hitY - spawnY);

    n.el.style.top = y + "px";

    if(!n.missed && n.hit + 0.4 < gameTime){

      n.missed = true;
      n.el.remove();
      active = active.filter(x => x !== n);
    }

  });

  requestAnimationFrame(loop);

}

/* ================= KeyGuide ================= */

function updateKeyGuide(){
  return;
  const rawTime =
  (performance.now() - startTime) / 1000 - 3;

const currentTime =
  rawTime * speed;

document.querySelectorAll(".key")
  .forEach(k=>{
    k.classList.remove("guide");
    k.style.opacity = "";
  });

  const PREVIEW_TIME = 0.3;

  // ① 未来ノーツだけ青く光る
  for(let i = index; i < notes.length; i++){

    const n = notes[i];
    const diff = n.time - currentTime;

    if(diff < 0) continue;
    if(diff > travelTime + PREVIEW_TIME) break;

    const key = document.querySelector(`[data-note="${n.note}"]`);

    if(key){
      key.classList.add("guide");
      key.style.opacity = 0.4 + (1 - diff / (travelTime + PREVIEW_TIME)) * 0.6;
    }
  }
}
/* ================= ChordLine ================= */
function drawChordLines(){
  return;
  const layer = document.getElementById("lineLayer");
  layer.innerHTML = "";

  const groups = {};

  // chordIdごとにまとめる
  active.forEach(n => {

    if(!groups[n.chordId]){
      groups[n.chordId] = [];
    }

    groups[n.chordId].push(n);

  });

  // 各グループで線を描く
  Object.values(groups).forEach(group => {

    if(group.length < 2) return;

    // X位置を集める
    const xs = group.map(n => {
      const rect = n.el.getBoundingClientRect();
      const game = document.getElementById("gameArea").getBoundingClientRect();
      return rect.left - game.left + rect.width / 2;
    });

    const minX = Math.min(...xs);
    const maxX = Math.max(...xs);

    const line = document.createElement("div");

    line.style.position = "absolute";
    line.style.left = minX + "px";
    line.style.top = (hitY - 20) + "px";

    line.style.width = (maxX - minX) + "px";
    line.style.height = "4px";

    line.style.background = "rgba(255,255,255,0.6)";
    line.style.borderRadius = "2px";

    layer.appendChild(line);

  });

}
/* ================= hitnearest ================= */
function hitNearest(){

  const rawTime =
  (performance.now() - startTime) / 1000 - 3;

const t = rawTime * speed;

  let best = null;
  let bestDiff = 999;

  // 一番近いノーツを探す
  active.forEach(n=>{

    if(n.hitDone) return;

    const diff = Math.abs(n.hit - t);

    if(diff < bestDiff){
      bestDiff = diff;
      best = n;
    }

  });

  // 判定外
  if(!best || bestDiff > 0.6) return;

  let judge = "GOOD";
  let add = 100;

  if(bestDiff < 0.30){
    judge = "PERFECT";
    add = 300;
  }

  // 同じ和音グループ
  const targets = active.filter(n=>
    n.chordId === best.chordId &&
    !n.hitDone
  );

  // その中から1個だけ取る
  const target = targets[0];

  if(!target) return;

  success(target, target.note);

  hitFlash();

}
/* ================= HIT ================= */

function hit(note){

  const t = getTime();

  const JUDGE_WINDOW = 0.6;

  let best = null;
  let bestDiff = 999;

  active.forEach(n=>{

    if(n.note !== note) return;

    const diff = n.hit - t;

    if(diff > JUDGE_WINDOW) return;
    if(diff < -JUDGE_WINDOW) return;

    const absDiff = Math.abs(diff);

    if(absDiff < bestDiff){
      bestDiff = absDiff;
      best = n;
    }

  });


  // synth.triggerAttackRelease(note, "8n");

  if(best && bestDiff < 0.30){

  success(best,note);

  score += 300;
  addScoreEffect(300);

  combo++;

  hitFlash();
  showJudge("PERFECT");

} else if(best && bestDiff < 0.6){

  success(best,note);

  score += 100;
  addScoreEffect(100);

  combo++;

  hitFlash();
  showJudge("GOOD");

} 

update();

}




function hitFlash(){
  return;
  const flash =
    document.createElement("div");

  flash.className = "hit-flash";

  flash.style.top = (hitY - 10) + "px";

  document
    .getElementById("gameArea")
    .appendChild(flash);

  setTimeout(()=>{
    flash.remove();
  },180);

}
/* ================= SUCCESS ================= */

function success(best){

  best.el.remove();

  active =
    active.filter(n=>n!==best);

  hitCount++;

  document.getElementById("hitCount")
    .textContent = hitCount;

  updateNextKey();

}
/* ================= INPUT(関数） ================= */




function addScoreEffect(value){

  const el =
    document.getElementById("score");

  el.style.transform = "scale(1.3)";
  el.style.color = "yellow";

  setTimeout(()=>{

    el.style.transform = "scale(1)";
    el.style.color = "gold";

  },100);
}

document.getElementById("gameArea").addEventListener("touchstart", (e)=>{

  const key = document.elementFromPoint(
    e.touches[0].clientX,
    e.touches[0].clientY
  );

  if(key && key.dataset.note){
    hit(key.dataset.note);
  }

});
/* ================= UI ================= */

function update(){

  document.getElementById("hitCount")
    .textContent = hitCount;

  document.getElementById("totalCount")
    .textContent = totalCount;

}

function setSpeed(mode){

  const SPEED_MAP = {
    slow: 0.4,
    normal: 0.6,
    fast: 0.8
  };

  speed = SPEED_MAP[mode];

  const label =
    mode === "slow" ? "ゆっくり" :
    mode === "normal" ? "ふつう" :
    "はやい";

  document.getElementById("speedLabel")
    .textContent = label;
}


/* ================= JUDGE ================= */

function showJudge(text){

  const j =
    document.getElementById("judge");

  j.textContent = text;

  /* ★追加 */
  j.style.transform = "scale(1.4)";
  j.style.opacity = "1";

  if(text === "PERFECT"){
    j.style.color = "gold";
  }else if(text === "GOOD"){
    j.style.color = "cyan";
  }else{
    j.style.color = "red";
  }

  clearTimeout(j.timer);

  j.timer = setTimeout(()=>{

    j.textContent = "";
    j.style.transform = "scale(1)";
    j.style.opacity = "0.7";

  },500);
}

function comboEffect(){

  const mascot =
    document.getElementById("mascot");

  mascot.classList.remove("combo-bounce");

  void mascot.offsetWidth;

  mascot.classList.add("combo-bounce");
}
</script>
