<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>メロころ♪ CYTUS ENGINE</title>

<script src="https://unpkg.com/tone"></script>
<script src="https://unpkg.com/@tonejs/midi"></script>

<style>

body{
  background:#111;
  color:white;
  text-align:center;
  font-family:sans-serif;
}

/* ===== UI ===== */

#ui{ margin:10px; font-size:18px; }
#score{ color:gold; }
#combo{ color:lime; }

/* ===== GAME ===== */

#gameArea{
  position:relative;
  width:840px;
  height:420px;
  margin:auto;

  background:#1b1b1b;
  border:2px solid #444;
  overflow:hidden;
}

/* 判定ライン（Cytus風横ライン） */
#line{
  position:absolute;
  top:320px;
  width:100%;
  height:3px;
  background:yellow;
}

/* ノーツ（時間→位置変換） */
.note{
  position:absolute;
  width:28px;
  height:28px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff9bd5,#ff5aa5);
  box-shadow:0 0 10px #ff5aa5;
  transform:translateX(-50%);
}

/* キー */
#keyboard{
  position:relative;
  width:840px;
  height:180px;
  margin:auto;
}

.key{
  position:absolute;
  width:60px;
  height:160px;
  border:1px solid #333;
  background:white;
}

.black{
  width:40px;
  height:100px;
  background:#222;
  border:2px solid white;
}

.hit{
  background:#7CFF6B !important;
}

</style>
</head>

<body>

<h1>メロころ♪ CYTUS ENGINE</h1>

<div id="ui">
<input type="file" id="midiFile">
<button onclick="startGame()">再生</button>

<br><br>

スコア: <span id="score">0</span>
　コンボ: <span id="combo">0</span>
</div>

<div id="gameArea">
  <div id="line"></div>
</div>

<div id="keyboard"></div>

<script>

/* ================= AUDIO ================= */

const synth = new Tone.Synth().toDestination();

/* ================= STATE ================= */

let notes = [];          // MIDI
let activeNotes = [];    // 表示中ノーツ

let score = 0;
let combo = 0;

/* ================= SETTINGS ================= */

const travelTime = 2.0;      // 何秒で判定ラインへ行くか
const hitY = 320;
const spawnY = -50;

/* ================= TIME ================= */

let startTime = 0;

/* ================= KEYBOARD ================= */

const keyboardNotes = [
"C4","C#4","D4","D#4","E4","F4","F#4","G4","G#4","A4","A#4","B4",
"C5","C#5","D5","D#5","E5","F5","F#5","G5","G#5","A5","A#5","B5"
];

const keyboard = document.getElementById("keyboard");
let x = 0;

keyboardNotes.forEach(n => {

  const key = document.createElement("div");
  key.dataset.note = n;
  key.className = n.includes("#") ? "key black" : "key";

  if(!n.includes("#")){
    key.style.left = x + "px";
    x += 60;
  } else {
    key.style.left = (x - 20) + "px";
  }

  keyboard.appendChild(key);

});

/* ================= MIDI LOAD ================= */

document.getElementById("midiFile")
.addEventListener("change", async (e)=>{

  const file = e.target.files[0];
  const buf = await file.arrayBuffer();
  const midi = new Midi(buf);

  notes = [];

  midi.tracks.forEach(t=>{
    t.notes.forEach(n=>{
      notes.push({
        time: n.time,
        note: n.name
      });
    });
  });

  notes.sort((a,b)=>a.time-b.time);

});

/* ================= START ================= */

function startGame(){

  if(notes.length === 0){
    alert("MIDI読み込んでね");
    return;
  }

  startTime = performance.now();

  requestAnimationFrame(loop);
}

/* ================= MAIN LOOP ================= */

function loop(){

  const now = performance.now();
  const t = (now - startTime) / 1000;

  // ノーツ生成（未来予測）
  while(notes.length && notes[0].time <= t + travelTime){

    const n = notes.shift();
    spawnNote(n);
  }

  // ノーツ移動更新
  activeNotes.forEach(n => {

    const timeToHit = n.hitTime - t;
    const progress = 1 - (timeToHit / travelTime);

    const y = spawnY + progress * (hitY - spawnY);

    n.el.style.top = y + "px";

    // 消失
    if(progress > 1.2){
      n.el.remove();
      activeNotes = activeNotes.filter(x => x !== n);
      combo = 0;
      updateUI();
    }

  });

  requestAnimationFrame(loop);
}

/* ================= SPAWN ================= */

function spawnNote(n){

  const key = document.querySelector(`[data-note="${n.note}"]`);
  if(!key) return;

  const rect = key.getBoundingClientRect();
  const gameRect = document.getElementById("gameArea").getBoundingClientRect();

  const el = document.createElement("div");
  el.className = "note";

  el.style.left =
    (rect.left - gameRect.left + rect.width/2) + "px";

  document.getElementById("gameArea").appendChild(el);

  activeNotes.push({
    el: el,
    note: n.note,
    hitTime: n.time
  });
}

/* ================= HIT ================= */

function hit(note){

  const now = (performance.now() - startTime) / 1000;

  let best = null;
  let bestDiff = 999;

  activeNotes.forEach(n => {

    if(n.note !== note) return;

    const diff = Math.abs(n.hitTime - now);

    if(diff < bestDiff){
      bestDiff = diff;
      best = n;
    }

  });

  if(best && bestDiff < 0.15){

    best.el.remove();
    activeNotes = activeNotes.filter(n => n !== best);

    score += 100;
    combo++;

    synth.triggerAttackRelease(note, "8n");

  }else{
    combo = 0;
  }

  updateUI();
}

/* ================= INPUT ================= */

document.addEventListener("click", async (e)=>{

  const key = e.target.closest("[data-note]");
  if(!key) return;

  await Tone.start();

  hit(key.dataset.note);

  key.classList.add("hit");
  setTimeout(()=>key.classList.remove("hit"),100);

});

/* ================= UI ================= */

function updateUI(){
  document.getElementById("score").textContent = score;
  document.getElementById("combo").textContent = combo;
}

</script>

</body>
</html>
