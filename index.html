<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>木琴 MIDIゲーム 完成版</title>

<script src="https://unpkg.com/tone"></script>
<script src="https://unpkg.com/@tonejs/midi"></script>

<style>

body{
  background:#222;
  color:white;
  text-align:center;
  font-family:sans-serif;
}

/* ================= UI ================= */

#ui{
  margin:15px;
  font-size:20px;
}

button, select{
  font-size:18px;
  padding:6px 10px;
  margin:5px;
}

#score{
  color:gold;
}

#combo{
  color:lime;
}

/* ================= GAME AREA ================= */

#gameArea{
  position:relative;
  width:840px;
  height:320px;
  margin:auto;
  background:#111;
  overflow:hidden;
  border:2px solid #444;
}

/* 判定ライン */

#hitLine{
  position:absolute;
  bottom:60px;
  width:100%;
  height:16px;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,0,0.2),
      rgba(255,255,0,0.95),
      rgba(255,255,0,0.2)
    );

  box-shadow:0 0 15px yellow;
}

/* ノーツ */

.note{
  position:absolute;
  width:24px;
  height:24px;
  background:orange;
  border-radius:50%;
  transform:translateX(-50%);
}

/* ================= KEYBOARD ================= */

#keyboard{
  position:relative;
  width:840px;
  height:180px;
  margin:20px auto;
}

/* 白鍵 */

.white{
  position:absolute;
  width:60px;
  height:160px;
  background:white;
  border:1px solid black;

  display:flex;
  justify-content:center;
  align-items:flex-end;

  color:black;
  font-size:14px;

  user-select:none;
}

/* 黒鍵 */

.black{
  position:absolute;
  width:40px;
  height:100px;
  background:black;
  z-index:10;
}

/* 次に叩く鍵盤 */

.next{
  background:deepskyblue !important;
  box-shadow:0 0 20px cyan;
}

/* 黒鍵のnext */

.black.next{
  background:#00ccff !important;
}

/* 正解 */

.correct{
  background:lime !important;
}

/* 黒鍵correct */

.black.correct{
  background:lime !important;
}

/* ミス */

.wrong{
  background:red !important;
}

</style>
</head>

<body>

<h1>木琴 MIDIゲーム 完成版</h1>

<div id="ui">

<input type="file" id="midiFile">

<button onclick="playScore()">再生</button>

<select id="speedSelect">
  <option value="1">速度 1.0</option>
  <option value="0.75">速度 0.75</option>
  <option value="0.5">速度 0.5</option>
</select>

<br><br>

スコア:
<span id="score">0</span>

　

コンボ:
<span id="combo">0</span>

</div>

<!-- ================= GAME ================= -->

<div id="gameArea">
  <div id="hitLine"></div>
</div>

<!-- ================= KEYBOARD ================= -->

<div id="keyboard">

<!-- 白鍵 -->

<div class="white" style="left:0px" data-note="C4">ド</div>
<div class="white" style="left:60px" data-note="D4">レ</div>
<div class="white" style="left:120px" data-note="E4">ミ</div>
<div class="white" style="left:180px" data-note="F4">ファ</div>
<div class="white" style="left:240px" data-note="G4">ソ</div>
<div class="white" style="left:300px" data-note="A4">ラ</div>
<div class="white" style="left:360px" data-note="B4">シ</div>

<div class="white" style="left:420px" data-note="C5">ド</div>
<div class="white" style="left:480px" data-note="D5">レ</div>
<div class="white" style="left:540px" data-note="E5">ミ</div>
<div class="white" style="left:600px" data-note="F5">ファ</div>
<div class="white" style="left:660px" data-note="G5">ソ</div>
<div class="white" style="left:720px" data-note="A5">ラ</div>
<div class="white" style="left:780px" data-note="B5">シ</div>

<!-- 黒鍵 -->

<div class="black" style="left:40px" data-note="C#4"></div>
<div class="black" style="left:100px" data-note="D#4"></div>
<div class="black" style="left:220px" data-note="F#4"></div>
<div class="black" style="left:280px" data-note="G#4"></div>
<div class="black" style="left:340px" data-note="A#4"></div>

<div class="black" style="left:460px" data-note="C#5"></div>
<div class="black" style="left:520px" data-note="D#5"></div>
<div class="black" style="left:640px" data-note="F#5"></div>
<div class="black" style="left:700px" data-note="G#5"></div>
<div class="black" style="left:760px" data-note="A#5"></div>

</div>

<script>

/* ================= SYNTH ================= */

const synth = new Tone.Synth().toDestination();

/* ================= DATA ================= */

let scoreData = [];
let currentIndex = 0;

let score = 0;
let combo = 0;

/* ================= UI ================= */

function updateUI(){

  document.getElementById("score").textContent = score;
  document.getElementById("combo").textContent = combo;

}

/* ================= MIDI LOAD ================= */

document.getElementById("midiFile")
.addEventListener("change", async (e)=>{

  const file = e.target.files[0];

  const buffer = await file.arrayBuffer();

  const midi = new Midi(buffer);

  scoreData = [];

  midi.tracks.forEach(track=>{

    track.notes.forEach(note=>{

      scoreData.push({

        time:note.time * 1000,
        note:note.name

      });

    });

  });

  scoreData.sort((a,b)=>a.time-b.time);

  console.log(scoreData);

});

/* ================= NOTE SPAWN ================= */

function spawnNote(noteName){

  const key =
    document.querySelector(`[data-note="${noteName}"]`);

  if(!key) return;

  const gameRect =
    document.getElementById("gameArea")
    .getBoundingClientRect();

  const keyRect =
    key.getBoundingClientRect();

  const note = document.createElement("div");

  note.className = "note";

  note.dataset.note = noteName;

  note.style.left =
    (keyRect.left - gameRect.left + keyRect.width/2)
    + "px";

  document.getElementById("gameArea")
    .appendChild(note);

  let y = 0;

  const fall = setInterval(()=>{

    y += 3;

    note.style.top = y + "px";

    if(y > 320){

      note.remove();

      clearInterval(fall);

      combo = 0;

      updateUI();

    }

  },16);

}

/* ================= NEXT KEY ================= */

function lightNextKey(){

  document.querySelectorAll("[data-note]")
  .forEach(k=>{

    k.classList.remove("next");

  });

  if(currentIndex >= scoreData.length) return;

  const target =
    scoreData[currentIndex].note;

  const key =
    document.querySelector(
      `[data-note="${target}"]`
    );

  if(key){

    key.classList.add("next");

  }

}

/* ================= PLAY ================= */

async function playScore(){

  await Tone.start();

  currentIndex = 0;

  score = 0;
  combo = 0;

  updateUI();

  lightNextKey();

  const speed =
    parseFloat(
      document.getElementById("speedSelect").value
    );

  scoreData.forEach(item=>{

    setTimeout(()=>{

      spawnNote(item.note);

    },item.time / speed);

  });

}

/* ================= NOTE CHECK ================= */

function isCloseNote(input,target){

  const noteMap = {

    "C4":60,
    "C#4":61,
    "D4":62,
    "D#4":63,
    "E4":64,
    "F4":65,
    "F#4":66,
    "G4":67,
    "G#4":68,
    "A4":69,
    "A#4":70,
    "B4":71,

    "C5":72,
    "C#5":73,
    "D5":74,
    "D#5":75,
    "E5":76,
    "F5":77,
    "F#5":78,
    "G5":79,
    "G#5":80,
    "A5":81,
    "A#5":82,
    "B5":83

  };

  return Math.abs(
    noteMap[input] - noteMap[target]
  ) <= 1;

}

/* ================= HIT ================= */

function checkHit(noteName){

  const notes =
    document.querySelectorAll(".note");

  const line =
    document.getElementById("hitLine")
    .getBoundingClientRect();

  let hit = false;

  notes.forEach(n=>{

    if(!isCloseNote(
      n.dataset.note,
      noteName
    )) return;

    const rect =
      n.getBoundingClientRect();

    const diff =
      Math.abs(rect.top - line.top);

    if(diff < 30){

      n.remove();

      score += 100;

      combo++;

      hit = true;

      currentIndex++;

      lightNextKey();

    }

  });

  if(!hit){

    combo = 0;

  }

  updateUI();

}

/* ================= KEYBOARD ================= */

document.querySelectorAll("[data-note]")
.forEach(key=>{

  key.addEventListener("click",
  async ()=>{

    await Tone.start();

    const note =
      key.dataset.note;

    synth.triggerAttackRelease(
      note,
      "8n"
    );

    key.classList.add("correct");

    setTimeout(()=>{

      key.classList.remove("correct");

    },80);

    checkHit(note);

  });

});

/* ================= MIC ================= */

let analyser;
let mic;

async function startMic(){

  mic = new Tone.UserMedia();

  await mic.open();

  analyser =
    new Tone.Analyser("fft",2048);

  mic.connect(analyser);

  detectPitch();

}

startMic();

/* ================= PITCH ================= */

let lastDetected = "";
let stableCount = 0;

function detectPitch(){

  setInterval(()=>{

    const values = analyser.getValue();

    let max = -Infinity;
    let index = 0;

    for(let i=0;i<values.length;i++){

      if(values[i] > max){

        max = values[i];
        index = i;

      }

    }

    const freq =
      index *
      (Tone.context.sampleRate/2)
      / values.length;

    const note =
      frequencyToNote(freq);

    if(note){

      if(note === lastDetected){

        stableCount++;

      }else{

        stableCount = 0;

      }

      lastDetected = note;

      if(stableCount >= 2){

        checkHit(note);

      }

    }

  },100);

}

/* ================= FREQ TO NOTE ================= */

function frequencyToNote(freq){

  if(freq <= 0) return null;

  const noteNum =
    12 * (Math.log2(freq/440)) + 69;

  const rounded =
    Math.round(noteNum);

  const names = [
    "C","C#","D","D#","E","F",
    "F#","G","G#","A","A#","B"
  ];

  const octave =
    Math.floor(rounded/12)-1;

  const name =
    names[rounded % 12];

  return name + octave;

}

</script>

</body>
</html>
