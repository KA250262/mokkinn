<script>
const isLine = navigator.userAgent.includes("Line");

if (isLine) {
  document.body.innerHTML = `
    <div style="
      padding:30px;
      font-size:24px;
      text-align:center;
      color:black;
    ">
      <h2>おねがい</h2>
      「⋯」を押して<br>「デフォルトのブラウザで開く」<br>
      をえらんでね！
      </p>
    </div>
  `;
  throw new Error("LINE Browser");
}

// window.synth の定義部分を以下のように書き換えてください
window.synth = new Tone.Sampler({
  urls: {
  C3: "C3.wav",
  D3: "D3.wav",
  E3: "E3.wav",
  F3: "F3.wav",
  G3: "G3.wav",
  A3: "A3.wav",
  B3: "B3.wav",
  C4: "C4.wav",
  D4: "D4.wav",
  E4: "E4.wav",
  F4: "F4.wav",
  G4: "G4.wav",
  A4: "A4.wav",
  B4: "B4.wav",
  C5: "C5.wav"
},
  baseUrl: "./samples/",
  maxPolyphony: 32, // ←これ追加
  onload: () => {
    console.log("音源ロード完了");
  }
}).toDestination();


window.synth.volume.value = 0;

// ★ここに置く（Sampler 初期化のすぐ下）
window.synth.context.on('statechange', () => {
  console.log("AudioContext state:", window.synth.context.state);
});


// 音源読み込みの成否をチェック
Tone.loaded().then(() => {
    console.log("すべてのサンプルがロードされました");
}).catch((e) => {
    console.error("ロード中にエラー発生:", e);
});


let lastPlayTime = 0;
let prevRMS = 0;
let baseline = 0;
let prevSpectrum = [];
let latestRMS = 0;
let latestSpectrum = [];
let lastHitDetect = 0;
let loopRunning = false;
let loopId = null;
let usedNotes = new Set();
let score = 0;
let running = false;
let paused = false;
let pauseStart = 0;
let pausedTime = 0;
let notes = [];
let active = [];
let index = 0;
let combo = 0;
let hitCount = 0;
let totalCount = 0;
let whiteIndex = 0;
let splitNote = 60;
let stepIndex = 0;
let speed = 1.0;
let timeSignature = 4; // デフォルトは4拍子
let startTime = 0;
let currentSongName = ""; // 今選んでいる曲名
let noteZCounter = 1000;
let stepMode = false;
let rewindHolding = false;
let rewindTimer = null;
let lastNoteTime = {};
let practiceIndex = 0;
let autoLoadInitial = false;

// =========================
// 🎹 synth（音源）の再生
// =========================


function play(note){
    const now = Tone.now();

    // ★ ノートごとにガード（和音はブロックしない）
    if (!lastNoteTime[note]) lastNoteTime[note] = 0;
    if (now - lastNoteTime[note] < 0.03) return; 
    lastNoteTime[note] = now;

    // AudioContext が止まっていたら再開
    if (window.synth.context.state !== "running") {
        window.synth.context.resume();
    }

    try {
        window.synth.triggerAttackRelease(note, 1, now);
    } catch (e) {
        console.error("再生エラー:", e);
    }
}



// =========================
// 🎚 音量調整（安全な処理）
// =========================
if (window.synth?.volume) {
  window.synth.volume.rampTo(-3, 0.05);
}

// =========================
// 🎛 ボタンの取得（キャメルケースで統一）
// =========================
const playBtn  = document.getElementById("playBtn");
const stopBtn  = document.getElementById("stopBtn");
const pauseBtn = document.getElementById("pauseBtn");
const backBtn  = document.getElementById("backBtn");
backBtn.addEventListener("click", stepBack);
const stepBtn  = document.getElementById("stepBtn");


// 存在しないボタンを除外して配列にまとめる（安全対策）
const buttons = [
  playBtn,
  stopBtn,
  pauseBtn,
  backBtn,
  stepBtn,
].filter(Boolean);

document
  .getElementById("resetBtn")
  ?.addEventListener("click", emergencyReset);

// =========================
// ステップモード（コマ送り）の開始
// =========================
function startStepMode(){
  stepMode = true;
  running = false;

  const now = getTime();
  const nextIndex = notes.findIndex(n => n.time > now);

  if(nextIndex !== -1){
    stepIndex = nextIndex;
  }

  active.forEach(n => n.el?.remove());
  active = [];
}



function updatePosition(n, now) {
  if (!n.el) return;

  const travelTime = 3.0; // ノーツが降りてくる時間（秒）

  const y =
    ((n.time - now) / travelTime) * 300 * speed; 
    // ↑ speed（1.0〜1.5）をちゃんと効かせる

  n.el.style.transform = `translateY(${y}px)`;
}



// =========================
// オートモード（自動再生）の開始
// =========================
function startAutoMode() {
  // 1. まず残留しているノーツを物理的に全消去
  const notesLayer = document.getElementById("notes-layer");
  if (notesLayer) {
    notesLayer.innerHTML = ""; 
  }
  
  // 2. active配列をクリア
  active = [];

  // 3. 必要なフラグの切り替え
  stepMode = false;
  running = true;
  paused = false;

  // 4. 現在の時刻から再生を再開するために startTime を補正
  // 現在の再生位置(getTime())を考慮してスタート時間を設定し直す
  startTime = performance.now() - (getTime() / speed) * 1000;

  // 5. ループを開始
  requestAnimationFrame(loop);
}



// =========================
// 現在位置付近のノーツを表示
// =========================
function refreshNotes() {

  // 今あるノーツを全部消す
  document.getElementById("notes-layer").innerHTML = "";
  active = [];

  // 今の時間
  const gameTime = getTime() * speed;

  // indexは変更しない
  let i = index;

  while (
    i < notes.length &&
    notes[i].time <= gameTime + 0.25
  ) {
    spawn(notes[i]);
    i++;
  }

}

// =========================
// 🔄 ループ処理（ゲームの心臓部）
// =========================
function loop() {

  if (loopRunning && !running) {
    loopRunning = false;
    loopId = null;
    return;
  }
   if (loopRunning === false) {
    loopRunning = true;
  }

  loopRunning = true;
window.__gameVersion = (window.__gameVersion || 0) + 1;

  document.querySelectorAll(
    "#keyboard-top .guide-left, #keyboard-top .guide-right"
  ).forEach(key => {

    const alive = active.some(
      n =>
        n.keyTop === key &&

async function startMic() {
    try {
        if (!navigator.mediaDevices?.getUserMedia) return false;
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        const analyzer = Meyda.createMeydaAnalyzer({
            audioContext: audioContext,
            source: source,
            bufferSize: 512,
            featureExtractors: ["rms", "amplitudeSpectrum", "spectralCentroid"],
            callback: (features) => {
                const currentRMS = features.rms || 0;
                const spectrum = features.amplitudeSpectrum || [];
                const centroid = features.spectralCentroid || 0;
                latestRMS = currentRMS;
                latestSpectrum = spectrum;
                baseline = baseline * 0.95 + currentRMS * 0.05;
                let flux = 0;
                if (prevSpectrum.length && prevSpectrum.length === spectrum.length) {
                    for (let i = 0; i < spectrum.length; i++) {
                        flux += Math.abs(spectrum[i] - prevSpectrum[i]);
                    }
                }
                const delta = currentRMS - prevRMS;
                const now = performance.now();

                const debug = document.getElementById("debug");
                if (debug) {
                    debug.textContent = "RMS : " + currentRMS.toFixed(3) + " / base : " + baseline.toFixed(3);
                }

                const attackMode = currentRMS > 0.015 && currentRMS > baseline * 2 && (flux > 0.15 || delta > baseline * 1.2);
                if (attackMode && now - lastHitDetect > 300) {
                    hitNearest();
                    lastHitDetect = now;
                }
                prevRMS = currentRMS;
                prevSpectrum = [...spectrum];
            }
        });
        analyzer.start();
        analyser = analyzer;
        return true;
    } catch (e) { return false; }
}

function rewind() {
  // 1. オーディオ時間を実際に巻き戻す
  // (audioが定義されていない場合のエラー回避も入れています)
  if (typeof audio !== 'undefined' && audio) {
    audio.currentTime = Math.max(0, audio.currentTime - 5);
  }

  // 2. 基準となる startTime を巻き戻し後の時間に再計算
  // ※この関数は別途定義しておく必要があります（下記参照）
  updateBaseTime();

  // 3. ノーツ表示レイヤーを一度クリアしてリセット
  const notesLayer = document.getElementById("notes-layer");
  if (notesLayer) {
    notesLayer.innerHTML = "";
  }

  // 4. オーディオとノーツの状態を同期し直す
  // ※syncAudioState内でノーツの再描画が行われるようにしてください
  if (typeof syncAudioState === 'function') {
    syncAudioState();
  }
}




function noteToSolfege(noteName){
    const pitch = noteName.replace(/[0-9]/g, "");
    const normalize = {
        "C":"C", "C#":"C#","Db":"C#", "D":"D", "D#":"D#","Eb":"D#", "E":"E","Fb":"E",
        "F":"F","E#":"F", "F#":"F#","Gb":"F#", "G":"G", "G#":"G#","Ab":"G#", "A":"A",
        "A#":"A#","Bb":"A#", "B":"B","Cb":"B"
    };
    const p = normalize[pitch];
    if(!p) return pitch;

    const key = window.currentKey || "C";
    const majorScale = {
        C:  ["C","D","E","F","G","A","B"], G:  ["C","D","E","F#","G","A","B"],
        D:  ["C#","D","E","F#","G","A","B"], A:  ["C#","D","E","F#","G#","A","B"],
        E:  ["C#","D#","E","F#","G#","A","B"], B:  ["C#","D#","E","F#","G#","A#","B"],
        F:  ["C","D","E","F","G","A","A#"], Bb: ["C","D","D#","F","G","A","A#"],
        Eb: ["C","D","D#","F","G","G#","A#"], Ab: ["C","C#","D#","F","G","G#","A#"]
    };
    const solfege = ["ド","レ","ミ","ファ","ソ","ラ","シ"];
    const scale = majorScale[key];
    const idx = scale.indexOf(p);
    if(idx !== -1) return solfege[idx];

    const kana = {
        "C":"ド", "C#":"ド♯", "D":"レ", "D#":"レ♯", "E":"ミ", "F":"ファ",
        "F#":"ファ♯", "G":"ソ", "G#":"ソ♯", "A":"ラ", "A#":"ラ♯", "B":"シ"
    };
    return kana[p] || p;
}

const NOTE_EARLY = 0.3;

// spawn

function spawn(note, now = getTime()) {

const myVersion = window.__gameVersion;

  const keyTop = document.querySelector(
    `#keyboard-top [data-note="${note.note}"]`
  );
  if (!keyTop) return;

  const el = document.createElement("div");
  el.className = "note";

  // 鍵盤の位置に合わせて配置
  const isBlack = keyTop.classList.contains("black");

const x = keyTop.offsetLeft + keyTop.offsetWidth / 2 - 12
        + (isBlack ? 1 : 0);

const y = keyTop.offsetTop + (isBlack ? -10 : 0);

  el.style.left = x + "px";
  el.style.top = y + "px";

  // 色（手の分離）
  el.style.background = note.hand === "left" ? "#4aa3ff" : "#ff4a4a";

  // z-index管理（後勝ち表示）
  el.style.zIndex = noteZCounter++;

  // ノーツ表示用テキスト（白鍵だけ）
  const text = document.createElement("div");
  text.className = "note-text";

  // ここはあなたの関数使ってOK
  const sol = noteToSolfege(note.note);
  text.textContent = sol;

if (sol.includes("♯")) {
  text.classList.add("small");
  }

  el.appendChild(text);

  // DOM追加
  document.getElementById("notes-layer").appendChild(el);

  // active登録（ゲーム用データ）
  const obj = {
    el,
    note: note.note,
    time: note.time,
    hit: note.time,
    keyTop,
    hand: note.hand,
    chordId: note.chordId,
     duration: note.duration,

    y: 0,
    v: 0,

    guideShown: false,
    done: false,
    missed: false
  };

  active.push(obj);

  return obj;
}


function success(best) {
  if (best.done) return;
  best.done = true;

const fadeTime = Math.min(800, 100 + best.duration * 200);

best.el.style.animationDuration = fadeTime + "ms";
best.el.classList.add("note-suck");

best.removed = true;

setTimeout(() => {
    best.el?.remove();
    active = active.filter(n => n !== best);
}, fadeTime);

  best.keyTop?.classList.remove(
    "pre-hit-left",
    "pre-hit-right",
    "guide-left",
    "guide-right"
  );


  best.el.classList.add("note-suck");
  best.removed = true;

setTimeout(() => {
    best.el?.remove();
    active = active.filter(n => n !== best);
}, fadeTime);
}

function hitNearest() {
   console.log("🔥 hitNearest fired");
  const now = getTime();

  // guideが出てる & 未処理のノーツだけ対象
  const candidates = active.filter(n => 
    n.guideShown && 
    !n.done && 
    n.keyTop
  );

  if (candidates.length === 0) return;

  // 一番最初の候補を「基準」にする
  const best = candidates[0];

  // 同じキー・同じ手だけまとめる（安全）
  const group = active.filter(n =>
    n.guideShown &&
    !n.done &&
    n.keyTop &&
    n.chordId === best.chordId &&
    n.hand === best.hand
  );

  group.forEach(n => {
    // 🔥 光る
    n.keyTop.classList.add("hit");

    setTimeout(() => {
      n.keyTop?.classList.remove("hit");
    }, 200);

    // 成功処理（1回ずつ安全に）
    success(n);
  });
}

// 再生位置とフラグを現在の状態に強制同期させる関数
function syncAudioState() {
  const currentMusicTime = getTime();
  
  // 1. ノイズ防止：演奏中の音を止める
  if (window.synth) window.synth.releaseAll();
  
  // 2. 過去の音を「演奏済み」にロック
  notes.forEach(n => {
    n.played = (n.time <= currentMusicTime);
  });

  // 3. 画面のノーツをクリアして再構築
  document.getElementById("notes-layer").innerHTML = "";
  active = [];
  
  // 4. 今から少し先のノーツだけ表示対象にする
  notes.forEach(n => {
    if (n.time > currentMusicTime && n.time < currentMusicTime + 3.0) {
      spawn(n);
    }
  });
}

function resetAll() {
    // 1. まず現在の処理を完全に停止
    hardStop();
    
    // 2. 音声をすべて停止
    if (window.synth) {
        window.synth.releaseAll();
    }
    
    // 3. ゲームの制御フラグをリセット
    running = false;
    paused = false;
    stepMode = false;
    
    // 4. ループ処理をキャンセル
    if (loopId) {
        cancelAnimationFrame(loopId);
        loopId = null;
    }
    
    // 5. 【重要】画面上のノーツを物理的に全削除
    const notesLayer = document.getElementById("notes-layer");
    if (notesLayer) {
        notesLayer.innerHTML = ""; // ここで中身を空っぽにする
    }
    
    // 6. 配列を空にする
    active = [];
    
    // 7. インデックスと時間の初期化
    index = 0;
    stepIndex = 0;
    startTime = 0;
    
    // 8. 全てのノーツの再生フラグをリセット
    notes.forEach(n => {
        n.played = false;
        n.done = false;
        n.missed = false;
        n.guideShown = false;
    });
    
    // 9. 鍵盤の光りなどをリセット
    paintKeyboard();
    console.log("リセット完了: 画面とデータをクリアしました");
}

function nextNote() {
    const now = getTime();
    const next = notes.find(n => n.time > now);
    if (!next) return;

    const t = next.time;
    running = false;
    seekForwardTo(t);

    const chordNotes = notes.filter(n => Math.abs(n.time - t) < 0.01);
    chordNotes.forEach(n => spawn(n));
}

function prevNote() {
    const now = getTime();
    let i = index - 1;
    if (i < 0) return;

    const baseTime = notes[i].time;
    const group = [];
    while (i >= 0 && notes[i].time === baseTime) {
        group.unshift(notes[i]);
        i--;
    }
    index = i + 1;
    seekToTime(baseTime);
    group.forEach(n => play(n.note));
}

function seekForwardTo(t) {
    active.forEach(n => n.el?.remove());
    active = [];
    index = notes.findIndex(n => n.time >= t);
    if(index === -1) index = notes.length;
    startTime = performance.now() - t * 1000 - pausedTime;
    paintKeyboard();
}

function seekToTime(t) {
    hardStop();
    active.forEach(n => n.el?.remove());
    active = [];
    index = notes.findIndex(n => n.time >= t);
    startTime = performance.now() - t * 1000 - pausedTime;
    notes.forEach(n => {
        if (n.time >= t) {
            n.played = false;
            n.hitFired = false;
        }
    });
    paintKeyboard();
    rebuildVisibleNotes();
}

function rebuildVisibleNotes() {
    const gameTime = getTime();
    for (let i = index; i < notes.length; i++) {
        if (notes[i].time <= gameTime + NOTE_EARLY) {
            spawn(notes[i]);
        } else {
            break;
        }
    }
}

function stepForward() {

  document.getElementById("notes-layer").innerHTML = "";
  
    document.querySelectorAll("#keyboard-top .key, #keyboard-top .black")
        .forEach(k => {
            k.classList.remove("hit", "guide-left", "guide-right", "pre-hit-left", "pre-hit-right");
        });

    if (!notes || notes.length === 0) return;
    if (stepIndex >= notes.length) return;

    const currentTime = notes[stepIndex].time;
    const chordNotes = notes.filter(n => Math.abs(n.time - currentTime) < 0.01);

    active.forEach(n => n.el?.remove());
    active = [];

    chordNotes.forEach(n => {
        spawn(n);
        play(n.note);
        const key = document.querySelector(`#keyboard-top [data-note="${n.note}"]`);
        
        function flashKey(k, cls = "hit") {
            if (!k) return;
            k.classList.add(cls);
            setTimeout(() => k.classList.remove(cls), 120);
        }
        flashKey(key);
    });

    stepIndex = notes.findIndex(n => n.time > currentTime);
    if (stepIndex === -1) stepIndex = notes.length;
}
